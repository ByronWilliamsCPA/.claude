# Pre-commit hooks configuration
# See https://pre-commit.com for more information
#
# Hook stages:
# - pre-commit: Fast checks on every commit (formatting, syntax, security)
# - pre-push: Full quality checks before pushing (Qlty, full scans)
# - commit-msg: Conventional commit message validation
#
# Installation: curl https://qlty.sh | bash
# Documentation: https://docs.qlty.sh

# Required because PC-007 / PC-007b declare two `interrogate` hook instances
# via the `alias:` key. `alias` has been supported since pre-commit 1.14.0
# (Dec 2018); pinning this minimum makes older installs fail fast with a
# clear error rather than erroring mid-hook execution.
minimum_pre_commit_version: '1.14.0'

ci:
  autoupdate_schedule: monthly
  autofix_prs: true
  skip: [validate-front-matter, qlty-check, qlty-full, trufflehog, darglint, bandit, bandit-full, pip-audit]  # Skip local-only hooks

repos:
  # ============================================================================
  # Fast File Checks (Lightweight, run on every commit)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: c4a0b883114b00d8d76b479c820ce7950211c99b  # v4.5.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
        exclude: mkdocs.yml  # Exclude mkdocs.yml due to !ENV custom tags
      - id: check-json
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=10000']  # 10MB limit
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ['--fix=lf']
        stages: [pre-commit]
      - id: debug-statements
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]

  # ============================================================================
  # Secret Detection - TruffleHog
  # ============================================================================
  # Advanced secret detection beyond detect-private-key
  # Detects API keys, tokens, credentials, and other secrets
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: 05cccb53bc9e13bc6d17997db5a6bcc3df44bf2f  # v3.92.3
    hooks:
      - id: trufflehog
        # Scan staged files only. The git-history mode (--since-commit HEAD) also
        # traverses fetched remote branches in the local object store, producing
        # false positives from unmerged branches. Staged-file scanning is the
        # correct scope for a pre-commit hook; git history scanning belongs in CI.
        # Uses -z / xargs -0 to handle filenames with spaces; --diff-filter=d skips
        # staged deletions (the file no longer exists on disk to scan).
        # CHANGELOG.md is excluded: it accumulates hundreds of commit SHAs that
        # TruffleHog misidentifies as GitHub OAuth2 tokens (same 40-char hex format).
        # .submodules/ is excluded: third-party repos contain documentation examples
        # (postgres://user:pass, myuser:mypassword) that are clearly placeholder
        # credentials, not real secrets. Submodule secret scanning belongs in CI.
        entry: bash -c 'git diff --cached -z --name-only --diff-filter=d 2>/dev/null | grep -zv "^CHANGELOG\.md$" | grep -zv "^\.submodules/" | xargs -0 -r trufflehog filesystem --fail --no-update'
        pass_filenames: false
        stages: [pre-commit]

  # ============================================================================
  # Security Scanning - Bandit
  # ============================================================================
  # Dedicated Bandit hook for Python security analysis
  # Runs on changed files during pre-commit, full scan on pre-push
  # Configuration in pyproject.toml [tool.bandit]
  - repo: https://github.com/PyCQA/bandit
    rev: 36fd65054fc8864b4037d0918904f9331512feb5  # 1.7.10
    hooks:
      - id: bandit
        name: Bandit Security Scan (changed files)
        args: ['-c', 'pyproject.toml', '-ll']  # Medium+ severity only
        stages: [pre-commit]
        exclude: ^(tests|scripts|benchmarks|tools|fuzz)/

  # Full Bandit scan on pre-push (catches all issues before PR)
  - repo: local
    hooks:
      - id: bandit-full
        name: Bandit Security Scan (full src/)
        entry: uv run bandit -c pyproject.toml -r src/ -ll -q
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

  # ============================================================================
  # Dependency Vulnerability Scanning - pip-audit
  # ============================================================================
  # Runs on pre-push, scoped to dep file changes only, to avoid per-commit overhead.
  # Exit code 64 = advisory found. Medium+ severity blocks push.
  # Audits the active virtualenv; run 'uv sync' before push if needed.
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (dependency vulnerability scan)
        entry: uv run pip-audit
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(pyproject\.toml|requirements.*\.txt|uv\.lock)$

  # ============================================================================
  # Conventional Commits Enforcement
  # ============================================================================
  # Enforces conventional commit message format for semantic versioning
  - repo: https://github.com/commitizen-tools/commitizen
    rev: cc981fcb065527b6de0033b0cbf0432e69781901  # v4.9.1  # pragma: allowlist secret
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ============================================================================
  # pyproject.toml Validation
  # ============================================================================
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 435e09f5ed9fe57f3444ebfa54c663d0ac8033fe  # v0.20.2
    hooks:
      - id: validate-pyproject
        stages: [pre-commit]

  # ============================================================================
  # GitHub Workflow Validation
  # ============================================================================
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 37cd56d9d154dfb0648eaee8efc1040512700c47  # 0.29.4
    hooks:
      - id: check-github-workflows
        stages: [pre-commit]

  # ============================================================================
  # YAML Linting
  # ============================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # v1.38.0  # pragma: allowlist secret
    hooks:
      - id: yamllint
        args: [--config-file, .yamllint]
        stages: [pre-commit]

  # ============================================================================
  # Markdown Linting
  # ============================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: e72a3ca1632f0b11a07d171449fe447a7ff6795e  # v0.48.0  # pragma: allowlist secret
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]
        stages: [pre-commit]

  # ============================================================================
  # Qlty Unified Quality Checks (Pre-Push)
  # ============================================================================
  # Moved to pre-push to avoid clogging PR reviews with issues
  # Qlty runs all quality tools in a single pass:
  # - Ruff (linting + formatting)
  # - BasedPyright (type checking)
  # - Gitleaks (secrets detection)
  # - Markdownlint (markdown linting)
  # - Yamllint (YAML linting)
  # - OSV Scanner (dependency vulnerabilities)
  # - Code smells and complexity analysis
  #
  # Configure via .qlty/qlty.toml
  # Install: curl https://qlty.sh | bash && qlty plugins install
  - repo: local
    hooks:
      - id: qlty-check
        name: Qlty Code Quality Check (changed files)
        entry: >-
          bash -c "command -v qlty >/dev/null 2>&1 && qlty check --filter=diff || echo 'Qlty not installed - skipping (install: curl https://qlty.sh | bash)'"
        language: system
        types: [file]
        pass_filenames: false
        stages: [pre-push]
        verbose: true

      - id: qlty-full
        name: Qlty Full Quality Check (all files)
        entry: >-
          bash -c "command -v qlty >/dev/null 2>&1 && qlty check src/ || echo 'Qlty not installed - skipping'"
        language: system
        pass_filenames: false
        stages: [pre-push]
        verbose: true


  # ============================================================================
  # Custom Documentation Validation
  # ============================================================================
  - repo: local
    hooks:
      - id: validate-front-matter
        name: Validate documentation front matter
        # docs/reference/github-repos.md is a locally-generated catalog companion (not committed).
        entry: python tools/validate_front_matter.py docs --exclude docs/github-activity-reports docs/reference/github-repos.md
        language: python
        files: ^docs/.*\.md$
        pass_filenames: false
        stages: [pre-commit]
        additional_dependencies:
          - python-frontmatter>=1.1.0
          - pydantic>=2.0
          - ruamel.yaml>=0.18


  # ============================================================================
  # Python Docstring Coverage
  # ============================================================================
  # Interrogate ensures all Python code has proper docstrings
  # Targets: 85% coverage on scripts/, 80% coverage on src/
  - repo: https://github.com/econchick/interrogate
    rev: a6268877efd41a21197445cc04cbf28f9c6facba  # 1.7.0
    hooks:
      - id: interrogate
        alias: interrogate-scripts
        name: interrogate (scripts/, 85%)
        args: ['-v', '-c', 'pyproject.toml', '--fail-under', '85', 'scripts/']
        language_version: python3.12
        pass_filenames: false
        stages: [pre-commit]
      - id: interrogate
        alias: interrogate-src
        name: interrogate (src/, 80%)
        args: ['-v', '-c', 'pyproject.toml', '--fail-under', '80', 'src/']
        language_version: python3.12
        pass_filenames: false
        stages: [pre-commit]

  # ============================================================================
  # Docstring Argument Validation
  # ============================================================================
  # Darglint validates that docstring arguments match function signatures
  # Configuration in pyproject.toml [tool.darglint]
  - repo: local
    hooks:
      - id: darglint
        name: Darglint docstring validation
        entry: uv run darglint
        language: system
        types: [python]
        stages: [pre-commit]
        exclude: ^(tests|scripts|benchmarks|tools|noxfile\.py|\.claude/skills/)

  # ============================================================================
  # Ruff Linting and Formatting (PC-002)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2c8dce6094fa2b4b668e74f694ca63ceffd38614  # v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  # ============================================================================
  # Secret Baseline Detection (PC-005)
  # ============================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458  # v1.5.0  # pragma: allowlist secret
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        stages: [pre-commit]

  # ============================================================================
  # Em-Dash Prevention (PC-011)
  # ============================================================================
  - repo: local
    hooks:
      - id: no-em-dash
        name: no-em-dash
        language: pygrep
        entry: "—"
        files: \.(md|txt|rst|yaml|yml|toml|py|sh)$
        # security-audit L-05: the `.claude/` exclusion is overly broad.
        # Narrowing it requires first cleaning ~2400 existing em-dashes across
        # legacy standards, agent prompts, and skill workflows. The underlying
        # finding is documented in docs/security-analysis-2026-05-01.md (Phase 1
        # / Low / L-05). The writing-workspace/ subtree (eval test fixtures)
        # genuinely needs em-dashes preserved as adversarial inputs to the
        # writing pipeline and must remain excluded permanently.
        exclude: ^(\.claude/|\.pre-commit-config\.yaml|CHANGELOG\.md|CLAUDE\.md)
        description: "Prevents em-dash characters in source files (.claude/ tree excluded pending L-05 cleanup PR)"
        stages: [pre-commit]

  # ============================================================================
  # BasedPyright Type Checking (PC-003)
  # ============================================================================
  - repo: https://github.com/DetachHead/basedpyright
    rev: 3001a37849ae1f3e1176b0662007ab79320b8db3  # v1.9.1  # pragma: allowlist secret
    hooks:
      - id: basedpyright
        stages: [pre-commit]
        pass_filenames: false
        args: [src]
        additional_dependencies:
          - pydantic>=2.0.0
          - pydantic-settings>=2.0.0
          - structlog>=23.1.0

  # Renovate config validation (PC-015)
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 2a27c9fda39c7c05bc7488a10920c7700979c263  # v43.150.0  # pragma: allowlist secret
    hooks:
      - id: renovate-config-validator
        additional_dependencies: ["renovate@42.92.14"]

# Exclude patterns
# .submodules/ is excluded because submodule contents are owned by their upstream
# repos; pre-commit hooks in this repo must not auto-modify files inside them.
exclude: |
  (?x)^(
      \.git/|
      \.venv/|
      venv/|
      build/|
      dist/|
      .*\.egg-info/|
      __pycache__/|
      \.mypy_cache/|
      \.pytest_cache/|
      \.ruff_cache/|
      \.submodules/|
      data/|
      models/|
      .*\.pyc
  )$
