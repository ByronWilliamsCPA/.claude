# SonarQube / SonarCloud Project Configuration

sonar.projectKey=ByronWilliamsCPA_.claude
sonar.organization=byronwilliamscpa

# Display name in SonarCloud UI
sonar.projectName=Claude Code Configuration

# Path to source directories (comma-separated)
sonar.sources=src

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Python-specific settings
sonar.python.version=3.12

# Exclusions
sonar.exclusions=**/.worktrees/**,**/node_modules/**,**/*.pyc,**/__pycache__/**,**/dist/**,**/build/**,.venv/**,venv/**,tmp_cleanup/**

