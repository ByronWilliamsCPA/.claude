# SonarQube Project Configuration
# Required configuration for SonarScanner CLI

# Unique project identifier
sonar.projectKey=ByronWilliamsCPA_.claude

# Display name in SonarQube UI
sonar.projectName=Claude Code Configuration

# Project version
sonar.projectVersion=1.0.0

# Path to source directories (comma-separated)
sonar.sources=scripts

# Path to test directories (comma-separated)
#sonar.tests=tests

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Python-specific settings
sonar.python.version=3.12

# Exclusions (files/directories to skip)
sonar.exclusions=**/*.pyc,**/__pycache__/**,**/node_modules/**,**/dist/**,**/build/**,.venv/**,venv/**,tmp_cleanup/**

# Coverage report paths (if you have coverage data)
#sonar.python.coverage.reportPaths=coverage.xml

# Test report paths (if you have pytest-junit XML)
#sonar.python.xunit.reportPath=test-results.xml
