# REUSE Software Bill of Materials
# https://reuse.software/
# This file provides centralized licensing information for the entire project
# avoiding the need for SPDX headers in individual files.

version = 1
SPDX-PackageName = "claude_config"
SPDX-PackageSupplier = "Byron Williams"
SPDX-PackageDownloadLocation = "https://github.com/ByronWilliamsCPA/.claude"

# Source code (Python, tools, tests) - MIT
[[annotations]]
path = [
    "src/**",
    "tools/**",
    "tests/**",
    "validation/**",
    "fuzz/**",
    "benchmarks/**/*.py",
    "scripts/**/*.py",
    "modal/**/*.py",
    "*.py",
    "noxfile.py",
]
SPDX-License-Identifier = "MIT"
SPDX-FileCopyrightText = "2025 Byron Williams"

# Documentation - CC-BY-4.0
[[annotations]]
path = [
    "docs/**",
    "*.md",
    "tmp_cleanup/**/*.md",  # Temporary reference files
    "benchmarks/*.md",  # Benchmark documentation (not reports)
    "compliance-retrospectives/**/*.md",  # Audit retrospective reports
    "!LICENSES/*.txt",  # Exclude actual license text files
]
SPDX-License-Identifier = "CC-BY-4.0"
SPDX-FileCopyrightText = "2025 Byron Williams"

# Configuration files - CC0-1.0 (public domain dedication)
[[annotations]]
path = [
    "*.toml",
    "*.yml",
    "*.yaml",
    ".github/**",
    ".gitignore",
    ".gitattributes",
    ".pre-commit-config.yaml",
    ".readthedocs.yaml",
    ".markdownlintignore",  # Markdownlint ignore patterns
    ".secrets.baseline",  # detect-secrets baseline (generated)
    "mkdocs.yml",
    "poetry.lock",  # Dependency lockfile for reproducible builds
    "requirements/**/*.txt",  # Generated from poetry export
    "benchmarks/labelmaps/**/*.yaml",  # Benchmark label mappings
    ".zenodo.json",  # Zenodo metadata for DOI
]
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "2025 Byron Williams"

# Vale prose-linter configuration and custom styles - CC0-1.0
[[annotations]]
path = [
    ".vale.ini",
    "styles/**",
]
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "2025 Byron Williams"

# Data files and models - ODbL-1.0 (Open Database License)
[[annotations]]
path = [
    "data/**",
    "models/**",
]
SPDX-License-Identifier = "ODbL-1.0"
SPDX-FileCopyrightText = "2025 Byron Williams"

# Build artifacts and generated files - excluded from licensing
[[annotations]]
path = [
    "build/**",
    "dist/**",
    "site/**",
    "*.egg-info/**",
    "__pycache__/**",
    ".venv/**",
    "venv/**",
    ".nox/**",
    ".mypy_cache/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    "*.pyc",
    "*.pyo",
]
precedence = "override"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "2025 Byron Williams"

# Additional configuration and temporary files - CC0-1.0
[[annotations]]
path = [
    ".claude/settings.local.json",
    ".claude/**/*.json",  # Claude configuration files
    ".clusterfuzzlite/**",
    ".sonarlint/**",  # SonarLint IDE configuration
    ".qlty/**",  # Qlty configuration
    ".coderabbit.yaml",  # CodeRabbit AI review configuration
    ".vscode/**",  # VS Code settings
    ".idea/**",  # IntelliJ/PyCharm settings
    "concept.txt",
    "image_reference_sets.txt",
    "overrides/**",
    "renovate.json",
    "validate_workflows.sh",
    "scripts/**/*.sh",  # Shell scripts for automation
    "tmp_cleanup/**/*.txt",  # Temporary text files
    "tmp_cleanup/.gitkeep",  # Directory placeholder
    "sonar-project.properties",  # SonarCloud/SonarQube configuration
    "codemeta.json",  # CodeMeta software metadata
    ".zenodo.json",  # Zenodo DOI metadata
    "Makefile",  # Build automation
    "justfile",  # Just command runner
    "Taskfile.yml",  # Task runner configuration
]
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "2025 Byron Williams"

# Benchmark results and generated metadata files - CC0-1.0
[[annotations]]
path = [
    "benchmarks/reports/**/*.json",
    "benchmarks/reports/**/*.md",
    "codemeta.json",
    "benchmarks/LICENSES.md",
    "benchmarks/registry.yml",
    "notebooks/**/*.ipynb",  # Jupyter notebooks (Colab training examples)
    "session-report-*.html",  # Generated session usage reports (session-report skill output)
]
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "2025 Byron Williams"

# Claude Code configuration, skills, agents, standards, and MCP configs - MIT
[[annotations]]
path = [
    ".claude/**",
    "standards/**",
    "mcp/**",
    "tmp_cleanup/**",
    "settings.json",
    "hooks.json",
    "skills-lock.json",
    "uv.lock",
    "setup.sh",
    "setup-sonarlint.sh",
    ".claudeignore",
    ".env.example",
    ".env.mcp.example",
    ".gitmodules",
    ".markdownlint.json",
    ".mcp.json",
    ".prettierrc",
    ".shellcheckrc",
    ".snyk",  # Snyk scan policy (exclude-scoping config, same class as .trivyignore)
    ".trivyignore",
    ".yamllint",
    "scripts/README.md",
]
SPDX-License-Identifier = "MIT"
SPDX-FileCopyrightText = "2025 Byron Williams <byronawilliams@gmail.com>"

# Vendored third-party skill: meta-harness, ported from 001TMF/harness-forge (MIT).
# Overrides the blanket .claude/** owner annotation so the upstream author is
# credited, satisfying the MIT notice-retention requirement. License text lives in
# LICENSES/MIT.txt; provenance is documented in the skill's SKILL.md and LICENSE.
[[annotations]]
path = [
    ".claude/skills/meta-harness/**",
]
precedence = "override"
SPDX-License-Identifier = "MIT"
SPDX-FileCopyrightText = "2026 Tristan Farmer"
