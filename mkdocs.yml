# MkDocs Configuration for Claude Code Configuration
# Documentation: https://www.mkdocs.org/user-guide/configuration/

site_name: Claude Code Configuration
site_description: Global Claude Code development standards, commands, and configuration for all projects
site_author: Byron Williams
site_url: https://.claude.readthedocs.io
repo_url: https://github.com/ByronWilliamsCPA/.claude
repo_name: ByronWilliamsCPA/claude_config
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 Byron Williams

# Theme Configuration
theme:
  name: material
  custom_dir: overrides
  language: en

  # Color Palette
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Features
  features:
    - navigation.instant      # Instant loading
    - navigation.tracking     # Anchor tracking
    - navigation.tabs         # Top-level navigation tabs
    - navigation.sections     # Navigation sections
    - navigation.expand       # Expand sections by default
    - navigation.indexes      # Section index pages
    - navigation.top          # Back to top button
    - search.suggest          # Search suggestions
    - search.highlight        # Highlight search results
    - content.code.copy       # Copy code button
    - content.code.annotate   # Code annotations

  # Fonts
  font:
    text: Roboto
    code: Roboto Mono

  # Icons
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

  - autorefs  # Automatic cross-references

  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true
            show_if_no_docstring: false
            show_source: false
            show_root_heading: true
            show_root_toc_entry: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: alphabetical
            group_by_category: true
            show_category_heading: true
            filters:
              - "!^_"  # Hide private members
            extensions:
              - griffe_pydantic  # Render Pydantic constraints

  - section-index  # Section index pages

  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
      type: date

  - gen-files:
      scripts:
        - tools/gen_tools_catalog.py

# Markdown Extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
      toc_depth: 3

  # Python Markdown Extensions
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra Configuration
extra:
  org_name: "Byron Williams"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ByronWilliamsCPA
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY

# Navigation: persona-first (see ADR-007)
nav:
  - Home: index.md

  - Getting Started:
      - Overview: getting-started/index.md
      - 1. Install: getting-started/install.md
      - 2. Your First Agent: getting-started/first-agent.md
      - 3. Your First Skill: getting-started/first-skill.md
      - Picking Agents vs Skills: getting-started/picking.md
      - Troubleshooting: getting-started/troubleshooting.md

  - Architecture:
      - Overview: architecture/index.md
      - Install Model: architecture/install-model.md
      - Hook Pipeline: architecture/hook-pipeline.md
      - Agent Dispatch: architecture/agent-dispatch.md
      - MCP Tiered Loading: architecture/mcp-tiered-loading.md
      - Submodule Strategy: architecture/submodule-strategy.md
      - Rules vs Standards: architecture/rules-vs-standards.md
      - Diagrams: architecture/diagrams/index.md
      - Decisions (ADRs):
          - Index: architecture/adr/index.md
          - ADR-001 Two-Layer Symlink Install: architecture/adr/ADR-001-two-layer-symlink-install.md
          - ADR-002 Hook Composition: architecture/adr/ADR-002-hook-composition.md
          - ADR-003 Tiered MCP Loading: architecture/adr/ADR-003-tiered-mcp-loading.md
          - ADR-004 Skill vs Agent Boundary: architecture/adr/ADR-004-skill-vs-agent-boundary.md
          - ADR-005 Submodule Extension Model: architecture/adr/ADR-005-submodule-extension-model.md
          - ADR-006 Rules vs Standards: architecture/adr/ADR-006-rules-vs-standards.md
          - ADR-007 Dual-Audience Docs: architecture/adr/ADR-007-dual-audience-docs.md

  - Reference:
      - Overview: reference/index.md
      - Agents Catalog: reference/agents.md
      - Skills Catalog: reference/skills.md
      - Hooks: reference/hooks.md
      - MCP Strategy: reference/mcp.md
      - API: api-reference.md

  - Contributing:
      - Overview: contributing/index.md
      - Adding an Agent: contributing/adding-agents.md
      - Adding a Skill: contributing/adding-skills.md
      - Adding a Hook: contributing/adding-hooks.md
      - Writing ADRs: contributing/writing-adrs.md
      - Writing Diagrams: contributing/writing-diagrams.md
      - Frontmatter Standard: frontmatter-standard.md

  - Project:
      - Roadmap: project/roadmap.md
      - Changelog: project/changelog.md
      - License: project/license.md

# Exclude internal audit/admin docs that link outside the docs/ directory
exclude_docs: |
  content-review.md
  content_reviews/*
  ADRs/adr-template.md
  planning/project-plan-template.md
  planning/adr/README.md
  architecture/adr/_template.md
  architecture/diagrams/*.puml

# Validation
# strict mode disabled to allow links to repo root files
# These files are valid but outside docs/ directory
strict: false
