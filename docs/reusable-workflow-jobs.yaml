# Registry of reusable GitHub Actions workflows and the check names they produce.
# Maintained by scripts/seed-reusable-workflow-registry.py and updated when
# org-level workflow changes ship. CI-024 enforces 90-day freshness.
#
# Schema: each `produces` entry is the UNPREFIXED check name as defined inside
# the reusable workflow itself (the workflow's job-level `name:` field, or the
# job key if `name:` is absent). The validator applies the caller-job-name
# prefix at compare time, so a single registry entry is portable across repos
# that call the reusable workflow with different job names.
#
# External third-party reusable workflows are listed below with their known
# check names. These are not org-managed and are updated manually on a
# best-effort basis.

# ── External third-party workflows ──────────────────────────────────────────

slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml:
  produces:
    - generator_generic_slsa3
  source_repo: slsa-framework/slsa-github-generator
  last_verified: '2026-05-08'
  notes: >-
    External SLSA Level 3 provenance generator. Not a branch-protection
    required check; present in release workflows only. Check name varies by
    caller context; registry entry suppresses CI-022 unregistered warning.

