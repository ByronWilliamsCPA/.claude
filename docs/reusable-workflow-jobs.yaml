    # Delegates to python-scorecard.yml. The internal check name from that
    # downstream workflow is "OpenSSF Scorecard Analysis"; the calling job
    # in this wrapper is named "OpenSSF Scorecard (Reusable)" so the actual
    # GitHub-reported check is "<caller> / OpenSSF Scorecard (Reusable) / OpenSSF Scorecard Analysis".
    # The validator applies only the immediate caller-job prefix; deeper
    # delegation chains require the consumer workflow to model the leaf
    # check name explicitly. Listed here as the leaf for completeness.
    - OpenSSF Scorecard Analysis
  source_repo: ByronWilliamsCPA/.github
  last_verified: '2026-05-08'
ByronWilliamsCPA/.github/.github/workflows/security-analysis.yml:
