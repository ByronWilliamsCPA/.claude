    - Security Gate Validation
    # Plus the leaf checks from the python-security-analysis.yml reusable
    # this wrapper invokes. The actual GitHub-reported name nests one
    # additional level (caller-job / wrapper-job / leaf); modeling the
    # leaves here lets the consumer's manifest reference them by leaf name.
    - CodeQL Analysis
    - Dependency Review
    - Detect Security Changes
    - OSV Vulnerability Scanner
    - Python Security Scan
  source_repo: ByronWilliamsCPA/.github
