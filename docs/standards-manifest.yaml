    source_frameworks:
      - manifest-internal

  - id: CI-057
    domain: ci
    severity: important
    override_eligible: true
    not_applicable_when: >-
      Repo does not use org reusable workflows (no
      ByronWilliamsCPA/.github or williaby/.github reference in
      .github/workflows/*.yml). Skip silently when not applicable.
    description: >-
      renovate.json contains a packageRules entry targeting org workflow
      source repos with followTag set to the floating major version tag
      (v1). Without this, Renovate either ignores org workflow updates or
      opens PRs on every non-tagged commit.
    verify: "content_present: renovate.json, ByronWilliamsCPA/.github"
    source_frameworks:
      - manifest-internal

  - id: CI-058
    domain: ci
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Repo is not a Python project (no [project] table in pyproject.toml).
    description: >-
      python-sbom.yml reusable workflow is called from .github/workflows/ via
      uses: ByronWilliamsCPA/.github/.github/workflows/python-sbom.yml@<SHA>
      with a SHA-pinned ref (not @main, not a tag). Closes the gap (canonical
      missing-caller list and @main-pin list maintained in
      docs/audits/dependency-management-improvement-plan-2026-05-24.md S-9)
      where Python repos in the fleet ship with no SBOM gate at all, and others
      pin the workflow to floating @main (same risk class as the
      tj-actions/changed-files CVE-2025-30066 attack).
    verify: >-
      Search .github/workflows/*.yml for uses: ByronWilliamsCPA/.github/.github/
      workflows/python-sbom.yml@<ref>. The ref must be a 40-char SHA, not @main and
      not @vN tag form.
    source_frameworks:
      - manifest-internal
    notes: >-
      Added 2026-05-25 as severity: suggested. Will be promoted to important after
      rollout PR sweep deploys callers to the 4 missing repos and fixes the 6 @main
      pins. Cross-reference: docs/audits/dependency-management-improvement-plan-2026-05-24.md
      S-9, feedback_policy_execution_gap.md.

  - id: CI-059
    domain: ci
    severity: suggested
    override_eligible: true
    not_applicable_when: "renovate.json does not exist at repo root"
    description: >-
      renovate.json effective enabledManagers (after org template inheritance) includes
      every manager required by the detected ecosystem files in the repo. Concretely:
      if pyproject.toml has [project] then pep621 must be present; if .github/workflows/
      exists then github-actions must be present; if Dockerfile exists then dockerfile;
      if docker-compose*.yml then docker-compose; if package.json then npm; if *.tf then
      terraform. Catches the silent-failure class where Renovate is enabled but produces
      zero PRs because the manager for the actual ecosystem is missing (e.g., "poetry"
      declared for a uv-managed project, replace-not-merge semantics dropping pep621
      from per-repo override).
    verify: >-
      Read repo file inventory; read effective enabledManagers from renovate.json
      combined with the appropriate org template for the repo's owner
      (ByronWilliamsCPA/.github/renovate.json for ByronWilliamsCPA/* repos;
      williaby/.github/renovate.json for williaby/* repos). Renovate replaces,
      does not merge arrays; verify on the per-repo list, not the union. For
      each detected ecosystem file pattern, confirm the corresponding manager
      is in the effective list.
    source_frameworks:
      - manifest-internal
    notes: >-
      Added 2026-05-25 as severity: suggested. Will be promoted to important after
      the lint script is built and deployed as a local pre-commit hook and/or
      fleet-wide CI check. This is the structural successor to the v42-era PC-015
      schema-validation check (now retired post-v43 cutover); CI-059 catches a
      strictly larger class of misconfiguration (semantic coverage gaps that PC-015
      never caught even in principle). Likely accounts for most of the 47%
      BLOCKED_BY_CONFIG finding in docs/audits/dependabot-renovate-coverage-2026-05-24.md.
      Cross-reference: dependency-management-improvement-plan-2026-05-24.md S-3,
      feedback_policy_execution_gap.md.

  - id: CI-060
    domain: ci
    severity: suggested
    override_eligible: true
    not_applicable_when: ".github/workflows/ directory does not exist"
    description: >-
      All third-party GitHub Action references in .github/workflows/*.yml use a full
      40-character commit SHA pin (e.g., uses: actions/checkout@
      8edcb1bdb4e267140fa742c62e395cd74f332709 # v4.3.0), not a tag (@v4, @v4.3.0)
      or branch (@main) pin. Pinning to tags or branches exposes the workflow to
      retroactive pointer manipulation, the attack vector used in CVE-2025-30066
      (tj-actions/changed-files compromise, March 2025, affected 23,000+ repos).
      First-party org workflow refs (ByronWilliamsCPA/.github, williaby/.github)
      are governed by CI-056 and excluded from this check.
    verify: >-
      Grep .github/workflows/*.yml for `uses: ` references. For each reference
      whose owner is not ByronWilliamsCPA or williaby, the ref after @ must be a
      40-character hex SHA. Tag refs (@v\d+) and branch refs (@main, @master) fail.
      Allow trailing comment with the human-readable tag for readability.
    source_frameworks:
      - manifest-internal
    notes: >-
      Added 2026-05-25 as severity: suggested. Will be promoted to important after
      fleet-wide SHA-pinning PR sweep completes. Renovate's pinDigests: true
      packageRule automates ongoing maintenance; deploy that rule to the org template
      alongside this check. Cross-reference:
      dependency-management-improvement-plan-2026-05-24.md S-4.

  - id: CI-061
    domain: ci
    severity: critical
    override_eligible: false
    not_applicable_when: >-
      Audit target is not the homelab-infra repo. This check only applies to
      homelab-infra/services/renovate/docker-compose.yml.
    description: >-
      The Renovate self-hosted Docker image in homelab-infra is pinned to a
      cryptographic digest (sha256:...), not a floating tag. Tag-only pins leave a
      silent-upgrade vector: every systemd timer fire (or docker compose pull) can
      fetch a different image if upstream re-pushes the tag, with no audit trail of
      what changed. Digest pinning closes this and gives an immutable reference
      reviewable in PR diffs. The v43 cutover (homelab-infra PR #425) established
      the tag@sha256:digest format; this check ensures the pattern stays in place.
      A paired packageRule in config/config.json with pinDigests: true,
      minimumReleaseAge: 14 days, and automerge: false handles ongoing digest bumps
      via reviewable PRs.
    verify: >-
      Grep services/renovate/docker-compose.yml for the renovate service's image:
      line. The reference MUST match the regex
      ^renovate/renovate:[\w.-]+@sha256:[a-f0-9]{64}$ (image name fixed to
      renovate/renovate; tag AND 64-hex digest both present). A bare tag
      (e.g., renovate/renovate:43.150.0), a bare digest, or any non-renovate
      image name fails. This is the canonical form
      renovate/renovate:<tag>@sha256:<64-hex-digest>.
    source_frameworks:
      - manifest-internal
    notes: >-
      Added 2026-05-25 as severity: critical. The silent-upgrade vector this check
      prevents is directly observable: a re-pushed floating tag would pull a
      different image on the next timer fire with no PR or notification. The check
      is enforceable from day one (the digest pin landed in homelab-infra PR #425),
      so unlike CI-058/059/060 which start at suggested until rollout completes,
      CI-061 is critical from initial introduction. Cross-reference:
      docs/audits/dependency-management-improvement-plan-2026-05-24.md S-1.

  - id: CI-062
    domain: ci
    severity: important
    description: >-
      Repos that accept auto-merging dependency updates (Renovate or Dependabot
      with auto-merge enabled, or any RENOVATE_AUTOMERGE=true config) should
      enable merge_queue on the main branch ruleset to batch compatible changes.
      Without the queue, N sequential auto-merges trigger N(N+1)/2 CI runs from
      cascading rebases: each merge moves main forward and forces every other
      queued PR into BEHIND state, requiring another rebase plus full CI run.
      The cost incident in ByronWilliamsCPA/.github#154 (homelab-infra, 2026-05-24)
      consumed roughly 30 min of paid Actions minutes to land 5 trivial Renovate
      PRs. Queue-batched, the same workload would have required 1 to 2 CI runs.
    verify: |
      1. Check repo for auto-merge signals:
         - renovate.json at repo root contains "automerge": true (BWCPA org
           standard per CI-020; .renovaterc.json or .github/renovate.json
           accepted as non-standard fallback locations)
         - RENOVATE_AUTOMERGE org or repo secret set to true
         - .github/dependabot.yml present with an auto-approve workflow
      2. If no signal present: skip (treat as N/A per not_applicable_when).
      3. If signal present: query the GitHub Rulesets API and confirm a
         merge_queue rule exists on the main-branch ruleset specifically.
         The filter must pin the ruleset to main (either by the literal
         refs/heads/main include or the ~DEFAULT_BRANCH alias); a queue
         rule on a non-main ruleset does not satisfy this check:
         gh api repos/<org>/<repo>/rulesets --jq '.[] |
           select(.target=="branch") |
           select(.conditions.ref_name.include[]? == "refs/heads/main"
                  or .conditions.ref_name.include[]? == "~DEFAULT_BRANCH") |
           {name, rules: [.rules[] | select(.type=="merge_queue")]}'
         PASS if at least one merge_queue rule exists on the main-branch
         ruleset; FAIL otherwise.
    override_eligible: true
    not_applicable_when: "repo does not auto-merge any PRs"
    source_frameworks:
      - manifest-internal
    notes: >-
      Added 2026-05-25 as severity: important based on the cost incident in
      ByronWilliamsCPA/.github#154. The incident is real, measurable, and
      recurring: GitHub-hosted runner minutes are paid, Renovate batches arrive
      weekly, and the N(N+1)/2 cascade compounds with fleet size. Companion to
      CI-040, which covers the trigger side. Both are required for the queue to
      function: CI-040 ensures gates emit on merge_group, CI-062 ensures the
      ruleset enables the queue. Recommended ruleset settings:
      merge_method=SQUASH, max_entries_to_build=5, min_entries_to_merge=1,
      min_entries_to_merge_wait_minutes=5 (the wait prevents single-PR overhead
      while still batching when activity is steady).

  - id: CI-063
    domain: ci
    severity: suggested
    override_eligible: true
    not_applicable_when: "renovate.json does not exist at repo root"
    description: >-
      Per-repo renovate.json is a thin overlay containing only repo-specific
      rules, not duplicates of the global config or org template. Specifically,
      a per-repo renovate.json MUST NOT redeclare packageRules or groupName
      entries that already exist in the global config at
      homelab-infra/services/renovate/config/config.json or the org template at
      ByronWilliamsCPA/.github/renovate.json or williaby/.github/renovate.json.
      Renovate config layers use replace semantics on arrays, not merge, so a
      redundant per-repo packageRules array silently shadows the global rules.
      If the global config later changes (e.g., adds a new CVE auto-merge rule),
      the per-repo override will continue applying the stale rule set with no
      visible diff in the per-repo config file.
    verify: >-
      Read the repo's renovate.json. For each top-level array key
      (packageRules, groupName, ignoreDeps, postUpdateOptions, prHourlyLimit,
      schedule), check whether the same key is set in the applicable global
      config or org template. PASS if the per-repo value is genuinely different
      from the global value (a legitimate override). FAIL if the per-repo value
      is identical to or a subset of the global value (redundant shadow).
    source_frameworks:
      - manifest-internal
    notes: >-
      Added 2026-05-26 as severity: suggested. Diagnostic, not blocking;
      redundant overlays are harmless until the global config changes. The
      2026-05-26 audit (KL-004) identified this as a latent drift risk worth
      catching before the global config evolves further.

  - id: CI-064
    domain: ci
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Audit target is not the homelab-infra repo. This check only applies to
      homelab-infra/services/renovate/config/config.json.
    description: >-
      The Renovate global config explicitly sets platformAutomerge: true rather
      than relying on the v40+ default. Defensive against a future Renovate
      version flipping the default again. The 2026-05-26 audit found that the
      v42 to v43 cutover silently changed the platformAutomerge default behavior;
      had the global config been explicit, the cutover would have produced
      identical behavior regardless of the upstream default.
    verify: >-
      Read homelab-infra/services/renovate/config/config.json. PASS only when
      the top-level platformAutomerge key is present and set to true. A missing
      key (relying on Renovate's default) is a FAIL.
    source_frameworks:
      - manifest-internal
    notes: >-
      Added 2026-05-26 as severity: suggested. Defensive check; the current
      behavior is correct (v43 default is true), but explicitness in the global
      config removes a future failure mode where an upstream default flip would
      silently change fleet-wide auto-merge behavior with no audit signal.
      Originally introduced as CI-062 in PR #154; renumbered to CI-064 when
      the merge queue rollout PR (ByronWilliamsCPA/.github#154) landed CI-062
      on main first with a different semantic.

  - id: CI-065
    domain: ci
    severity: important
    override_eligible: false
    not_applicable_when: >-
      No workflow file whose name matches fuzz*.yml, *fuzzing*.yml, or
      *-fuzz.yml exists under .github/workflows/. When fuzz testing runs
      inline with pytest (Hypothesis @given in tests/fuzz/, no dedicated
      workflow), this check does not apply -- trigger scheduling is
      governed by the CI workflow (CI-001) instead.
    description: >-
      Any dedicated fuzz testing workflow (.github/workflows/fuzz*.yml,
      *-fuzzing.yml, or *-fuzz.yml) must not trigger on pull_request or
      push events. Coverage-guided fuzzing (atheris, libFuzzer) and
      large-scale property-based fuzzing runs have runtimes of 30-120
      minutes per corpus cycle. Wiring them as PR checks blocks merge
      throughput by the same mechanism as mutation testing (CI-053). Fuzz
      workflows must run on a weekly schedule plus manual workflow_dispatch
      only.
    verify: >-
      Enumerate .github/workflows/*.yml. For any workflow file whose name
      matches fuzz*.yml, *-fuzzing.yml, or *-fuzz.yml: read the on: block.
      PASS only when the on: block contains exactly `schedule:` (required)
      and optionally `workflow_dispatch:`, and no other trigger keys. FAIL
      on any pull_request, push, workflow_run, or release trigger. A
      schedule: block must exist with a cron no more frequent than weekly
      (the day-of-week field must not be '*' or a step expression). If
      multiple fuzz workflow files exist, every one must pass independently.
    source_frameworks:
      - manifest-internal
    notes: >-
      Added 2026-05-28. Companion to CI-053 (mutation testing trigger).
      Currently not applicable across the fleet -- the only repo with fuzz
      tests (llc-manager) runs them inline with pytest via Hypothesis @given,
      not a dedicated workflow. Check is forward-looking: prevents trigger
      drift if any repo later adds a dedicated fuzz workflow.

  - id: CI-066
    domain: ci
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Repo does not contain Python source files (no pyproject.toml with a
      [project] table), or has no test suite (no tests/ directory with
      Python files matching test_*.py or *_test.py), or Codecov reports
      line coverage below 80% for the default branch (per CI-054 -- mutation
      testing below 80% coverage produces high noise and low actionable
      signal), or repo is infrastructure, configuration, or documentation
      only (no src/ or app/ directory with substantive Python source).
    description: >-
      Python repos with an established test suite (80%+ line coverage)
      should have mutation-testing.yml configured. Mutation testing
      validates that tests detect real code changes rather than passing
      vacuously. A repo with a fully-passing test suite at 80%+ coverage
      but no mutation testing may have tests that never exercise the code
      paths they claim to cover. OSSF Silver criterion 6.1 cites mutation
      testing as one accepted form of code-quality dynamic analysis.
      This check flags the absence of the workflow; CI-053 governs correct
      trigger configuration once the workflow exists.
    verify: >-
      1. Confirm pyproject.toml exists with a [project] table. If absent,
         skip (not_applicable_when).
      2. Confirm tests/ contains at least one file matching test_*.py or
         *_test.py. If absent, skip.
      3. Consult CI-054 Codecov data: if line coverage is below 80% or
         unmeasured, skip (PASS silently -- pre-condition not met).
      4. Check whether .github/workflows/mutation-testing.yml exists.
         PASS if present (configuration correctness is CI-053's scope).
         WARN if absent: "Repo qualifies for mutation testing (Python +
         tests + 80%+ coverage) but mutation-testing.yml is missing."
    source_frameworks:
      - OpenSSF Silver Badge criterion 6.1
      - NIST SSDF PW.8.1
    notes: >-
      Added 2026-05-28. Current fleet state (2026-05-28): 12 repos have
      mutation-testing.yml across both orgs; 32 do not. The coverage gate
      (step 3) is the primary applicability filter -- run CI-054 data first
      to identify the qualifying subset before raising WARN findings for
      absent workflows. Repos without the workflow that appear to have
      Python source and tests include data_ingestor, gleif, monte_carlo,
      zen-mcp-server, and xero-practice-management, but coverage data is
      required to confirm they meet the 80% threshold.

  - id: CI-070
    domain: ci
    severity: suggested
    override_eligible: true
    description: >-
      No GitHub Actions workflow may interpolate attacker-controllable context
      values directly into a run: shell block. Direct interpolation
      (${{ github.event.*.title }}, ${{ github.head_ref }},
      ${{ github.event.*.body }}, ${{ github.event.*.name }},
      ${{ github.event.comment.body }}, ${{ github.event.discussion.body }},
      ${{ github.event.issue.title }}, ${{ github.event.issue.body }},
      ${{ github.event.pull_request.title }},
      ${{ github.event.pull_request.body }},
      ${{ github.event.pull_request.head.ref }},
      ${{ github.event.pull_request.head.label }},
      ${{ github.event.review.body }},
      ${{ github.event.review_comment.body }})
      substitutes raw attacker-supplied text before the shell parser sees it,
      enabling shell command injection. The safe pattern routes the value
      through an env: assignment and references it as a quoted shell variable.
      This is the canonical GitHub Actions script-injection vector
      (OWASP CI/CD-SEC-04, OpenSSF Scorecard Dangerous-Workflow). Doubly
      critical in AI-assisted workflows: injected text in a PR title or branch
      name can steer agent shell commands executing inside CI.
    verify: |
      For each .yml file under .github/workflows/:
        Extract all run: block contents (single-line and multi-line | blocks).
        Search extracted text for patterns matching:
          \$\{\{\s*github\.event\.(issue|pull_request|comment|discussion|review|review_comment)\.(title|body|name)\s*\}\}
          \$\{\{\s*github\.head_ref\s*\}\}
          \$\{\{\s*github\.base_ref\s*\}\}
          \$\{\{\s*github\.event\.pull_request\.head\.(ref|label)\s*\}\}
        FAIL if any match is found inside a run: block body.
        The following patterns are NOT a FAIL (safe, non-shell contexts):
          - The same expression appears in env: key assignments (not inside run:)
          - The same expression appears in with: key assignments
          - The same expression appears in if: conditions
          - github.event.pull_request.number in concurrency.group (integer)
        Run: grep -rn "\${{ github\.event\." .github/workflows/ | grep -v "env:" |
          grep -v "with:" | grep -v "if:" | grep -v "concurrency:"
        Any remaining hits require manual inspection to confirm they are not
        inside a run: block. FAIL if any are.
    source_frameworks:
      - OWASP Top 10 CI/CD-SEC-04 Poisoned Pipeline Execution
      - OpenSSF Scorecard Dangerous-Workflow
      - GitHub Security Hardening for GitHub Actions (script injection section)
      - NIST SSDF PW.4.1
    notes: >-
      Added 2026-05-28. CI-043 covers the pull_request_target + checkout
      pattern; this check covers the orthogonal direct-interpolation pattern.
      Both are required: a workflow on pull_request (not pull_request_target)
      that directly interpolates github.head_ref into run: is not caught by
      CI-043 but is caught by CI-070.
      Safe remediation for any flagged workflow: move the expression to an
      env: assignment and reference it as a quoted variable in the run: block.
      Example bad pattern:
        run: git checkout "${{ github.head_ref }}"
      Example safe pattern:
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git checkout "$HEAD_REF"
      Per the policy-execution-gap pattern (feedback_policy_execution_gap.md):
      introduced as severity: suggested with override_eligible: true for the
      initial rollout. Promotion target: critical + override_eligible: false
      after a fleet sweep confirms 100% clean across all 44 repos. Do not
      promote before the sweep; a repo with a pre-existing violation would
      immediately gate compliance with no remediation path documented.
      This repo (ByronWilliamsCPA/.claude) was confirmed clean on 2026-05-28:
      all github.event.* usage is in env: assignments, if: conditions, or
      concurrency.group (integer context only).

  - id: CI-071
    domain: ci
    severity: suggested
    description: >-
      No job in any workflow may grant a broader permission set at the job level than
      is required for that job's steps. A narrow top-level permissions block paired
      with a permissive job-level override (e.g., contents: write, id-token: write,
      packages: write on a job that only reads) defeats the top-level restriction.
    verify: |
      For each .github/workflows/*.yml that has a top-level permissions block:
        For each job that declares its own permissions: block:
          FLAG (do not auto-fail) if the job-level block grants any scope set to
          "write" or "admin" for scopes not explicitly required by the steps in
          that job (heuristic: step uses: or run: does not reference an action
          or command requiring that scope).
      Known-required grants: release jobs need contents: write; SLSA/attestation
      jobs need id-token: write; GHCR publish needs packages: write. Document
      per-job justification in a comment above the permissions block.
    override_eligible: true
    notes: >-
      Added 2026-05-28. Suggested severity on first pass; escalate to important
      after fleet audit establishes which job-level grants are justified. This
      check is complementary to CI-033 (top-level block presence), not a replacement.
      A workflow that passes CI-033 can still fail CI-071 if its job-level block
      over-grants.

  - id: FOUND-015
    domain: foundations
    severity: suggested
    override_eligible: true
    description: >-
      Verify docs/ADRs/ or docs/architecture/ directory exists and at
      least one ADR contains a "Security Considerations" section.
      NIST SSDF PW.2.1 requires design review for security concerns;
      ADR sections provide the documented trail.
    verify: >-
      Run: grep -rl "Security Considerations\|Security considerations"
      docs/ADRs/ docs/architecture/ 2>/dev/null | wc -l; WARN if 0.
    source_frameworks:
      - NIST SSDF PW.2.1
      - NIST SSDF PO.1.1

  - id: FOUND-016
    domain: foundations
    severity: critical
    description: >-
      LICENSES/ files contain no unfilled OSI-template placeholders.
      A LICENSE with literal angle-bracket placeholders reads as
      unlicensed to most automated license scanners (SPDX, REUSE,
      ScanCode), regardless of whether the project is properly licensed
      via REUSE.toml.
    verify: >-
      For each file under LICENSES/ (or LICENSE / LICENSE.txt at the
      repo root if no LICENSES/ directory exists), grep for literal
      placeholders: "<year>", "<copyright holders>", "<name of author>",
      "<organization>". Any angle-bracket placeholder in license text
      is a FINDING. LICENSES/ files and REUSE.toml are orthogonal:
      REUSE.toml carries per-file copyright statements, while LICENSES/
      files carry license text. Placeholders in license text are
      unacceptable regardless of REUSE.toml contents, because most
      automated scanners (SPDX, REUSE, ScanCode) read the license file
      directly and do not resolve attribution from REUSE.toml.
    override_eligible: false
    not_applicable_when: "repo has no LICENSE, LICENSE.txt, or LICENSES/ directory (a license-absence check is planned but not yet defined)"
    source_frameworks:
      - REUSE Specification 3.3
      - SPDX REUSE Annex
    notes: >-
      Introduced after the reference-library audit (2026-05-15) found
      template placeholders in shipped LICENSE files. The check is
      mechanical (grep for angle-bracket strings) and false-positive
      rate is effectively zero given that legitimate license text never
      contains the OSI template placeholder syntax.

  - id: OSSF-011
    domain: ossf
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Repo does not contain Python source files (no pyproject.toml with a
      [project] table). Non-Python repos have no fuzz testing surface.
    description: >-
      Verify the repository has a fuzz testing setup (atheris, libFuzzer,
      Hypothesis @given in a dedicated tests/fuzz/ directory, or a
      fuzz workflow). OpenSSF Silver badge criterion 6.1 requires dynamic
      analysis with many diverse inputs beyond mutation testing. Mutation
      testing (CI-053) is unit-test quality measurement, not input fuzzing.
    verify: >-
      Check for actual fuzz testing setup; ruff lint-ignore configurations
      that mention Atheris in comments are NOT sufficient:
      1. tests/fuzz/ directory exists and contains at least one .py file
         that imports atheris, defines TestOneInput, or uses @given
         (Hypothesis property testing).
      2. pyproject.toml lists atheris or libFuzzer as an actual dependency
         in [project.optional-dependencies], [tool.uv.dev-dependencies], or
         [build-system.requires] -- not inside a comment or ruff config block.
      3. .github/workflows/ contains a workflow file whose name matches
         fuzz*.yml, *-fuzzing.yml, or *-fuzz.yml.
      WARN if none found. Note: ruff ignore rules suppressing N802 or S110
      with inline comments citing Atheris naming conventions are pre-configured
      stubs in the cookiecutter template, not fuzz tests. See OSSF-013 for
      the companion check evaluating whether fuzz testing SHOULD be present
      based on the repo's external-input surface.
    source_frameworks:
      - OpenSSF Silver Badge criterion 6.1
      - NIST SSDF PW.8.2

  - id: OSSF-012
    domain: ossf
    severity: suggested
    override_eligible: true
    description: >-
      Verify any PATs used as repository secrets are fine-grained
      personal access tokens (not classic PATs). Fine-grained PATs
      support per-repo scoping and shorter expiry, satisfying SOC 2
      CC6.1 least-privilege controls.
    verify: >-
      Manual check: Review repo secrets in GitHub UI for any token
      values; verify each is a fine-grained PAT. Additionally,
      grep docs/security-analysis*.md for a documented PAT policy.
    source_frameworks:
      - SOC 2 CC6.1
      - OpenSSF Scorecard Token-Permissions
      - GitHub Security Hardening

  - id: OSSF-013
    domain: ossf
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Repo does not contain Python source files (no pyproject.toml with a
      [project] table), or is infrastructure, configuration, or
      documentation only (no src/ or app/ directory with substantive
      Python source), or has no detectable external-input-processing
      patterns (see verify step 1 -- no HTTP API framework, no file
      parsing from external sources, no CLI accepting arbitrary data).
    description: >-
      Python repos that expose HTTP API endpoints or process
      external/untrusted input should have fuzz testing configured. Fuzz
      testing validates that input-handling code survives unexpected or
      adversarial inputs without raising unhandled exceptions, crashes, or
      data corruption. OSSF Silver criterion 6.1 requires at least one
      form of dynamic analysis with diverse inputs. Accepted forms include
      atheris/libFuzzer corpus-guided fuzzing, Hypothesis @given-decorated
      property tests in a dedicated tests/fuzz/ directory, or OSS-Fuzz
      integration. OSSF-011 checks whether any fuzz setup exists; this
      check evaluates whether one SHOULD exist based on the repo's input
      surface. Repos with no external input processing (pure computation
      libraries, config-only repos) are exempt via not_applicable_when.
    verify: >-
      1. Detect external-input-processing patterns in src/ or app/:
         - HTTP API: grep -r "FastAPI()\|APIRouter\|@app\.(get\|post\|put
           \|delete\|patch)\|@router\.(get\|post\|put\|delete\|patch)"
         - File parsing from external sources: grep -r "UploadFile\|
           request\.files\|open(.*request\|BytesIO\|StreamingResponse"
         - CLI accepting data: grep -r "argparse\|@click\.argument\|
           typer\.Argument" combined with file or stdin patterns
         If none found anywhere in src/ or app/, PASS silently
         (not_applicable_when applies).
      2. Check for fuzz testing setup using OSSF-011 criteria (tests/fuzz/
         with @given or TestOneInput, atheris in actual dependencies, or
         fuzz workflow file). If any found, PASS.
      3. If step 1 found external-input patterns but step 2 found no fuzz
         setup: WARN "Repo has external-input-processing patterns but no
         fuzz testing (tests/fuzz/, atheris dependency, or fuzz workflow).
         See OSSF Silver criterion 6.1."
    source_frameworks:
      - OpenSSF Silver Badge criterion 6.1
      - NIST SSDF PW.8.2
    notes: >-
      Added 2026-05-28. Companion to OSSF-011 (presence check) and CI-065
      (trigger scheduling). Current fleet state (2026-05-28): llc-manager
      is the only repo with fuzz tests (Hypothesis @given in tests/fuzz/).
      API repos without fuzz testing that appear to qualify based on
      FastAPI/APIRouter usage include rag-processor, fragrance-rater,
      data_ingestor, family-office-portal, and gleif -- run this check
      against each to confirm the input-surface detection before raising
      findings.

  - id: OSSF-014
    domain: ossf
    severity: important
    override_eligible: false
    description: >-
      Manual 2FA attestation for the williaby GitHub user account is present,
      current (within 90 days), and renewal_deadline is in the future.
      GitHub user accounts do not expose 2FA status via the org-2FA API,
      so a dated attestation file is the sole verifiable record.
    verify: |
      FAIL if docs/security/2fa-attestation.yaml does not exist.
      FAIL if no entry for account: williaby is present.
      FAIL if two_factor_enabled is not true.
      FAIL if confirmed_date is absent or older than 90 days from audit date.
      FAIL if renewal_deadline is absent or in the past.
      PASS if all fields are present, two_factor_enabled is true, confirmed_date
           is within 90 days, and renewal_deadline is in the future.
    notes: >-
      Added 2026-05-28 to close the gap left by OSSF-007, which only covers the
      ByronWilliamsCPA org (org-2FA API). The williaby account holds 26 of the
      44 fleet repos and has no API-verifiable 2FA check. The attestation file
      lives in this repo (ByronWilliamsCPA/.claude) only, not in each fleet repo;
      this check is fleet-scoped against the standards authority, so a sweep
      reports one finding (this repo), not 44. Quarterly renewal is sufficient;
      set a calendar reminder or scheduled cron task to renew before
      renewal_deadline expires. The initial committed attestation uses placeholder
      values (two_factor_enabled: false) and is expected to FAIL until the owner
      verifies 2FA on the williaby account and fills the real confirmed_date and
      renewal_deadline.

  - id: OSSF-015
    domain: ossf
    severity: important
    override_eligible: true
    not_applicable_when: "repo has no gitleaks or trufflehog CI job"
    description: >-
      The gitleaks or trufflehog CI job must be registered as a required status
      check on the default branch ruleset. Secret scanning that runs in CI but is
      not a required check cannot block a PR that contains secrets discovered after
      the branch was pushed (gap between push-protection coverage and merge-gate
      coverage).
    verify: |
      For each repo where .github/workflows/*.yml contains a job whose name or id
      matches (gitleaks|trufflehog):
        Retrieve the branch protection ruleset for the default branch via GitHub API.
        FAIL if the matching job name does not appear in required_status_checks.
        FAIL if the matching required_status_checks entry has integration_id absent
             or != 15368 (the GitHub Actions app); a context-string match alone is
             spoofable by any actor who can register a same-named check from a
             different app, mirroring CI-028's integration_id pin.
        PASS if the job name is present in required_status_checks AND its
             integration_id is 15368.
      Repos with no gitleaks/trufflehog CI job: apply OSSF-008/OSSF-009 platform
      scan check only; this check is N/A.
    notes: >-
      Added 2026-05-28. Complements OSSF-008 (platform alerting), OSSF-009
      (push protection), and CI-029 (config file protection). These checks
      together form the full secret-scanning gate stack:
      CI-029 prevents .gitleaks.toml tampering by non-bypass actors;
      CI-007 prevents secret-scanning jobs from carrying continue-on-error: true;
      OSSF-008 confirms GitHub platform scan alerting is enabled;
      OSSF-009 confirms GitHub platform push protection is enabled;
      OSSF-015 confirms the CI job is wired as a required merge gate.
      Private repos: OSSF-008 and OSSF-009 may be unavailable without GHAS,
      but OSSF-015 applies regardless of visibility because it checks the CI job,
      not the platform scan. Do not gate OSSF-015 on visibility. The job name in
      required_status_checks must exactly match the job name: or, if unset, the
      job key in the workflow YAML; a mismatch silently passes while providing no
      protection, so confirm the exact name in each fleet security-analysis.yml.

  - id: CLAUDE-009
    domain: claude_docs
    severity: important
    override_eligible: true
    description: >-
      Verify .claude/settings.json does not enable
      enableAllProjectMcpServers without a documented justification.
      Unconstrained MCP tool access grants agents excessive authority
      over external resources (OWASP LLM06, LLM08).
    verify: >-
      Run: python3 -c "import json, sys;
      d=json.load(open('.claude/settings.json'));
      sys.exit(0 if not d.get('enableAllProjectMcpServers') else 1)"
      || grep -l "enableAllProjectMcpServers" docs/security-analysis*.md;
      FAIL if flag is true and no justification documented.
    source_frameworks:
      - OWASP LLM06 Excessive Agency
      - OWASP LLM08 Excessive Permissions
      - CNCF Security TAG IAM

  # ── Repo Settings (GitHub repo-level toggles, not in-tree files) ─────────────
  # Audits repository settings accessible only via the GitHub API
  # (gh api repos/{owner}/{repo}). Distinct from foundations (in-tree files),
  # CI (workflows), and OSSF (Scorecard/Badge APIs). Added 2026-05-26 after the
  # Renovate auto-merge fleet rollout audit revealed that 11 of 42 repos had
  # allow_auto_merge=false and 38 of 42 had delete_branch_on_merge=false with
  # no manifest check covering either toggle.

  - id: REPO-001
    domain: repo_settings
    severity: critical
    description: >-
      Repository setting allow_auto_merge is true. Without this toggle GitHub
      silently refuses to enable auto-merge on any PR, regardless of bot
      configuration. Renovate, Dependabot, and any other bot that requests
      platform auto-merge will appear to "work" (the API call succeeds) but
      the PR will never auto-merge. The 2026-05-26 audit found 11 of 42 repos
      had this set to false, blocking the entire Renovate auto-merge pipeline.
    verify: >-
      Run: gh api repos/<org>/<repo> --jq '.allow_auto_merge'.
      PASS if value is true. FAIL if false or null.
    override_eligible: false
    source_frameworks:
      - manifest-internal
    notes: >-
      Idempotent remediation: gh api repos/<org>/<repo> -X PATCH -f allow_auto_merge=true.
      Cross-reference: docs/reference/renovate-architecture.md (cutover playbook).

  - id: REPO-002
    domain: repo_settings
    severity: important
    description: >-
      Repository setting delete_branch_on_merge is true. When false, merged
      Renovate (and other bot) branches accumulate indefinitely, cluttering the
      branch list and confusing future bot runs (Renovate's branch-reuse logic
      assumes branches are deleted post-merge). The 2026-05-26 audit found 38
      of 42 repos with this disabled.
    verify: >-
      Run: gh api repos/<org>/<repo> --jq '.delete_branch_on_merge'.
      PASS if value is true. FAIL if false or null.
    override_eligible: true
    source_frameworks:
      - manifest-internal
    notes: >-
      Idempotent remediation: gh api repos/<org>/<repo> -X PATCH
      -f delete_branch_on_merge=true. Override eligible for repos that
      intentionally retain merged branches for historical reference, but no
      such repo currently exists in either org.
