  - id: PC-005
    domain: pre_commit
    severity: important
    description: >-
      Secret scanning hook present in .pre-commit-config.yaml: detect-secrets (with
      --baseline) or trufflehog; hook must fail closed (no silent-skip if tool is absent)
    verify: "hook_present: .pre-commit-config.yaml, detect-secrets OR trufflehog"
    override_eligible: false
    notes: >-
      Approved tools: detect-secrets (Yelp/detect-secrets) or trufflehog
      (trufflesecurity/trufflehog). Either satisfies this check; both together is the
      recommended dual-layer posture (see PC-013).
      detect-secrets requirement: the hook MUST include --baseline .secrets.baseline.
      Running without a baseline triggers on every pre-existing false positive and is not
      usable in practice.
      trufflehog requirement: the entry must NOT include a silent-skip fallback such as
      'command -v trufflehog || echo skipping'. Secret scanning must fail closed: if the
      tool is absent the hook must fail, not silently pass. Required exclusions:
      CHANGELOG.md (40-char commit SHAs match the GitHub OAuth2 token pattern) and any
      .submodules/ directories containing third-party placeholder credentials. Trufflehog
      in pre-commit must scan staged files only; full git history scanning belongs in CI.

