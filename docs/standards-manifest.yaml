# docs/standards-manifest.yaml
version: "1.0"
last_updated: "2026-05-07"

# verify field is a hint to the domain agent, not executable DSL.
# Agents interpret it using their own tools (Grep, Read, Glob, Bash).

required_checks:
  - name: "CI Gate"
    produced_by: ".github/workflows/ci.yml"
    matrix_expansion: false
  - name: "Security Gate Validation"
    produced_by: ".github/workflows/security-analysis.yml"
    matrix_expansion: false
  - name: "Dependency & Standards Validation"
    produced_by: ".github/workflows/pr-validation.yml"
    matrix_expansion: false
  - name: "Check REUSE Compliance"
    produced_by: ".github/workflows/reuse.yml"
    matrix_expansion: false

solo_dev_constraints:
  forbid_required_approving_reviews: true
  notes: >-
    All managed repos are solo-dev; required_approving_review_count must remain 0
    in every classic protection state and every ruleset rule.
    setup_org_rulesets.py enforces this with a hard guard.

checks:

  # ── Foundations ─────────────────────────────────────────────────────────────

  - id: FOUND-001
    domain: foundations
    severity: critical
    description: "SECURITY.md present at project root"
    verify: "file_exists: SECURITY.md"
    source_template: "/home/byron/dev/.github/SECURITY.md"
    override_eligible: false

  - id: FOUND-002
    domain: foundations
    severity: critical
    description: "CONTRIBUTING.md present at project root"
    verify: "file_exists: CONTRIBUTING.md"
