  - id: PC-011
    domain: pre_commit
    severity: important
    description: "no-em-dash hook present in .pre-commit-config.yaml"
    verify: "hook_present: .pre-commit-config.yaml, no-em-dash"
    override_eligible: false

  - id: PC-012
    domain: pre_commit
    severity: important
    description: "All hook rev fields are 40-character SHA pins, not mutable tags"
    verify: "sha_pinned: .pre-commit-config.yaml, all_rev_fields"
    override_eligible: false

  - id: PC-013
    domain: pre_commit
    severity: suggested
    description: "Both detect-secrets and trufflehog hooks present (dual-layer secret scanning)"
    verify: "hook_present: .pre-commit-config.yaml, detect-secrets AND trufflehog"
    override_eligible: true
    notes: >-
      Dual-layer posture: detect-secrets catches secrets via a committed baseline (regression
      prevention); trufflehog performs entropy analysis and live credential verification
      (catches secrets detect-secrets would miss via pattern alone). The two tools complement
      rather than duplicate each other; detect-secrets is deterministic, trufflehog is
      probabilistic. Required trufflehog exclusions: CHANGELOG.md (40-char commit SHAs match
      the GitHub OAuth2 token pattern, causing false positives) and any .submodules/
      directories containing third-party placeholder credentials. Reference implementation:
      ByronWilliamsCPA/.claude/.pre-commit-config.yaml.

  - id: PC-014
    domain: pre_commit
    severity: important
    description: >-
      Every no-em-dash hook exclude entry carries a tracked cleanup reference
      (tracking issue, target date, or owner) within 6 lines above it.
    verify: >-
      Inspect .pre-commit-config.yaml for the no-em-dash hook. Its
      exclusions may appear in two forms: a YAML list of paths under an
      "exclude:" key (one path per line), or a regex pattern under
      "exclude:" or as the complement of the "files:" positive pattern.
      For each excluded path or regex alternation segment, require a
      cleanup reference (GitHub issue link such as "#NNN" or a full URL,
      or a "cleanup by YYYY-MM-DD" comment) within the 6 lines
      immediately preceding either the individual list entry (list form)
      or the "exclude:"/"files:" key line itself (regex form). Raise
      FINDING for any excluded path or regex segment that lacks such a
      reference.
    override_eligible: true
    not_applicable_when: "no-em-dash hook absent from .pre-commit-config.yaml"
    notes: >-
      The no-em-dash hook (PC-011) enforces a hard global writing rule.
      Excluding paths without a cleanup deadline turns the rule into an
      aspirational note. The reference-library audit (2026-05-15) found
      938 untracked occurrences across 67 files; PC-014 is the structural
      guard against that pattern recurring without owner accountability.
      The 6-line proximity window accommodates a multi-line comment block
      documenting a multi-line exclude stanza while remaining tight enough
      that unrelated comments further above do not inadvertently satisfy
      the rule.

