# verification methodology: the previous note instructed use of
# /commits/{sha}/check-runs, which excludes pull_request-event-only workflows
# and produced a fleet-wide false positive for "Dependency & Standards
# Validation". Correct methodology is `gh pr view --json statusCheckRollup`
