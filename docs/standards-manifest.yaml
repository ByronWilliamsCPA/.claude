# verify field is a hint to the domain agent, not executable DSL.
# Agents interpret it using their own tools (Grep, Read, Glob, Bash).

# GitHub Actions check run naming rules (critical for CI-022 and CI-023 accuracy):
#
# Direct job in a workflow (type: regular job, NOT uses:):
#   Check run name = job's `name:` field value ONLY.
#   Example: workflow "CI", job `name: CI Gate` -> check name "CI Gate"
#   The workflow name is NOT prepended, even though the PR UI displays it as "CI / CI Gate".
#
# Job that calls a reusable workflow (type: uses: org/repo/.github/workflows/X.yml):
#   Check run name = "{calling job's name} / {internal job's name}".
#   Example: workflow "security-analysis.yml" calls reusable with job `name: Security Analysis`,
#   and the reusable workflow has an internal job `name: Security Gate Validation`
#   -> check name "Security Analysis / Security Gate Validation".
#
# Verification approach for CI-023:
#   1. Query the GitHub Checks API for recent commits on main:
#      gh api repos/<org>/<repo>/commits/<sha>/check-runs --jq '.check_runs[].name'
#   2. Match each required_checks entry against the ACTUAL API output, not the PR UI display.
#   3. The PR UI shows "WorkflowName / JobName" for ALL checks as a display prefix,
#      but only reusable-workflow callee jobs produce that as their actual context string.
required_checks:
  - name: "CI Gate"
    produced_by: ".github/workflows/ci.yml"
    job_type: direct
    matrix_expansion: false
    applies_to_types: ["python-package", "python-app", "python-script"]
  - name: "Security Analysis / Security Gate Validation"
    produced_by: ".github/workflows/security-analysis.yml"
    job_type: reusable_callee
    calling_job_name: "Security Analysis"
    matrix_expansion: false
  - name: "Dependency & Standards Validation"
    produced_by: ".github/workflows/pr-validation.yml"
    job_type: direct
    matrix_expansion: false
  - name: "Check REUSE Compliance"
    produced_by: ".github/workflows/reuse.yml"
    job_type: direct
    matrix_expansion: false

solo_dev_constraints:
  forbid_required_approving_reviews: true
  forbid_require_code_owner_review: true
  forbid_require_last_push_approval: true
  notes: >-
    All managed repos are solo-dev; no ruleset or classic-protection rule may
    force a human PR approval the maintainer cannot self-grant.
    required_approving_review_count must remain 0, and both
    require_code_owner_review and require_last_push_approval must remain false.
    With a CODEOWNERS file, require_code_owner_review=true blocks self-merge
    even when the review count is 0; that was the regression that locked the
    maintainer out of merging their own PRs. setup_org_rulesets.py enforces
    all three with a hard guard (validate_solo_dev_safe).

# reserved_ids (Obs 81): single authoritative registry of check IDs that are
# claimed by an approved-but-not-yet-merged plan, so concurrent planning work
# and in-flight PRs cannot collide on the same ID. The committed `checks:` list
# below tracks only IDs that have shipped; this block closes the gap for IDs
# reserved by plans. Governance: before assigning a new ID, scan BOTH the
# committed checks list AND this block. When a reserved ID's check merges into
# `checks:`, remove its entry here. Keep entries sorted by ID prefix then number.
# A standalone docs/manifest-id-registry.yaml was considered; an inline block is
# preferred so the reservation lives in the same file reviewers already diff.
