  # branch_protection_contexts: <context1>, <context2>, ...
  # Instructs the ossf-compliance-auditor to call:
  #   gh api repos/{slug}/branches/main/protection --jq '.required_status_checks.contexts'
  # and verify each listed context appears in the returned array.
  # Keep in sync with: scripts/setup_github_protection.py contexts list,
  # .claude/agents/ossf-compliance-auditor.md CI-017 FINDING template.
  - id: CI-017
    domain: ci
    severity: critical
    description: "Branch protection registers all four blocking check contexts: CI Gate, Security Gate Validation, Dependency & Standards Validation, Check REUSE Compliance"
    verify: "branch_protection_contexts: CI Gate, Security Gate Validation, Dependency & Standards Validation, Check REUSE Compliance"
