  # ── OSSF (Best Practices Badge + Scorecard) ──────────────────────────────────
  # These checks supplement the live Scorecard API and Badge API results with
  # local file content that those APIs cannot evaluate. The ossf-compliance-auditor
  # agent queries the APIs first and uses these checks only for gaps the APIs miss.

  - id: OSSF-001
    domain: ossf
    severity: important
    description: >-
      OpenSSF Best Practices Badge application filed (Passing level) -- verified via
      bestpractices.coreinfrastructure.org API
    verify: "ossf_badge_api: level=passing"
    override_eligible: true
    visibility_required: public  # badge API is designed for public OSS; private repos are rarely registered

  - id: OSSF-002
    domain: ossf
    severity: critical
    description: >-
      SECURITY.md documents a private vulnerability reporting channel (GitHub Security
      Advisories or equivalent)
    verify: "content_present: SECURITY.md, private"
    override_eligible: false
    notes: >-
      FOUND-001 checks file presence only. OSSF-002 checks content quality: the
      file must document a private reporting channel. Do not merge or deduplicate
      these two checks; they satisfy different framework requirements.

  - id: OSSF-003
    domain: ossf
    severity: critical
    description: "SECURITY.md states a maximum initial response SLA of 14 days"
    verify: "content_present: SECURITY.md, 14"
    override_eligible: false

  - id: OSSF-004
    domain: ossf
    severity: important
    description: "CHANGELOG entries for vulnerability fixes include the CVE ID"
    verify: "changelog_cve_pattern: CHANGELOG.md, CVE-[0-9]{4}-[0-9]+"
    override_eligible: true

  - id: OSSF-005
    domain: ossf
    severity: suggested
    description: >-
      Library projects have published API reference docs; non-library projects have N/A
      marker in README or CONTRIBUTING
    verify: "ossf_api_docs: docs/api/ OR README contains 'N/A' near 'API reference'"
    override_eligible: true

  - id: OSSF-006
    domain: ossf
    severity: suggested
    description: "OpenSSF Best Practices Silver badge application filed -- verified via bestpractices.dev API"
    verify: "ossf_badge_api: level=silver"
    override_eligible: true
    visibility_required: public  # same rationale as OSSF-001; private repos exempt

  - id: OSSF-007
    domain: ossf
    severity: important
    description: "GitHub org requires 2FA for all members -- verified via GitHub API (OpenSSF Gold: require_2FA)"
    verify: "github_org_2fa: ByronWilliamsCPA, two_factor_requirement_enabled=true"
    override_eligible: false

  - id: OSSF-008
    domain: ossf
    severity: important
    description: "GitHub Secret Scanning alerting enabled for the repo"
    verify: "github_api: repo.security_and_analysis.secret_scanning.status == enabled"
    override_eligible: true
    notes: >-
      Public repos: secret scanning is free and configurable at the repo level under Settings >
      Code security. No org GHAS license required. A disabled status on a public repo is an
      actionable gap, not a structural limitation.
      Private repos: requires GitHub Advanced Security at the org level. If the org lacks GHAS,
      accept as a structural gap and document in docs/known-vulnerabilities.md.

  - id: OSSF-009
    domain: ossf
    severity: important
    description: "GitHub Secret Scanning push protection enabled for the repo (requires OSSF-008 to pass first)"
    verify: "github_api: repo.security_and_analysis.secret_scanning_push_protection.status == enabled"
    override_eligible: true
    notes: >-
      Push protection blocks pushes containing a detected secret before it enters git history.
      Depends on OSSF-008 (secret scanning alerting).
      Public repos: free, no GHAS license required. Disabled status is an actionable gap.
      Private repos: requires org-level GHAS. If unavailable, document in docs/known-vulnerabilities.md.

  - id: OSSF-010
    domain: ossf
    severity: suggested
    description: >-
      SECURITY.md includes a repo-specific security surface section naming the attack
      vectors and mitigations in place (not just generic security practice lists)
    verify: "content_present: SECURITY.md, surface OR attack surface OR primary security"
    override_eligible: true
    notes: >-
      A scope section converts SECURITY.md from a compliance checkbox into actionable
      contributor guidance. The section must name the specific attack vectors relevant to
      this repo (e.g., ZIP path traversal in a downloader, SQL injection in a query tool,
      dependency vulnerabilities in any Python project) and the mitigations currently in
      place for each. Generic lists of security tools or practices do not satisfy this check;
      the content must be repo-specific. Reference implementation: ByronWilliamsCPA/gleif
      SECURITY.md "Scope" section. Template: add to .github/SECURITY.md under a
      "Security surface areas" heading with repo-specific placeholders.

