  # Retired IDs are preserved below as deprecated stubs for audit-trail continuity.
  # Do not reuse retired IDs; any new checks must use MKDOCS-015+.
  # =========================================================================

  - id: MKDOCS-001
    domain: mkdocs
    severity: important
    description: "mkdocs.yml has site_url set"
    verify: "field_present: site_url"
    applies_to: docs_repos
    override_eligible: true
    notes: >-
      Down-tiered from critical to important 2026-05-28. A missing site_url breaks
      canonical link headers and sitemap generation on a published site; it is a
      documentation quality failure, not a security or data-integrity failure. An
      operator may have a legitimate reason to omit it (self-hosted deployment behind
      a private DNS name not known at build time). Changed override_eligible from
      false to true to reflect this.

  - id: MKDOCS-002
    domain: mkdocs
    severity: important
    description: "mkdocs.yml has repo_url set (DEPRECATED -- use MKDOCS-013)"
    verify: "field_present: repo_url"
    applies_to: docs_repos
    override_eligible: true
    deprecated_by: MKDOCS-013
    notes: >-
      Retired 2026-05-28. Consolidated into MKDOCS-013 along with MKDOCS-003 and
      MKDOCS-005. Do not reuse this ID.

  - id: MKDOCS-003
    domain: mkdocs
    severity: important
    description: "mkdocs.yml has repo_name set (DEPRECATED -- use MKDOCS-013)"
    verify: "field_present: repo_name"
    applies_to: docs_repos
    override_eligible: true
    deprecated_by: MKDOCS-013
    notes: >-
      Retired 2026-05-28. Consolidated into MKDOCS-013 along with MKDOCS-002 and
      MKDOCS-005. Do not reuse this ID.

  - id: MKDOCS-004
    domain: mkdocs
