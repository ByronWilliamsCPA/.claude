  - id: PC-013
    domain: pre_commit
    severity: suggested
    description: "Both detect-secrets and trufflehog hooks present (dual-layer secret scanning)"
    verify: "hook_present: .pre-commit-config.yaml, detect-secrets AND trufflehog"
    override_eligible: true
    notes: >-
      Dual-layer posture: detect-secrets catches secrets via a committed baseline (regression
      prevention); trufflehog performs entropy analysis and live credential verification
      (catches secrets detect-secrets would miss via pattern alone). The two tools complement
      rather than duplicate each other; detect-secrets is deterministic, trufflehog is
      probabilistic. Required trufflehog exclusions: CHANGELOG.md (40-char commit SHAs match
      the GitHub OAuth2 token pattern, causing false positives) and any .submodules/
      directories containing third-party placeholder credentials. Reference implementation:
      ByronWilliamsCPA/.claude/.pre-commit-config.yaml.

  - id: PC-014
    domain: pre_commit
    severity: important
    description: >-
      Every no-em-dash hook exclude entry carries a tracked cleanup reference
      (tracking issue, target date, or owner) within 6 lines above it.
    verify: >-
      Inspect .pre-commit-config.yaml for the no-em-dash hook. Its
      exclusions may appear in two forms: a YAML list of paths under an
      "exclude:" key (one path per line), or a regex pattern under
      "exclude:" or as the complement of the "files:" positive pattern.
      For each excluded path or regex alternation segment, require a
      cleanup reference (GitHub issue link such as "#NNN" or a full URL,
      or a "cleanup by YYYY-MM-DD" comment) within the 6 lines
      immediately preceding either the individual list entry (list form)
      or the "exclude:"/"files:" key line itself (regex form). Raise
      FINDING for any excluded path or regex segment that lacks such a
      reference.
    override_eligible: true
    not_applicable_when: "no-em-dash hook absent from .pre-commit-config.yaml"
    notes: >-
      The no-em-dash hook (PC-011) enforces a hard global writing rule.
      Excluding paths without a cleanup deadline turns the rule into an
      aspirational note. The reference-library audit (2026-05-15) found
      938 untracked occurrences across 67 files; PC-014 is the structural
      guard against that pattern recurring without owner accountability.
      The 6-line proximity window accommodates a multi-line comment block
      documenting a multi-line exclude stanza while remaining tight enough
      that unrelated comments further above do not inadvertently satisfy
      the rule.

  - id: PC-016
    domain: pre_commit
    check_family: renovate-health
    severity: suggested
    description: >-
      The Renovate global config at homelab-infra/services/renovate/config/config.json
      validates clean against renovate-config-validator pinned to the same Renovate
      MAJOR version as the homelab-infra self-hosted instance. Closes the structural
      blind spot identified in the 2026-05-24 fleet audit: the v42-era
      renovate-config-validator pre-commit hook (orphan-added in #142 with the local
      label "PC-015" but never landed as a manifest check; removed in this PR)
      covered only per-repo renovate.json files, leaving the global config that the
      Docker stack mounts at /config/config.json out of scope. An invalid global
      config can break PR generation for the entire fleet simultaneously, with no
      per-repo audit signal.
    verify: >-
      Run renovate-config-validator at the same major version as the homelab-infra
      Docker image against services/renovate/config/config.json. Exit code must be 0.
      The hook MUST be present in the homelab-infra .pre-commit-config.yaml with the
      same SHA pin and additional_dependencies version as the running renovate/renovate
      image (currently renovate@43.x).
    override_eligible: true
    not_applicable_when: >-
      Audit target is not the homelab-infra repo. This check only applies to
      homelab-infra/services/renovate/config/config.json.
    notes: >-
      Added 2026-05-25 as severity: suggested. Will be promoted to important in
      Phase 3D once the pre-commit hook is actually deployed to homelab-infra
      (aligns with the suggested to important target documented in the PR
      description for CI-058/059/060/PC-016). The check exists to prevent
      recurrence of the 2026-05-24 global-config "uv" trap (now fixed by the v43
      cutover, which accepts "uv" natively). v43 unified the validator and server
      schemas, so the version-pin lockstep risk that motivated the original
      "PC-015" placeholder hook is retired here too. PC-016 remains useful for
      catching forward-compat issues (e.g., a future v44 schema change).
      Cross-reference: feedback_renovate_uv_manager_trap.md,
      feedback_policy_execution_gap.md,
      docs/audits/dependency-management-improvement-plan-2026-05-24.md P0-1.

  # ── CI ────────────────────────────────────────────────────────────────────────

  - id: CI-001
    domain: ci
    severity: important
    description: "CI workflow uses org reusable python-ci.yml"
    verify: "content_present: .github/workflows/ci.yml, ByronWilliamsCPA/.github"
    override_eligible: true
    not_applicable_when: "repo does not contain Python source files"

  - id: CI-002
    domain: ci
    severity: important
    description: "Security workflow uses org reusable security analysis workflow"
    verify: "content_present: .github/workflows/security-analysis.yml, ByronWilliamsCPA/.github"
    override_eligible: true

  - id: CI-003
    domain: ci
    severity: important
    description: "SonarCloud integration workflow present"
    verify: "file_exists: .github/workflows/sonarcloud.yml"
    override_eligible: true

  - id: CI-003b
    domain: ci
    severity: critical
    description: >-
      sonar.organization matches the repo's GitHub org (ByronWilliamsCPA repos must use
      byronwilliamscpa; williaby repos must use williaby; value must be lowercase)
    verify: |
      Check sonar-project.properties for sonar.organization. Determine the repo's GitHub org.
      Expected value: byronwilliamscpa for ByronWilliamsCPA repos; williaby for williaby repos.
      Also check sonarcloud.yml for any hardcoded -Dsonar.organization= args -- these override
      sonar-project.properties and must match the same expected value.
      FAIL if: value is wrong org, wrong case (e.g. ByronWilliamsCPA instead of byronwilliamscpa),
      or sonar-project.properties is absent when sonarcloud.yml is present.
      Known failure pattern: BW repos with sonar.organization=williaby cause 403 on
      /analysis/jres because the org-level SONAR_TOKEN is scoped to byronwilliamscpa.
      Token smell rule (ByronWilliamsCPA only): BW repos that PASS via a repo-level
      SONAR_TOKEN pointing at the wrong SonarCloud org are also a FAIL -- the token
      is masking misregistration. This smell does NOT apply to williaby repos.
      williaby token rule: williaby is a personal GitHub account with no account-level
      secrets. Each williaby repo using SonarCloud MUST have a repo-level SONAR_TOKEN
      set individually. This is correct and expected, not a smell.
    override_eligible: false

  - id: CI-003c
    domain: ci
    severity: important
    description: >-
      No inline SonarCloud scanning in ci.yml -- sonarqube-scan-action and
      sonarqube-quality-gate-action belong in sonarcloud.yml (CI-003) or in a
      reusable-workflow DEFINITION (see NOT APPLICABLE clause), never in ci.yml itself
    verify: |
      Check .github/workflows/ci.yml for any of the following action references
      (case-insensitive match; any version, any pin: tag, branch, or SHA):
        - SonarSource/sonarqube-scan-action
        - SonarSource/sonarqube-quality-gate-action
        - SonarSource/sonarcloud-github-action
      FAIL if any of these appear in ci.yml. They belong in sonarcloud.yml, which calls
      the org reusable workflow at
      ByronWilliamsCPA/.github/.github/workflows/python-sonarcloud.yml. That reusable
      workflow runs scan + quality gate internally; a second inline scan in ci.yml
      duplicates the work and causes a race.
      Known failure pattern: cookiecutter-python-template PR #69 -- having both a thin
      caller in sonarcloud.yml AND an inline scan in ci.yml produced two concurrent
      analyses for the same projectKey on the same SHA. They race in SonarCloud's
      Compute Engine and the loser's task ID is superseded, producing a 404 from
      sonarqube-quality-gate-action's polling step (curl exit code 22).
      NOT APPLICABLE: this check only applies to ci.yml. The same actions appearing in
      sonarcloud.yml itself (or in any reusable-workflow DEFINITION such as files under
      docs/org-workflows/) are correct and expected.
    override_eligible: true

  - id: CI-004
    domain: ci
    severity: important
    description: >-
      Qlty coverage workflow present (supplements Codecov; Qlty handles code quality
      metrics, Codecov tracks test coverage history and PR deltas)
    verify: "file_exists: .github/workflows/coverage.yml"
    override_eligible: true
    not_applicable_when: "repo does not contain Python source files"

  - id: CI-005
    domain: ci
    severity: critical
    description: "All GitHub Action uses: references are 40-character SHA pins"
    verify: >-
      sha_pinned: .github/workflows/*.yml, all_uses_fields.
      SCOPE: apply to ALL workflow files including any listed in CI-013 exemptWorkflows.
      CI-013 exemptions cover the expected-set check only; they do not exempt a file from
      SHA-pin enforcement. No exceptions to SHA pinning.
    override_eligible: false

  - id: CI-006
    domain: ci
    severity: important
    description: "harden-runner present as first step in all workflow jobs"
    verify: |
      For each .github/workflows/*.yml:
        For each job (not a reusable-workflow call, i.e., no "uses:" key at the job level):
          FAIL if no step in the job uses: step-security/harden-runner.
          FAIL if the step using step-security/harden-runner is not the first step
               in the job's "steps:" list (position index 0).
      Exempt: reusable-workflow callee jobs where harden-runner is controlled by the
      callee template.
    override_eligible: false

  - id: CI-007
    domain: ci
    severity: important
    description: >-
      No workflow job whose name or id contains "security", "scan", "bandit",
      "safety", "audit", "sast", "dast", "trufflehog", "gitleaks", or "semgrep"
      may carry continue-on-error: true. Applies to every file under
      .github/workflows/, not just security-analysis.yml. A security job that
      suppresses its own exit code makes the entire scan advisory and lets real
      findings (CVEs, secrets, taint flows) pass CI silently.
    verify: |
      content_absent: .github/workflows/*.yml, continue-on-error: true within jobs whose name or id matches (security|scan|bandit|safety|audit|sast|dast|trufflehog|gitleaks|semgrep).
      Also flag continue-on-error: true on a per-step entry whose step uses: or run: invokes one of those scanners (covers a scanner step inside a non-security-named job).
      Per-step continue-on-error on a non-scanner step inside an otherwise security-named job (e.g., codecov upload, optional artifact publish) is allowed.
    override_eligible: false
    notes: >
      Original scope (security-analysis.yml only) missed a real XXE vulnerability in
      pp-security-master where the bandit job lived in ci.yml with continue-on-error: true.
      Broadened to all workflows 2026-05-17 (issue #35). Scope embedded in the verify
      directive itself (rather than as a trailing advisory line) so any compliant
      interpreter cannot read the first line in isolation and produce false positives.

  - id: CI-007b
    domain: ci
    severity: important
    description: >-
      Security scan commands must not suppress their exit codes with || echo,
      || true, || :, or || exit 0. This pattern produces a passing step even when
      the scanner finds a high-severity issue, defeating CI-007 from the command
      line rather than the job manifest.
    verify: |
      pattern_absent: .github/workflows/*.yml
      Forbidden pattern (PCRE; evaluate with `rg` or `grep -P`, not stock `grep`): (bandit|safety|osv-scanner|semgrep|trufflehog|gitleaks|pip-audit)\b.*\|\|\s*(echo|true|:|exit\s+0)
      Matches the scanner invocation followed on the same logical line by a shell
      OR-suppressor. Multi-line scripts inside `run: |` blocks count.
    override_eligible: false
    notes: >
      Companion to CI-007. Real incident: the same pp-security-master XXE escape used
      `bandit -r src/ || echo "bandit advisory"` to convert a finding into a no-op
      success. Added 2026-05-17 (issue #35).

  - id: CI-008
    domain: ci
    severity: suggested
    description: ".github/copilot-instructions.md present"
    verify: "file_exists: .github/copilot-instructions.md"
    override_eligible: true

  - id: CI-009
    domain: ci
    severity: important
    description: "Codecov config file present at project root (.codecov.yml or codecov.yaml)"
    verify: "file_exists: .codecov.yml,codecov.yaml"
    override_eligible: true
    not_applicable_when: "repo does not contain Python source files"

  - id: CI-010
    domain: ci
    severity: important
    description: "Codecov config minimum coverage threshold is 80% or above"
    verify: "content_present: .codecov.yml OR codecov.yaml, target: 80"
    override_eligible: true
    not_applicable_when: "repo does not contain Python source files"

  - id: CI-011
    domain: ci
    severity: important
    description: "Codecov config defines separate coverage flags for unit and integration tests"
    verify: "content_present: .codecov.yml OR codecov.yaml, flags:"
    override_eligible: true
    not_applicable_when: "repo does not contain Python source files"

  - id: CI-012
    domain: ci
    severity: important
    description: "SonarQube quality gate passes -- no open Blocker or Critical issues (queried via SonarQube API)"
    verify: >-
      sonarqube_quality_gate: status=OK, severities=BLOCKER,CRITICAL.
      VISIBILITY GATE: if sonar-project.properties is present but the project is private-visibility
      on SonarCloud, skip the unauthenticated API probe (it returns 'Project not found' for private
      projects by design) and record PASS (visibility-gated) instead of a FINDING.
      Private-visibility is indicated by isPrivate=true in the repo catalog OR by the project not
      returning data from the public API when sonar-project.properties is present.
    override_eligible: true

  - id: CI-013
    domain: ci
    severity: important
    description: >-
      No unregistered GitHub Actions workflows -- any .yml in .github/workflows/ not in
      the registered set is flagged for evaluation
    verify: "workflow_inventory: .github/workflows/, expected_set=[ci.yml,codeql.yml,coverage.yml,dependency-review.yml,docs.yml,fips-compatibility.yml,mutation-testing.yml,postman-api-tests.yml,pr-title.yml,pr-validation.yml,python-compatibility.yml,qlty.yml,release-sign.yml,release.yml,repo-health.yml,reuse.yml,sbom.yml,scorecard.yml,security-analysis.yml,slsa-provenance.yml,sonarcloud.yml], report_extras=true"  # yamllint disable-line rule:line-length
    override_eligible: true

  - id: CI-022
    domain: ci
    severity: critical
    description: >-
      Every entry in required_checks has a workflow job that produces it,
      either locally or via a registered reusable workflow.
    verify: >-
      required_checks_have_producer: docs/standards-manifest.yaml, docs/reusable-workflow-jobs.yaml.
      Pass --repo-type <repositoryType> to check-required-checks.py so entries with
      applies_to_types that exclude this repo type are silently skipped.
    override_eligible: false

  - id: CI-023
    domain: ci
    severity: critical
    description: >-
      Effective required-status-checks (classic protection union repo rulesets union
      org rulesets targeting this repo) exactly equal required_checks names.
    verify: "protection_matches_required_checks: docs/standards-manifest.yaml, source=union"
    override_eligible: false
    not_applicable_when: >-
      repo.branchProtectionExempt == true OR repo.repositoryType == 'config' OR
      repo.repositoryType == 'docs-only' OR repo.repositoryType == 'infrastructure'
    notes: >-
      Check run names must match the GitHub Checks API output, NOT the PR UI display.
      Direct jobs: name = job `name:` field only (e.g., "CI Gate", not "CI / CI Gate").
      Reusable-workflow callee jobs: name = "{calling_job_name} / {internal_job_name}".
      Verification: gh pr view <PR_NUMBER> --repo <org>/<repo> --json statusCheckRollup
        --jq '.statusCheckRollup[].name' against any recently merged PR.
      DO NOT use `gh api repos/<org>/<repo>/commits/<sha>/check-runs` on main HEAD.
      Workflows triggered by pull_request (or pull_request_target) do not re-run on
      the merge commit, so they are absent from commit-level check-runs and the audit
      produces false positives (every repo appears to be missing "Dependency &
      Standards Validation"). This was confirmed in the 2026-05-26 fleet audit.
      Compare against this file's required_checks[].name entries. The PR UI prepends
      the workflow name as a visual prefix for ALL checks -- this is cosmetic only for direct jobs.

  - id: CI-024
    domain: ci
    severity: important
    description: >-
      Every reusable workflow registered in
      docs/reusable-workflow-jobs.yaml has last_verified within 90 days.
    verify: "registry_freshness: docs/reusable-workflow-jobs.yaml, max_age_days=90"
    override_eligible: false

  - id: CI-025a
    domain: ci
    severity: critical
    description: >-
      ByronWilliamsCPA org has at least one ruleset with enforcement=active
      targeting the default branch of every non-exempt repo. williaby is a
      User account and is covered by CI-025b instead.
    verify: "org_ruleset_present: orgs=[ByronWilliamsCPA], enforcement=active"
    override_eligible: false
    not_applicable_when: "repo.org != 'ByronWilliamsCPA' OR repo.branchProtectionExempt == true"

  - id: CI-025b
    domain: ci
    severity: critical
    description: >-
      Every non-exempt williaby repo has at least one repo-level ruleset with
      enforcement=active targeting its default branch. williaby is a User
      account and cannot host org rulesets, so per-repo rulesets carry the
      baseline instead.
    verify: "repo_ruleset_present: owner=williaby, enforcement=active"
    override_eligible: false
    not_applicable_when: "repo.org != 'williaby' OR repo.branchProtectionExempt == true"

  - id: CI-026
    domain: ci
    severity: important
    description: >-
      Active ruleset includes a copilot_code_review rule, which auto-requests
      Copilot review on every PR opened against the default branch. Replaces
      the per-PR runtime trigger in /pr-review. For ByronWilliamsCPA, the rule
      lives in the org ruleset; for williaby, in each repo-level ruleset.
    verify: "ruleset_contains_rule: targets=[org:ByronWilliamsCPA, repo:williaby/*], rule_type=copilot_code_review"
    override_eligible: true
    not_applicable_when: "repo.branchProtectionExempt == true"
    notes: >-
      Copilot status check 'Copilot' may additionally be added to
      required_status_checks once stability is confirmed (Phase 3.5),
      which would make Copilot review blocking rather than advisory.

  - id: CI-027
    domain: ci
    severity: important
    description: >-
      Classic branch protection is ABSENT once migration has completed
      for this repo (prevents drift back to two sources of truth).
    verify: "classic_protection_absent: branch=default"
    override_eligible: true
    not_applicable_when: "repo.branchProtectionExempt == true OR repo.migrationPhase != complete"

  - id: CI-028
    domain: ci
    severity: critical
    description: >-
      All required_status_checks entries in org/user ruleset JSON files must carry
      integration_id: 15368 (GitHub Actions app). Without this pin any actor with
      write access can post a passing check using the same name and satisfy the gate.
    verify: |
      For each file in docs/reference/org-rulesets/*.json:
        For each required_status_checks entry: FAIL if integration_id is absent or != 15368.
    override_eligible: false

  - id: CI-029
    domain: ci
    severity: critical
    description: >-
      Universal rulesets must include a file_path_restriction rule covering the full
      trust-boundary path set: .github/workflows/, .github/CODEOWNERS,
      .pre-commit-config.yaml, pyproject.toml, renovate.json,
      sonar-project.properties, .gitleaks.toml. Workflow-only restriction leaves
      the files that define every local gate writable by non-bypass actors.
    verify: |
      For each *-universal.json in docs/reference/org-rulesets/:
        FAIL if no rule of type file_path_restriction exists.
        FAIL if restricted_file_paths does not include all seven required paths.
    override_eligible: false

  - id: CI-030
    domain: ci
    severity: important
    description: >-
      Tag-protection rulesets present for each org/account targeting refs/tags/v*
      with rules: creation, deletion, non_fast_forward, update, required_signatures,
      and tag_name_pattern (SemVer regex). Replaces the deprecated Tag Protection
      Rules API (sunset August 2024).
    verify: |
      FAIL if docs/reference/org-rulesets/ contains no *-tag-protection.json for each org.
      For each tag-protection file: FAIL if missing any of creation, deletion,
      non_fast_forward, update, required_signatures, or tag_name_pattern rule types.
    override_eligible: true
    not_applicable_when: "repo.hasNoReleases == true"

  - id: CI-031
    domain: ci
    severity: important
    description: >-
      harden-runner egress-policy must be block (not audit) in ci.yml,
      pr-validation.yml, and reuse.yml once onboarding is complete. audit mode
      is observational only and provides no actual supply-chain network protection.
    verify: |
      In each of .github/workflows/ci.yml, pr-validation.yml, reuse.yml:
        PASS if egress-policy: block is present.
        PASS if file contains a deferral comment with a target date AND that target date
             is in the future (compare against audit execution date).
        FAIL if egress-policy: audit with no deferral comment.
        FAIL if egress-policy: audit with a deferral comment whose target date is in
             the past (expired deferral).
    override_eligible: true
    notes: >
      Current posture is audit mode pending onboarding stabilization. Flip to block
      after confirming all required outbound domains are captured in the audit log.
      Deferral comment format: "# deferral: YYYY-MM-DD" or "# until: YYYY-MM-DD".
      Expired deferrals must be renewed or converted to block mode. An expired
      deferral is not a valid override.

  - id: CI-032
    domain: ci
    severity: important
    description: >-
      Universal rulesets must include a max_file_size rule with max_file_size no
      greater than 100 (MB). Prevents accidental large-binary commits (SQLite
      databases, training data, screenshots) that bypass pre-commit hooks when
      pushed by bypass actors.
    verify: |
      For each *-universal.json in docs/reference/org-rulesets/:
        FAIL if no rule of type max_file_size exists.
        FAIL if max_file_size parameter exceeds 100.
    override_eligible: true

  - id: CI-018
    domain: ci
    severity: important
    description: >-
      SLSA provenance job present in release.yml calling slsa-framework/slsa-github-generator
      (OpenSSF Silver: signed_releases)
    verify: "content_present: .github/workflows/release.yml, slsa-framework/slsa-github-generator"
    override_eligible: true
    not_applicable_when: "repo does not contain Python source files"
    notes: >-
      Genuine SLSA L3 isolation requires egress-policy: block in every harden-runner
      step of the release and SLSA provenance workflows. egress-policy: audit logs
      traffic but does not enforce isolation, undermining the L3 attestation claim.
      See CI-044 for the enforcement check added by the 2026-05-14 gap analysis.

  - id: CI-019
    domain: ci
    severity: important
    description: >-
      PyPI publish step in release.yml uses attestations: true (supply chain
      integrity). Only applies to repos that actively upload to PyPI; repos that
      use semantic-release for tag/GitHub-Release-only versioning without a dist
      upload step are exempt. The predicate is publish-to-PyPI, not has-Python-source.
    verify: |  # pragma: allowlist secret
      In .github/workflows/release.yml (or the file containing pypa/gh-action-pypi-publish):
        FAIL if attestations: true is present but id-token: write is absent from the
             job-level permissions block of the job containing the publish step.
        FAIL if attestations: true is present and id-token: write is present, but
             the publish step also sets a PYPI_TOKEN (or password:) environment variable  # pragma: allowlist secret
             directly (indicates fallback to API token instead of OIDC flow).
        PASS if attestations: true is present, id-token: write is in the job permissions,
             and no long-lived PYPI_TOKEN/password: is passed to the publish step.  # pragma: allowlist secret
    override_eligible: true
    not_applicable_when: "repo does not publish artifacts to PyPI (no pypa/gh-action-pypi-publish step in release.yml)"

  - id: CI-020
    domain: ci
    check_family: renovate-health
    severity: important
    description: >-
      renovate.json present at repo root (Renovate is the org-standard dependency manager;
      replaces dependabot.yml across all 44 repos as of 2026-05-05)
    verify: "file_exists: renovate.json"
    override_eligible: true
    notes: >
      Exceptions: dart-frog-paludarium and homelab-agent-configs (williaby) are in
      RENOVATE_IGNORED_REPOS and may retain dependabot.yml as their only update manager.
      Six BW repos (gleif, DeQA-Doc, taxdome, reference-library, cookiecutter-python-template,
      .github) are pending Renovate onboarding PRs; CI-020 is N/A for them until merged.

  - id: CI-021
    domain: ci
    check_family: renovate-health
    severity: important
    description: >-
      dependabot.yml does not open PRs when renovate.json is present. Running
      both as PR-openers creates duplicate update PRs and conflicts with
      Renovate's CVE automerge rules. The compliant end-state is Renovate as the
      sole PR-opener with Dependabot kept as a detection-only alert ledger
      (alerts on, PRs suppressed), so dependabot.yml may remain ONLY if every
      ecosystem entry sets open-pull-requests-limit: 0.
    verify: |
      If renovate.json does not exist at repo root: skip (use CI-020 for the gap).
      If renovate.json exists:
        PASS if .github/dependabot.yml is absent.
        PASS if .github/dependabot.yml exists AND every package-ecosystem entry
             under updates: that can open version PRs sets
             open-pull-requests-limit: 0 (Renovate is sole PR-opener; Dependabot
             is detection-only). The limit key governs version-update entries;
             entries that cannot open version PRs do not require it.
        FAIL if .github/dependabot.yml exists with any version-update ecosystem
             entry whose open-pull-requests-limit is unset or > 0 (dual PR-opener).
      Exceptions: dart-frog-paludarium and homelab-agent-configs (Renovate
      ignored; may keep a PR-opening dependabot.yml).
      Note: the "alerts on" half of the detection-only end-state is enforced by
      CI-074; this check covers only PR suppression.
    override_eligible: false
    notes: >-
      Amended 2026-06-02 to accept the detection-only configuration documented
      in docs/reference/dependency-tooling-comparison.md (Recommendation step 7,
      "Make Dependabot detection-only the canonical way"). PR-opening
      dependabot.yml files in the fleet (e.g. AMC, Unify) should either be
      deleted or have open-pull-requests-limit: 0 set per ecosystem.
      Cross-reference: dependency-tooling-comparison.md, validated config change 3.

  - id: CI-033
    domain: ci
    severity: important
    description: >-
      Every workflow file must declare a top-level permissions block that explicitly
      restricts permissions. Relying on the default (write-all) grants every job write
      access to all scopes, violating least-privilege and enabling token-theft escalation.
    verify: |
      For each .github/workflows/*.yml:
        FAIL if no top-level "permissions:" key is present.
        FAIL if the top-level permissions block is absent and job-level permissions are
        not present on every job (job-level grants do not satisfy the workflow-level
        restriction requirement unless the workflow declares "permissions: {}").
    override_eligible: false
    notes: >-
      Scope: workflow-level top-level permissions block (not per-job). CI-034 handles
      job-level timeout enforcement. These two checks are complementary, not overlapping.

  - id: CI-034
    domain: ci
    severity: important
    description: >-
      Every locally-defined job in a workflow file must set timeout-minutes. Jobs without
      a timeout run indefinitely on failure, consuming runner minutes and blocking the
      concurrency slot until GitHub's 6-hour hard limit kills them.
    verify: |
      For each .github/workflows/*.yml:
        For each job NOT defined as a reusable workflow call (i.e., "uses:" key absent):
          FAIL if timeout-minutes is not set on that job.
      Jobs that call reusable workflows via "uses:" are exempt; the timeout should be
      set inside the callee workflow.
    override_eligible: false
    notes: >-
      Scope: job-level timeout-minutes on locally-defined jobs only. CI-033 handles
      workflow-level permissions enforcement. These two checks are complementary.

  - id: CI-035
    domain: ci
    severity: suggested
    description: >-
      Workflows triggered by pull_request or pull_request_target must define a
      concurrency group with cancel-in-progress: true. Without this, redundant runs
      accumulate when a developer pushes multiple commits in quick succession, wasting
      runner minutes and causing noisy PR status updates.
    verify: |
      For each .github/workflows/*.yml that has pull_request or pull_request_target
      in its "on:" block:
        FAIL if no top-level "concurrency:" key is present.
        FAIL if concurrency.cancel-in-progress is not true.
    override_eligible: true

  - id: CI-036
    domain: ci
    severity: important
    description: >-
      A dependency-review.yml workflow must be present for public repos, triggered on
      pull_request, using actions/dependency-review-action with fail-on-severity: high.
      This catches vulnerable new dependencies added in a PR diff before they merge,
      complementing pip-audit (which audits the full lock file, not just the diff).
    verify: |
      file_exists: .github/workflows/dependency-review.yml
      content_present: .github/workflows/dependency-review.yml, dependency-review-action
      content_present: .github/workflows/dependency-review.yml, fail-on-severity: high
    override_eligible: true
    notes: >
      Not applicable to private repos (GitHub's vulnerability database endpoint for
      dependency review is only available on public repos or repos with GitHub Advanced
      Security). Mark N/A with a comment when the repo is private.

  - id: CI-037
    domain: ci
    severity: important
    description: >-
      A PR title validation workflow must be present, enforcing conventional commit
      format on PR titles. Squash merges use the PR title as the resulting commit
      message on main, so an unvalidated PR title becomes a malformed commit in the
      permanent history and breaks semantic-release version inference.
    verify: |
      file_exists: .github/workflows/pr-title.yml
      content_present: .github/workflows/pr-title.yml, action-semantic-pull-request
    override_eligible: true
    notes: >
      Override eligible when the repo uses a different conventional commit enforcement
      mechanism (e.g., commitlint in CI, branch naming rules that already enforce type
      prefixes). Document the alternative in the override entry.

  - id: CI-038
    domain: ci
    severity: important
    description: >-
      An SBOM generation workflow must be present, producing a CycloneDX or SPDX artifact
      on push to the default branch. The SBOM provides the machine-readable dependency
      inventory required by OpenSSF Silver (signed_releases group) and enables downstream
      vulnerability correlation when a new CVE is published against a transitive dependency.
    verify: |
      file_exists: .github/workflows/sbom.yml
      content_present: .github/workflows/sbom.yml, push
    override_eligible: true

  - id: CI-039
    domain: ci
    severity: important
    description: >-
      Python repos must run CI against a matrix that covers Python 3.10 through the
      current stable release (3.13 as of 2026). A python-compatibility.yml workflow
      (or equivalent matrix in ci.yml) must be present. Testing only against the
      deployment version misses syntax and stdlib incompatibilities introduced when
      the project is used as a library on an older interpreter.
    verify: |
      At least one of the following must be true:
        content_present: .github/workflows/python-compatibility.yml, "3.10"
        content_present: .github/workflows/ci.yml, matrix
      FAIL for Python repos if neither condition is met.
    not_applicable_when: "not a Python project"
    override_eligible: true

  - id: CI-040
    domain: ci
    severity: important
    description: >-
      The primary CI workflow should respond to the merge_group event so that merge
      queue builds run the same gate set as PR builds. Without this trigger, the merge
      queue uses a synthetic check that may bypass required status checks, allowing
      a queue entry to merge even if the combined HEAD fails CI.
    verify: |
      content_present: .github/workflows/ci.yml, merge_group
    override_eligible: true
    notes: >
      Promoted from suggested to important on 2026-05-25 as part of the merge queue
      rollout (ByronWilliamsCPA/.github#154). The cost of the trigger when the queue
      is disabled is zero (the event never fires), so there is no downside to having
      it present everywhere. Override eligible with a dated deferral comment when the
      consumer repo has not yet pulled the updated org workflow template
      (ByronWilliamsCPA/.github#163); the rollout is being done per repo. Companion
      check: CI-062 covers the ruleset side.

  - id: CI-041
    domain: ci
    severity: suggested
    description: >-
      The PyPI publish job in release.yml must reference a named GitHub Environment
      (environment: pypi) configured with at least one protection rule (required
      reviewers, deployment branch restriction, or wait timer). Publishing without
      a protected environment means any workflow can trigger a release with no
      additional approval gate.
    verify: |
      content_present: .github/workflows/release.yml, environment:
    override_eligible: true
    not_applicable_when: "repo does not publish to PyPI"

  - id: CI-042
    domain: ci
    severity: suggested
    description: >-
      Test results should be published as inline PR annotations using a JUnit XML
      uploader (e.g., EnricoMi/publish-unit-test-result-action or the equivalent
      step in the org reusable python-ci workflow). Inline annotations surface
      failing test names directly in the PR diff without requiring a developer to
      download and parse the CI log.
    verify: |
      At least one of the following must be true:
        content_present: .github/workflows/ci.yml, publish-unit-test-result-action
        content_present: .github/workflows/ci.yml, python-ci.yml
      The second condition is satisfied when the repo delegates to the org reusable
      python-ci workflow, which includes the annotation step internally.
    override_eligible: true

  # ── Claude and Docs ──────────────────────────────────────────────────────────

  - id: CLAUDE-001
    domain: claude_docs
    severity: important
    description: "Project CLAUDE.md present at project root"
    verify: "file_exists: CLAUDE.md"
    override_eligible: true

  - id: CLAUDE-002
    domain: claude_docs
    severity: important
    description: "CLAUDE.md contains Model Selection section"
    verify: "section_present: CLAUDE.md, Model Selection"
    override_eligible: true

  - id: CLAUDE-003
    domain: claude_docs
    severity: important
    description: "CLAUDE.md contains Response-Aware Development (RAD) section"
    verify: "section_present: CLAUDE.md, Response-Aware Development"
    override_eligible: true

  - id: CLAUDE-004
    domain: claude_docs
    severity: suggested
    description: "CLAUDE.md contains cross-references to global rule files"
    verify: "content_present: CLAUDE.md, .claude/rules/"
    override_eligible: true

  - id: CLAUDE-005
    domain: claude_docs
    severity: important
    description: ".claude/settings.json present with permissions block"
    verify: "file_exists: .claude/settings.json"
    override_eligible: true

  - id: CLAUDE-006
    domain: claude_docs
    severity: important
    description: "CLAUDE.md Essential Commands do not reference legacy Python tools (black, mypy). Replaced by ruff format and basedpyright respectively. Safety check absence is covered separately by CI-051 (workflow YAML scope)."
    verify: "content_absent_any: CLAUDE.md, black,mypy"
    override_eligible: true

  - id: CLAUDE-007
    domain: claude_docs
    severity: critical
    description: "No em-dash characters in docs/**/*.md files"
    verify: "em_dash_absent: docs/**/*.md"
    override_eligible: false
    notes: >-
      PC-011 mechanically enforces this rule via the no-em-dash pre-commit hook on
      every commit. CLAUDE-007 is a conceptual reminder and documentation-scope check.
      Consider removing in a future cleanup once PC-011 coverage is confirmed complete.

  - id: CLAUDE-008
    domain: claude_docs
    severity: suggested
    description: >-
      No AI blacklist pattern words in formal docs (leverage, seamless, robust,
      comprehensive, holistic, crucial, pivotal, vital)
    verify: "ai_patterns_absent: docs/**/*.md"
    override_eligible: true

  - id: CLAUDE-010
    domain: claude_docs
    severity: important
    description: >-
      .claude/settings.json $schema field, when present, must be exactly
      "https://json.schemastore.org/claude-code-settings.json". The slug
      "claude-code-config.json" is not published on schemastore.org and causes
      the Claude Code IDE extension to reject the file with "Settings file
      failed to parse", silently disabling every permission rule it declares.
    verify: |
      Run: python3 -c '
      import json, pathlib, sys
      p = pathlib.Path(".claude/settings.json")
      try:
          s = json.loads(p.read_text()).get("$schema") if p.exists() else None
      except (json.JSONDecodeError, OSError):
          sys.exit(1)
      sys.exit(0 if s is None or s == "https://json.schemastore.org/claude-code-settings.json" else 1)
      '
      FAIL if .claude/settings.json exists and its $schema field is set to
      anything other than the canonical schemastore URL above. A missing
      $schema field is allowed (the IDE extension treats it as opt-out of
      schema validation); a wrong $schema is a hard fail because the
      extension rejects the entire file and disables every permission rule.
      A malformed JSON file also fails (the inline script catches
      JSONDecodeError and OSError and exits 1) rather than aborting with
      an uncaught traceback.
    override_eligible: false
    notes: >-
      The verify clause is an inline python invocation rather than a
      structured DSL prefix (file_exists:, content_present:, em_dash_absent:,
      etc.). This is intentional: no existing DSL verb expresses "JSON field
      at path equals literal string", and adding one for a single check site
      is not yet justified. If a second check needs the same shape, promote
      this pattern to a real DSL verb (for example json_field_equals:) and
      migrate CLAUDE-010 at the same time. The outer bash quoting uses
      single quotes so the literal $schema reference inside the python
      script is not variable-expanded by the calling shell.
    source_frameworks:
      - Claude Code settings schema (schemastore.org)

  - id: CLAUDE-011
    domain: claude_docs
    severity: important
    description: >-
      All file paths and commands referenced in CLAUDE.md and AGENTS.md resolve
      against the current repository tree. Stale references indicate the steering
      file has not been updated after a rename or deletion.
    verify: |
      script: scripts/check-steering-refs.sh
      The script must:
      1. Extract paths from DSL-style verbs (file_exists:, content_present:,
         section_present:, etc.), ~/.claude/ and ~/dev/.claude/ globals, and
         bare relative paths with an extension inside backtick spans.
      2. For each extracted path, confirm the file or directory exists on disk;
         global ~/.claude paths resolve against the installed config tree.
      3. For each known command leader referenced in backticks (ruff,
         pre-commit, basedpyright, git, gh, python3), confirm it is on PATH.
      4. Exit non-zero if any reference is broken; print the broken references.
    override_eligible: true
    notes: >-
      Scope: referenced paths and commands only. Do not parse or score prose
      content; this check is not a style or completeness gate. The intent is to
      catch file moves (for example .claude/rules/python.md renamed or deleted)
      that leave a dangling reference in CLAUDE.md without any other signal.
      CLAUDE-004 already checks that cross-references to .claude/rules/ are
      present; CLAUDE-011 checks that those referenced files actually exist.

  - id: CLAUDE-012
    domain: claude_docs
    severity: important
    description: >-
      AGENTS.md, CLAUDE.md, and GEMINI.md carry consistent core directives.
      The core directive block (sentinel: <!-- core-directives:v1 -->) must be
      present in every steering file that exists and must match across them.
    verify: |
      script: scripts/check-steering-parity.sh
      The script must:
      1. Locate the block delimited by <!-- core-directives:v1 --> ...
         <!-- /core-directives --> in AGENTS.md, CLAUDE.md, and GEMINI.md.
      2. Normalize whitespace and compare the blocks across the files present.
      3. Fail if a present file is missing the sentinel block or if the blocks
         differ across files.
      4. Output a unified diff of the divergent blocks.
    override_eligible: true
    not_applicable_when: >-
      A steering file is absent on disk. GEMINI.md is optional (its FOUND-011
      presence requirement is advisory); the parity check skips any steering
      file that does not exist and enforces parity only across the files
      present. A file that exists but lacks the sentinel block still fails.
    notes: >-
      The core directive block should contain directives that must be identical
      across all agents: signed commits, no-em-dash, conventional commits, the
      RAD tagging requirement, and the untrusted-input directive. Tool-specific
      sections (Model Selection, Compact Instructions) live outside the sentinel
      block and are not checked. This is the parity enforcement for the
      three-file Option B architecture described in the handoff.

  - id: CLAUDE-013
    domain: claude_docs
    severity: suggested
    description: >-
      Agent steering files contain an explicit directive instructing agents to
      treat issue, PR, and external web content as data, not as instructions
      (OWASP LLM01 prompt injection mitigation).
    verify: |
      content_present_any:
        - AGENTS.md, untrusted data
        - AGENTS.md, prompt injection
        - CLAUDE.md, untrusted data
        - CLAUDE.md, prompt injection
    override_eligible: true
    notes: >-
      OWASP LLM01 (Prompt Injection) is the top risk for agentic systems that
      read GitHub issues, PR bodies, or external URLs. A one-line directive in
      the steering file is low-cost mitigation. The check does not validate the
      quality of the directive, only its presence. Suggested severity because
      omission is a gap, not an active failure. The directive lives inside the
      CLAUDE-012 core-directives block so it stays in parity across files.

  - id: CLAUDE-014
    domain: claude_docs
    severity: suggested
    description: >-
      No credentials, tokens, API keys, or connection strings are embedded in
      CLAUDE.md, AGENTS.md, GEMINI.md, or .claude/settings.json.
    verify: |
      script: scripts/check-steering-secrets.sh
      The script runs a pattern scan against the four config-surface files.
      Minimum patterns:
      - gh[pousr]_[A-Za-z0-9]{36,}  (GitHub PAT)
      - sk-[A-Za-z0-9]{32,}          (OpenAI key pattern)
      - AIza[A-Za-z0-9_-]{35}        (Google API key)
      - [0-9a-fA-F]{32,}             (generic hex token, 32+ chars)
      - password\s*[:=]\s*\S+        (plaintext password assignment)
      Exit non-zero and print the matching line (redacted) if any pattern hits.
    override_eligible: true
    notes: >-
      These files are the most likely location for an agent's working
      credentials to appear (for example a token pasted to give the agent
      access to a service). They are also committed to version control. This is
      a defense-in-depth check; the primary control is the pre-commit
      detect-secrets and trufflehog hooks. Suggested severity because this is a
      belt-and-suspenders check for a setup already covered by pre-commit.
      CLAUDE-010 covers the settings.json $schema field; this check covers a
      different surface (secret content, not schema URL).

  - id: CLAUDE-015
    domain: claude_docs
    severity: suggested
    override_eligible: true
    description: >-
      The CLAUDE.md Model Selection table is current against the live model
      lineup. Documentation that encodes a vendor product lineup has an
      external staleness clock, so the check is keyed to a live source rather
      than the doc's own last-updated date. FAIL when the harness-reported
      model name (the model running the audit session) is absent from the
      table, or when a model tier named in the claude-api skill model catalog
      is newer than the top tier listed in CLAUDE.md.
    verify: >-
      Compare the model identifiers in the CLAUDE.md Model Selection section
      against a live source, in this order of preference:
      (1) the harness-reported model id for the current session;
      (2) the model catalog in the claude-api skill
      (~/.claude/skills/claude-api or the installed plugin equivalent).
      FAIL if the current harness model id is not represented in the table,
      OR if the live catalog lists a tier newer than the table's top entry.
      Also verify the agent-authoring enum in .claude/agents/CLAUDE.md
      includes every frontmatter model value the live source supports
      (for example a newly released fable tier). Advisory only; no automated
      remediation. This check is global-config-scoped.
    not_applicable_when: >-
      CLAUDE.md has no Model Selection section (CLAUDE-002 covers presence),
      OR no live model source is reachable in the current environment.
    source_frameworks:
      - manifest-internal
      - claude-api skill model catalog
    notes: >-
      Added 2026-06-17 at severity: suggested per feedback_policy_execution_gap.md.
      Motivated by drift caught only during an explicit Fable-readiness review:
      the table referenced Opus 4.7 while Opus 4.8 and Fable 5 were already
      released, and the agent enum omitted the fable frontmatter value. Tie the
      trigger to the harness model id or claude-api catalog, never to the doc's
      last_updated field. Primarily applies to the global ~/dev/.claude config
      repo whose CLAUDE.md carries the canonical Model Selection table; project
      CLAUDE.md files that omit the table are not_applicable. Routing:
      claude-docs-auditor agent (extends its CLAUDE-* coverage).

  # ── OSSF (Best Practices Badge + Scorecard) ──────────────────────────────────
  # These checks supplement the live Scorecard API and Badge API results with
  # local file content that those APIs cannot evaluate. The ossf-compliance-auditor
  # agent queries the APIs first and uses these checks only for gaps the APIs miss.

  - id: OSSF-001
    domain: ossf
    severity: important
    description: >-
      OpenSSF Best Practices Badge application filed (Passing level) -- verified via
      bestpractices.coreinfrastructure.org API
    verify: "ossf_badge_api: level=passing"
    override_eligible: true
    visibility_required: public  # badge API is designed for public OSS; private repos are rarely registered

  - id: OSSF-002
    domain: ossf
    severity: critical
    description: >-
      SECURITY.md documents a private vulnerability reporting channel (GitHub Security
      Advisories or equivalent)
    verify: "content_present: SECURITY.md, private"
    override_eligible: false
    notes: >-
      FOUND-001 checks file presence only. OSSF-002 checks content quality: the
      file must document a private reporting channel. Do not merge or deduplicate
      these two checks; they satisfy different framework requirements.

  - id: OSSF-003
    domain: ossf
    severity: critical
    description: "SECURITY.md states a maximum initial response SLA of 14 days"
    verify: "content_present: SECURITY.md, 14"
    override_eligible: false

  - id: OSSF-004
    domain: ossf
    severity: important
    description: "CHANGELOG entries for vulnerability fixes include the CVE ID"
    verify: "changelog_cve_pattern: CHANGELOG.md, CVE-[0-9]{4}-[0-9]+"
    override_eligible: true

  - id: OSSF-005
    domain: ossf
    severity: suggested
    description: >-
      Library projects have published API reference docs; non-library projects have N/A
      marker in README or CONTRIBUTING
    verify: "ossf_api_docs: docs/api/ OR README contains 'N/A' near 'API reference'"
    override_eligible: true

  - id: OSSF-006
    domain: ossf
    severity: suggested
    description: >-
      OpenSSF Best Practices Silver badge application filed for flagship public repos
      -- verified via bestpractices.dev API. Applies only to repos designated
      flagship in the org catalog; all others are not_applicable.
    verify: "ossf_badge_api: level=silver"
    override_eligible: true
    visibility_required: public  # same rationale as OSSF-001; private repos exempt
    not_applicable_when: >-
      repo is not designated flagship in the org catalog (docs/reference/github-repos.md
      or equivalent). A flagship repo has external_contributors > 0 in the past 12
      months OR is explicitly tagged flagship: true in the catalog.

  - id: OSSF-007
    domain: ossf
    severity: important
    description: "GitHub org requires 2FA for all members -- verified via GitHub API (OpenSSF Gold: require_2FA)"
    verify: "github_org_2fa: ByronWilliamsCPA, two_factor_requirement_enabled=true"
    override_eligible: false
    notes: >-
      Covers the ByronWilliamsCPA org only. The GitHub org-2FA API
      (two_factor_requirement_enabled) does not apply to user accounts.
      The williaby user account is covered by OSSF-014 (manual attestation),
      because GitHub does not expose user-account 2FA status via any public API.

  - id: OSSF-008
    domain: ossf
    severity: important
    description: "GitHub Secret Scanning alerting enabled for the repo"
    verify: "github_api: repo.security_and_analysis.secret_scanning.status == enabled"
    override_eligible: true
    notes: >-
      Public repos: secret scanning is free and configurable at the repo level under Settings >
      Code security. No org GHAS license required. A disabled status on a public repo is an
      actionable gap, not a structural limitation.
      Private repos: requires GitHub Advanced Security at the org level. If the org lacks GHAS,
      accept as a structural gap and document in docs/known-vulnerabilities.md.

  - id: OSSF-009
    domain: ossf
    severity: important
    description: "GitHub Secret Scanning push protection enabled for the repo (requires OSSF-008 to pass first)"
    verify: "github_api: repo.security_and_analysis.secret_scanning_push_protection.status == enabled"
    override_eligible: true
    notes: >-
      Push protection blocks pushes containing a detected secret before it enters git history.
      Depends on OSSF-008 (secret scanning alerting).
      Public repos: free, no GHAS license required. Disabled status is an actionable gap.
      Private repos: requires org-level GHAS. If unavailable, document in docs/known-vulnerabilities.md.

  - id: OSSF-010
    domain: ossf
    severity: suggested
    description: >-
      SECURITY.md includes a repo-specific security surface section naming the attack
      vectors and mitigations in place (not just generic security practice lists)
    verify: "content_present: SECURITY.md, surface OR attack surface OR primary security"
    override_eligible: true
    notes: >-
      A scope section converts SECURITY.md from a compliance checkbox into actionable
      contributor guidance. The section must name the specific attack vectors relevant to
      this repo (e.g., ZIP path traversal in a downloader, SQL injection in a query tool,
      dependency vulnerabilities in any Python project) and the mitigations currently in
      place for each. Generic lists of security tools or practices do not satisfy this check;
      the content must be repo-specific. Reference implementation: ByronWilliamsCPA/gleif
      SECURITY.md "Scope" section. Template: add to .github/SECURITY.md under a
      "Security surface areas" heading with repo-specific placeholders.

