  # =========================================================================
  # Operations Domain (applies_to: deployed_repos -- skipped for isDeployed=false)
  #
  # Why this domain exists: every other assurance loop in this fleet closes over
  # the git tree. Bandit, CodeQL, OSV-Scanner, Snyk, SonarCloud, Trivy, Scorecard,
  # SLSA, SBOM and every OWASP specialist agent read a source repository. A
  # control that lives in a dashboard, a connection string, a log stream, an
  # outbound alerting channel, or a different repository is invisible to all of
  # them. A downstream project with 34 workflows, ~14 blocking PR checks, an
  # 8-finder red-team review and a 15-item Definition of Done scored 5/10 on a
  # basic operational checklist for exactly this reason: no bot protection, a
  # table-owner (BYPASSRLS) database role, no log redaction, no attack alerting,
  # and no backups or restore drill. None of those are detectable from a tree.
  #
  # Verifiability rule for this domain: every verify names a DURABLE ARTIFACT,
  # not an assertion of intent. Not "backups are configured" but "a restore-drill
  # log exists, dated within N months". Not "alerting exists" but "an alert-rule
  # file exists and carries a test-fire timestamp". A check whose verify can be
  # satisfied by claiming a control is present cannot fail, and a check that
  # cannot fail manufactures false coverage. That is the same defect as a hollow
  # OWASP category, in a new costume.
  #
  # Attestation checks carry a max_evidence_age_days field. The clock belongs on
  # the EVIDENCE, not on the remediation: deferred work with a phase home is
  # legitimate, but a claimed control with no dated evidence behind it is not.
  #
  # All checks start at severity: suggested with override_eligible: true per the
  # define-before-reach rule (feedback_policy_execution_gap.md). Promote to
  # important only after a fleet sweep shows reach. Reach is currently zero:
  # isDeployed is null on all 45 catalog entries pending owner declaration, so
  # this domain resolves UNKNOWN fleet-wide and the sweep reports it loudly
  # rather than skipping it. See docs/reference/github-repos.json.
  #
  # Human-facing narrative companions (do NOT fold these checks into them; a
  # skill leaves no trace in the master log, gets no delta caching, no fleet
  # escalation at the 3-repo threshold, and no staleness detection):
  #   .claude/skills/shipping-and-launch/SKILL.md
  #   .claude/skills/observability-and-instrumentation/SKILL.md
  # =========================================================================

  - id: OPS-001
    domain: operations
    severity: suggested
    description: "Deployed runtime configuration is attested in a dated document"
    verify: >-
      file_exists: docs/operations/runtime-config.md AND it enumerates every
      runtime-affecting setting the deployed process reads (environment
      variables, feature flags, connection targets) with the value CLASS in
      production (not the value itself), AND carries a verified_on date within
      max_evidence_age_days. Nothing else in this repo verifies what the running
      process is actually configured with, only what is in the tree.
    applies_to: deployed_repos
    override_eligible: true
    max_evidence_age_days: 180
    check_family: operational-posture
    verification_class: RUNTIME-CONFIG
    sp_category: SP-09
    mechanism: unproven
    source_frameworks:
      - NIST SSDF PO.5.1
      - SOC 2 CC7.1
    notes: >-
      Cross-reference: shipping-and-launch SKILL.md "Infrastructure" section
      ("Environment variables set in production"), which is the human-facing
      narrative for a single deploy. This check is the durable, logged,
      fleet-escalating half. Deliberately asks for the value CLASS (set/unset,
      secret-manager-sourced/plaintext), never the value: see the
      defang-secret-shaped-strings rule in repo-compliance SKILL.md.

  - id: OPS-002
    domain: operations
    severity: suggested
    description: "Application data-store role is documented and is not the table owner"
    verify: >-
      file_exists: docs/operations/service-credentials.md AND for each data store
      it names the role the deployed application connects as, the privileges
      granted to that role, and an explicit statement that the role is NOT the
      table owner, NOT a superuser, and does NOT hold BYPASSRLS; AND carries a
      verified_on date within max_evidence_age_days. Least privilege exists in
      this manifest only for GitHub Actions tokens (CI-*); this is the service
      credential half.
    applies_to: deployed_repos
    override_eligible: true
    max_evidence_age_days: 180
    check_family: operational-posture
    verification_class: RUNTIME-CONFIG
    sp_category: SP-02
    mechanism: unproven
    source_frameworks:
      - SOC 2 CC6.1
      - OWASP ASVS V1.2 Authentication Architecture
      - CIS PostgreSQL Benchmark
    notes: >-
      The motivating failure: an application connecting as the table-owner
      `postgres` role, which holds BYPASSRLS. Row-level security was enabled and
      therefore reported as present, but was disarmed at the connection. Enabled
      is not effective. See OPS-003 for the policy half of the same control.

  - id: OPS-003
    domain: operations
    severity: suggested
    description: "Row-level security, where claimed, is proven effective in both directions"
    verify: >-
      not_applicable_unless the repo claims row-level security or equivalent
      tenant isolation. When claimed, require a committed test that asserts BOTH
      directions against the deployed role: (a) a tenant cannot read another
      tenant's row, and (b) the tenant CAN read its own row. A committed test is
      necessary but not sufficient: also require a dated execution-result
      artifact, at the fixed path docs/operations/rls-verification-log.md,
      because a test that has never run against the deployed role proves only
      that someone wrote it. Each row carries four fields: the run date, the
      deployed role the queries ran as, the cross-tenant read outcome, and the
      same-tenant read outcome. Fail the check when that file is absent, when
      the most recent row omits any of the four, or when its date is older than
      max_evidence_age_days. A result asserted in prose with no committed row does not
      satisfy this check. Record the precondition that makes this check not
      applicable when it is skipped.
    applies_to: deployed_repos
    override_eligible: true
    max_evidence_age_days: 90
    check_family: operational-posture
    verification_class: DYNAMIC
    sp_category: SP-02
    mechanism: unproven
    source_frameworks:
      - OWASP API Security API01:2023 BOLA
      - SOC 2 CC6.1
    notes: >-
      RLS fails in two opposite ways that both look like "RLS: enabled" on a
      checklist. A BYPASSRLS or owner role disarms every policy (see OPS-002); a
      table with RLS enabled and no policies denies everything, which is often
      mistaken for a working deny-by-default. Only a two-direction test
      distinguishes working isolation from either failure. A `not applicable`
      verdict here must carry a falsifiable precondition plus the command that
      re-tests it, so the verdict un-asserts itself when the schema changes.

  - id: OPS-004
    domain: operations
    severity: suggested
    description: "Application logs redact secrets, proven by a test"
    verify: >-
      A redaction filter is installed on the application logger AND a committed
      test asserts that a known secret-shaped input (token, password, API key,
      full DSN, session cookie) does not appear in emitted log output. Presence
      of a redaction helper without a test asserting its effect does not satisfy
      this check.
    applies_to: deployed_repos
    override_eligible: true
    check_family: operational-posture
    verification_class: DYNAMIC
    sp_category: SP-11
    mechanism: unproven
    source_frameworks:
      - OWASP Top 10 A09:2025 Security Logging and Alerting Failures
      - OWASP ASVS V7 Error Handling and Logging
      - SOC 2 CC6.7
    notes: >-
      Secret scanners (detect-secrets, TruffleHog, gitleaks, Snyk) read source at
      commit time. None reads runtime output, so a secret that reaches a log
      stream is invisible to every gate in this manifest. The durable artifact is
      the test, not the filter: a filter with no test is an untested claim.

  - id: OPS-005
    domain: operations
    severity: suggested
    description: "Security-relevant events are logged against a documented taxonomy"
    verify: >-
      file_exists: docs/operations/security-events.md enumerating the security
      events this application emits, at minimum authentication failure,
      authorization denial, rate-limit trip, and input-validation rejection; AND
      each named event is greppable in application source as an actual logging
      call. A taxonomy documenting events the code never emits fails this check.
    applies_to: deployed_repos
    override_eligible: true
    check_family: operational-posture
    verification_class: STATIC
    sp_category: SP-11
    mechanism: unproven
    source_frameworks:
      - OWASP Top 10 A09:2025 Security Logging and Alerting Failures
      - OWASP ASVS V7.2 Log Processing
      - NIST SP 800-92
    notes: >-
      This is the detection half of OWASP A09. The owasp-web agent lists
      A09:2025 in its categories table but has no detection pattern for it and
      cannot acquire one: source analysis cannot observe a log stream. A09 is
      annotated NOT STATICALLY DETECTABLE in that agent and points here.

  - id: OPS-006
    domain: operations
    severity: suggested
    description: "Security alerts exist, route to a human, and have been test-fired"
    verify: >-
      An alert-rule definition is committed (not configured only in a vendor
      console) covering at least authentication-failure spikes and
      authorization-denial spikes, AND it names the destination channel that
      receives it, AND a durable committed log at
      `docs/operations/alert-test-fire-log.md` records the test-fire. Each
      log row must carry four fields: the test-fire timestamp, the identity of
      the alert rule fired, the destination channel it was delivered to, and
      the delivery result observed at that destination. A row missing any of
      the four is not a test-fire record. The most recent row for a given rule
      must fall within max_evidence_age_days. A rule with no such row does not
      satisfy this check, and neither does a timestamp asserted in prose with
      no artifact behind it.
    applies_to: deployed_repos
    override_eligible: true
    max_evidence_age_days: 180
    check_family: operational-posture
    verification_class: RUNTIME-CONFIG
    sp_category: SP-11
    mechanism: unproven
    source_frameworks:
      - OWASP Top 10 A09:2025 Security Logging and Alerting Failures
      - SOC 2 CC7.2
      - Google SRE Workbook, Alerting on SLOs
    notes: >-
      "No alerting when an attack occurs, at all" was one of five failures in the
      motivating audit, and it survived multiple security reviews because no
      agent in this fleet can reach an outbound notification channel. An alert
      that pages nobody is not alerting, which is why the destination and the
      test-fire are both required. Cross-reference: shipping-and-launch
      "Observability" ("Symptom-based alerts created and test-fired") and the
      observability-and-instrumentation skill.

  - id: OPS-007
    domain: operations
    severity: suggested
    description: "Automated backups are inventoried with schedule, retention, and destination"
    verify: >-
      file_exists: docs/operations/backup-inventory.md naming every stateful
      store the application depends on, and for each: backup schedule, retention
      window, destination, and whether the destination is in a different failure
      domain than the primary. A store present in the application but absent from
      the inventory fails this check. The document must carry a verified_on date
      within max_evidence_age_days.
    applies_to: deployed_repos
    override_eligible: true
    max_evidence_age_days: 365
    check_family: operational-posture
    verification_class: MANUAL
    sp_category: SP-16
    mechanism: unproven
    source_frameworks:
      - SOC 2 A1.2
      - NIST SP 800-34
    notes: >-
      Backups have zero coverage anywhere in this fleet: the only prior `backup`
      reference in the whole standards tree is GPG private-key backup. This check
      records intent; OPS-008 is the one that proves the intent works.

  - id: OPS-008
    domain: operations
    severity: suggested
    description: "A restore drill has actually been performed and logged"
    verify: >-
      file_exists: docs/operations/restore-drill-log.md with at least one dated
      entry within max_evidence_age_days recording: date, source backup
      identifier, target environment, elapsed restore time, and the verification
      step that confirmed the restored data was usable. An untested backup is an
      unproven backup; "backups are configured" does not satisfy this check.
    applies_to: deployed_repos
    override_eligible: true
    max_evidence_age_days: 180
    check_family: operational-posture
    verification_class: MANUAL
    sp_category: SP-16
    mechanism: unproven
    source_frameworks:
      - SOC 2 A1.3
      - NIST SP 800-34
    notes: >-
      Deliberately separated from OPS-007 so a configured-but-never-tested backup
      cannot pass by proximity. This is the canonical durable-artifact check in
      this domain: the verify names a dated log entry, not a state of the world
      that an auditor could assert without evidence.

  - id: OPS-009
    domain: operations
    severity: suggested
    description: "Public write paths carry an anti-automation control"
    verify: >-
      For every unauthenticated endpoint that creates state (signup, password
      reset, contact and feedback forms, invite acceptance, public API writes),
      an anti-automation control is named and located: CAPTCHA or equivalent
      challenge, per-IP or per-identifier rate limit, or proof-of-work. Enumerate
      the public write paths first, then map each to its control; an unmapped
      path is a finding. Record the enumeration and the mapping in a committed
      inventory at docs/operations/public-write-paths.md, one row per
      unauthenticated state-creating endpoint naming the endpoint, the control
      protecting it, and where that control is enforced. An enumeration that
      exists only in an audit narrative is not reviewable and does not satisfy
      this check: without the committed inventory, two auditors reach different
      verdicts and a path that was never listed reads identically to one that
      has no control.
    applies_to: deployed_repos
    override_eligible: true
    check_family: operational-posture
    verification_class: DYNAMIC
    sp_category: SP-04
    mechanism: unproven
    source_frameworks:
      - OWASP ASVS V11 Business Logic
      - OWASP Automated Threats OAT-019 Account Creation
      - OWASP API Security API04:2023 Unrestricted Resource Consumption
    notes: >-
      Bot protection has zero coverage in this fleet: `captcha` and
      `bot protection` return no hits across agents, skills, rules, standards, or
      any other manifest check. Frequently the control lives in a vendor console
      rather than the repo, in which case OPS-012 governs whether it is
      reviewable. Cross-reference: shipping-and-launch "Security" section, which
      covers rate limiting on authentication endpoints but not signup or public
      forms.

  - id: OPS-010
    domain: operations
    severity: suggested
    description: "Runtime secrets are sourced from a secret manager, not baked into the artifact"
    verify: >-
      docs/operations/runtime-config.md (see OPS-001) records, for each secret
      the deployed process reads, the mechanism that supplies it at runtime, AND
      no deployment artifact in this repo (Dockerfile, compose file, chart,
      workflow) copies a populated .env file or embeds a literal credential.
      Record the secret NAME and mechanism only, never the value.
    applies_to: deployed_repos
    override_eligible: true
    check_family: operational-posture
    verification_class: RUNTIME-CONFIG
    sp_category: SP-08
    mechanism: unproven
    source_frameworks:
      - OWASP ASVS V6 Stored Cryptography
      - SOC 2 CC6.1
      - NIST SSDF PW.9.1
    notes: >-
      Partially statically detectable, which is why the artifact half is kept
      alongside the attestation half: a Dockerfile COPY of .env is greppable, but
      a platform environment variable set by hand in a hosting dashboard is not.

  - id: OPS-011
    domain: operations
    severity: suggested
    description: "Authentication endpoints are rate limited, with the limit recorded"
    verify: >-
      Scope this check to the authentication endpoints the service actually
      exposes, drawn from login, token refresh, password reset request, and MFA
      verification. Each exposed endpoint carries a rate limit, and the
      configured limit (requests per window, scope key) is recorded in
      docs/operations/runtime-config.md. An endpoint the service does not
      expose is not a finding; record which of the four are exposed so the
      exclusion is falsifiable rather than assumed. This check is not
      applicable only when the service exposes none of the four. Where the
      limit is enforced by a managed auth provider rather than application
      code, OPS-012 governs whether that setting is reviewable.
    applies_to: deployed_repos
    override_eligible: true
    check_family: operational-posture
    verification_class: RUNTIME-CONFIG
    sp_category: SP-04
    mechanism: unproven
    source_frameworks:
      - OWASP ASVS V2.2 General Authenticator Security
      - OWASP API Security API04:2023 Unrestricted Resource Consumption
    notes: >-
      shipping-and-launch "Security" already lists "Rate limiting on
      authentication endpoints" as a pre-launch checkbox. This check makes the
      configured value recorded and auditable rather than a one-time yes/no at
      deploy time, and covers the managed-provider case that a source scan
      cannot see.

  - id: OPS-012
    domain: operations
    severity: suggested
    description: "Managed-service console settings are versioned and pushed by CI"
    verify: >-
      For every managed service this application depends on (auth provider,
      database platform, payment processor, email or SMS sender, CDN or WAF), a
      config file representing its settings is committed AND a workflow actually
      pushes it (for example a `supabase config push` step). A committed config
      file that no workflow applies governs local development only and does not
      satisfy this check. Enumerate at minimum: bot-protection settings, auth
      rate limits, JWT expiry, session timebox, password policy, webhook signing
      secrets (name and rotation date only, never the value), and OAuth redirect
      URI allowlists.
    applies_to: deployed_repos
    override_eligible: true
    check_family: operational-posture
    verification_class: RUNTIME-CONFIG
    sp_category: SP-09
    mechanism: unproven
    source_frameworks:
      - SOC 2 CC8.1
      - NIST SSDF PO.3.2
    notes: >-
      The motivating case: `supabase/config.toml` was committed but
      `supabase config push` appeared in no workflow, so the file governed local
      development only while captcha settings, auth rate limits, JWT expiry,
      session timebox, and password policy all lived unversioned in a vendor
      dashboard, invisible to every audit and reviewable by nobody. This
      generalizes to any repo with a managed-service dependency. The
      committed-but-never-applied shape is the same fail-open pattern as the
      silent-skip pre-commit wrapper documented in repo-compliance SKILL.md.

  # ── Framework Gap Analysis Additions (2026-05-14) ────────────────────────────
  # Source: 9-agent framework gap analysis against OWASP/NIST SSDF/OpenSSF/SLSA/
  # GitHub Security/DORA/SOC 2/CNCF Security TAG.
  # All IDs confirmed clean (no collisions). Append approved after human review.

  - id: CI-043
    domain: ci
    severity: critical
    override_eligible: false
    description: >-
      Detect dangerous workflow patterns combining privileged triggers
      (pull_request_target or workflow_run) with checkout of untrusted code.
      OpenSSF Scorecard assigns Critical weight to this finding because the
      pattern allows untrusted PR code to execute in a privileged context
      with access to repository secrets.
    verify: >-
      Run: for pattern in pull_request_target workflow_run; do
      grep -rl "$pattern" .github/workflows/ 2>/dev/null
      | xargs -r grep -l "actions/checkout" 2>/dev/null; done;
      any match is a FAIL unless the workflow is manually verified to not
      execute or trust the checked-out code.
    source_frameworks:
      - OpenSSF Scorecard Dangerous-Workflow
      - GitHub Security Hardening
      - OWASP A05 Security Misconfiguration

  - id: CI-044
    domain: ci
    severity: important
    override_eligible: false
    description: >-
      Verify step-security/harden-runner egress-policy is set to "block"
      (not "audit") in release and SLSA provenance workflows. SLSA L3
      requires hermetic build isolation; audit mode logs network traffic
      but does not enforce isolation, undermining the L3 attestation claim.
    verify: >-
      Run: grep -A5 "harden-runner" .github/workflows/release.yml
      .github/workflows/slsa-provenance.yml 2>/dev/null
      | grep "egress-policy"; FAIL if any matched line shows "audit"
      instead of "block".
    source_frameworks:
      - SLSA L3 Build Isolation
      - CIS Software Supply Chain Security Control 2.3
      - NIST SSDF PW.4.4

  - id: CI-045
    domain: ci
    severity: important
    override_eligible: true
    description: >-
      Verify release.yml specifies a named "environment:" field on
      deployment or publish jobs. Named environments enable required
      reviewers, wait timers, and deployment branch restrictions even
      for solo-developer repositories.
    verify: >-
      Run: grep -B2 -A20 "deploy:\|release:\|publish:"
      .github/workflows/release.yml 2>/dev/null
      | grep "environment:"; PASS if found, WARN if absent.
    source_frameworks:
      - GitHub Security Hardening
      - SOC 2 CC8.1 Change Management

  - id: CI-046
    domain: ci
    severity: suggested
    override_eligible: true
    description: >-
      Verify all third-party Actions referenced in workflows come from an
      approved publisher allowlist (actions/, github/, slsa-framework/,
      step-security/, codecov/, pypa/, sigstore/). Restricting publisher
      orgs reduces supply-chain risk beyond SHA pinning alone.
    verify: >-
      Run: grep -rh "uses:" .github/workflows/ 2>/dev/null
      | awk '{print $2}' | cut -d@ -f1 | sort -u;
      manual review required to confirm each org is on the approved list.
    source_frameworks:
      - CIS Software Supply Chain Security Control 2.3
      - SLSA L2
      - OpenSSF Scorecard Pinned-Dependencies

  - id: CI-047
    domain: ci
    severity: important
    override_eligible: true
    description: >-
      Verify all Claude agent definitions in .claude/agents/*.md include
      documented resource limits or timeout constraints. Agents that
      execute user-controlled prompts without bounded execution risk
      excessive resource consumption (OWASP LLM10).
    verify: >-
      Run: for f in .claude/agents/*.md; do
      grep -qi "timeout\|max.*iterations\|resource.*limit" "$f"
      || echo "MISSING: $f"; done; FAIL if any file is missing constraints.
    source_frameworks:
      - OWASP LLM10 Unrestricted Resource Consumption
      - NIST SSDF PO.3.2

  - id: CI-048
    domain: ci
    severity: suggested
    override_eligible: true
    description: >-
      Verify semantic-release configuration includes a CHANGELOG.md update
      plugin. Automated changelog generation provides deployment
      traceability that supports MTTR analysis and SOC 2 change
      documentation requirements.
    verify: >-
      Run: grep -r "@semantic-release/changelog\|changelog"
      .releaserc* release.config.* .github/workflows/release.yml
      2>/dev/null | head -5; PASS if any match found.
    source_frameworks:
      - DORA MTTR Proxy
      - SOC 2 CC8.1

  - id: CI-049
    domain: ci
    severity: suggested
    override_eligible: true
    description: >-
      Verify a secret rotation policy is documented in SECURITY.md or
      docs/security-analysis*.md. A documented rotation cadence (even
      if quarterly) demonstrates SOC 2 CC6.1 control intent.
    verify: >-
      Run: grep -ril "rotation\|rotate.*secret\|secret.*rotat"
      docs/security-analysis*.md SECURITY.md 2>/dev/null | wc -l;
      WARN if result is 0.
    source_frameworks:
      - CNCF Security TAG Secret Management
      - SOC 2 CC6.1
      - NIST SSDF PO.2.2

  - id: CI-050
    domain: ci
    severity: important
    override_eligible: true
    description: >-
      Verify security fix commits reference corresponding regression test
      additions. For each security-fix commit citing a CVE (the changelog is
      generated from these commit messages by python-semantic-release),
      a tests/ file should be modified in the same or adjacent commit.
    verify: >-
      git_commit_association: CHANGELOG.md entries matching /CVE-|security fix/i
      must have at least one file path beginning with tests/ in the same commit.
      Use: git log --name-only --grep="CVE-\|security fix" to extract candidate
      commits; flag any where no line begins with "tests/".
    source_frameworks:
      - NIST SSDF RV.2.2 Regression Tests for Exploit Paths

  - id: CI-051
    domain: ci
    severity: important
    override_eligible: false
    description: >-
      safety command absent from workflow YAML (replaced by OSV-Scanner,
      Dependency-Review, and pip-audit). Prevents reintroduction of the
      safety 3.x CLI drift surface that caused cascading regressions in
      2026-05 (ByronWilliamsCPA/.github PRs #136/#137/#138).
    verify: >-
      content_absent_any: .github/workflows/*.yml, safety check, safety scan, safety --
    source_frameworks:
      - manifest-internal
    notes: >-
      Safety's free-tier Python CVE data is a strict subset of OSV-Scanner's
      sources (PyPA + GHSA + OSS-Fuzz). License scanning requires Safety
      paid tier and is not invoked by any current workflow. Coverage is
      fully maintained by OSV-Scanner + Dependency-Review + pip-audit +
      Renovate vulnerability alerts.

  - id: CI-052
    domain: ci
    severity: important
    override_eligible: false
    description: >-
      CodeRabbit config must not enable request_changes_workflow.
      When set to true, CodeRabbit submits formal CHANGES_REQUESTED
      reviews that block PR merges through branch protection, even on
      solo-dev repos where required_approving_review_count is 0.
      Default CodeRabbit behavior (and the fleet-wide standard) is
      plain inline comments and suggestions, not formal review gating.
      Recurring finding: an 11-repo sweep on 2026-05-15 flipped the
      flag after the bot began silently blocking otherwise-mergeable
      PRs across both orgs.
    verify: >-
      content_absent: .coderabbit.yaml, request_changes_workflow: true.
      Also check .coderabbit.yml (alternate extension) if present.
      Flag explicit `request_changes_workflow: true` only; explicit
      `false` or unset key both PASS.
    not_applicable_when: "neither .coderabbit.yaml nor .coderabbit.yml exists at the repo root (CodeRabbit either not installed or relying on defaults; default request_changes_workflow value is false)"
    source_frameworks:
      - manifest-internal
    notes: >-
      The bot continues to post comments and suggestions when this
      flag is false; only the formal CHANGES_REQUESTED gate is
      disabled. Pair with bot-login filtering ("[bot]" suffix) when
      auditing whether CodeRabbit reviews are being surfaced.

  - id: CI-053
    domain: ci
    severity: important
    override_eligible: false
    description: >-
      Mutation testing workflow (.github/workflows/mutation-testing.yml)
      must not trigger on pull_request or push events. Mutation testing
      is wall-clock expensive (60-minute typical timeout per run) and
      blocks PR throughput when wired as a PR check. It must run on a
      weekly schedule plus manual workflow_dispatch only. Weekly drift
      detection adequately covers the regression-spotting need; per-PR
      runs add cost without proportional signal. The canonical
      cookiecutter template uses cron '0 2 * * 0' (Sundays 02:00 UTC).
    verify: >-
      Read .github/workflows/mutation-testing.yml. PASS only when the
      on: block contains exactly `schedule:` (required) and optionally
      `workflow_dispatch:`, and no other trigger keys. Any other trigger
      key (pull_request, push, workflow_run, release, create, or any
      event not in {schedule, workflow_dispatch}) is a FAIL. A `schedule:`
      block must exist with a cron no more frequent than weekly
      (day-of-week field must be a single numeric value, not '*' or step
      syntax). FAIL on cron expressions with '*' day-of-week (daily or
      more frequent). Also FAIL when `fail-under-threshold:` evaluates to
      true on any non-schedule event AND a non-schedule trigger exists,
      because the combination silently blocks PR merges.
    not_applicable_when: ".github/workflows/mutation-testing.yml is absent (mutation testing not configured for this repo; mutation testing is suggested only for Python repos with 80%+ baseline coverage per OSSF Silver criterion 6.1 guidance)"
    source_frameworks:
      - manifest-internal
    notes: >-
      Fleet sweep 2026-05-19 found 9 of 16 local clones with a
      pull_request: trigger on mutation-testing.yml, and 3 additional
      repos with the `fail-under-threshold: ${{ github.event_name !=
      'schedule' }}` config that would silently fail any non-cron run
      if a PR trigger were ever re-added. Cookiecutter template
      (cookiecutter-python-template) is canonical and was verified
      clean; drift is per-repo, not template-sourced.

  - id: CI-054
    domain: ci
    severity: important
    override_eligible: true
    description: >-
      Codecov reports line coverage >= 80% and branch coverage >= 70% on the
      default branch (queried via Codecov v2 API).
    verify: >-
      codecov_coverage: line_min=80, branch_min=70, branch=default.
      Query https://app.codecov.io/api/v2/github/{owner}/repos/{repo}/ for
      totals.coverage (line %) and compute branch % as
      totals.branches_covered / totals.branches * 100 (when totals.branches
      > 0; if totals.branches is 0 or null, treat branch coverage as not
      measured and skip branch gate).
      PASS if line >= 80 and branch >= 70 (or branch coverage not measured).
      VISIBILITY GATE: if .codecov.yml or codecov.yaml is present but the
      repo is private (isPrivate=true in repo catalog) and the unauthenticated
      API probe returns 404 or empty totals, record PASS (visibility-gated)
      instead of a FINDING. Private Codecov projects require a token; the
      unauthenticated API cannot assess them.
      NO-DATA GATE: if totals is null or coverage is null (Codecov has never
      received a report for this repo), emit FINDING with message "No coverage
      data on Codecov -- ensure coverage.yml workflow uploads reports on the
      default branch."
    not_applicable_when: >-
      repo does not contain Python source files OR .codecov.yml and
      codecov.yaml are both absent (Codecov not configured for this repo).
    source_frameworks:
      - manifest-internal
    notes: >-
      Complements CI-009/CI-010/CI-011 (config-presence checks) by verifying
      the last actual run met the thresholds, not just that the config declares
      them. Branch coverage floor (70%) is set lower than line coverage (80%)
      because branch instrumentation is not always complete in integration-test
      suites. Standards source: CLAUDE.md "Testing" row (80% line, 70% branch).


  - id: CI-072
    domain: ci
    severity: important
    override_eligible: true
    description: >-
      Codecov patch coverage target is >= 90% in .codecov.yml (the AI-generated
      diff coverage gate declared in CLAUDE.md).
    verify: >-
      content_present: .codecov.yml OR codecov.yaml, patch: 90.
      Check that the patch: target field under any coverage flag or the
      default coverage block is set to 90 or above. A missing patch: key
      is a FINDING (target not declared).
      PASS if patch target >= 90 in any coverage block that governs PR diffs.
    not_applicable_when: >-
      repo does not contain Python source files OR .codecov.yml and
      codecov.yaml are both absent (Codecov not configured for this repo).
    source_frameworks:
      - manifest-internal
    notes: >-
      CLAUDE.md states "90% patch" as a coverage target alongside 80% line
      and 70% branch. CI-054 enforces the line/branch floors against actual
      Codecov data. CI-072 enforces the patch target declaration in the
      config file (analogous to CI-010 for the overall threshold). A
      separate runtime check against live Codecov patch data would complement
      this config-presence gate; add it as a separate follow-on check (claim
      the next free CI-* ID at implementation time) if Codecov API provides
      patch coverage per-PR.

  - id: CI-078
    domain: ci
    severity: suggested
    override_eligible: true
    description: >-
      .github/workflows/qlty.yml contains a qlty-gate job that calls
      python-qlty-gate.yml from the org reusable workflow library. The
      qlty check StatusContext posted by the qlty.sh GitHub App always
      reports SUCCESS regardless of blocking issue count and cannot block
      merges. A GitHub Actions CheckRun from this job is required for
      enforcement. Applies to all repos with .qlty/qlty.toml configured.
    verify: "content_present: .github/workflows/qlty.yml, python-qlty-gate.yml"
    not_applicable_when: >-
      Repo does not have .qlty/qlty.toml (mirrors TOOL-009 scope).
    source_frameworks:
      - manifest-internal
    notes: >-
      Promote severity from suggested to important once the qlty-gate job
      is confirmed present in all 21 qlty-configured repos. Gate rollout
      began 2026-06-02; the gate job is wired in 1 repo (.github) so far,
      with the remaining batch staged (4 repos have qlty coverage only, 2
      are not yet configured). The content_present verify on
      python-qlty-gate.yml is sufficient because only the gate reusable
      workflow uses that filename. The companion ruleset check (whether
      qlty-gate / Qlty Gate is in required_status_checks) is a future
      CI-079 once the gate name is confirmed from a live run (CI-073 through
      CI-077 are the renovate-health suite from PR #189).

  # 2026-06-04: License compliance coverage checks. Added CI-080 (SBOM
  # license-compliance job denylist includes LGPL and MPL, not GPL/AGPL only,
  # suggested) and CI-081 (dependency-review-action deny-licenses or
  # allow-licenses input present, suggested). Renumbered from the originally
  # proposed CI-078/CI-079, which collided with the qlty-gate check (CI-078)
  # and its reserved CI-079 ruleset companion from PR #188. Both start at
  # severity: suggested per the policy-execution-gap lesson: start a check at
  # suggested and promote to important only after the prerequisite sweep
  # reaches 100%. CI-080 promotion requires the CI-058 sweep at 100% (sbom.yml
  # callers on all 30 Python repos); CI-081 promotion requires CI-036 confirmed
  # on all applicable public repos. Current fleet posture:
  # fail-on-forbidden-licenses=false with a GPL/AGPL-only denylist. 10
  # non-permissive packages confirmed in the claude-config venv: 8 MPL-2.0, 2
  # LGPL; none create obligations for an MIT importer but none are caught by
  # the current denylist. FOSSA SaaS was evaluated and deferred (see
  # docs/reference/fossa-ci-evaluation.md): the in-house gate repair closes the
  # same gap at zero cost and zero new egress.

  - id: CI-080
    domain: ci
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Repo does not contain Python source files (no pyproject.toml with a
      [project] table), OR sbom.yml is absent from .github/workflows/ (CI-058
      prerequisite unmet: sbom.yml caller must exist before a license denylist
      can be evaluated), OR repositoryType is config, docs-only, or
      infrastructure.
    description: >-
      The sbom.yml caller's with: block must pass a forbidden-licenses JSON
      array to the python-sbom.yml reusable workflow that includes LGPL and
      MPL entries in addition to the default GPL/AGPL set. The reusable
      workflow default lists only GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only,
      GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later. LGPL-2.0-only,
      LGPL-2.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only,
      LGPL-3.0-or-later, and MPL-2.0 are absent, so the 10 non-permissive
      packages confirmed in the claude-config venv (certifi, fqdn, hypothesis,
      pathspec, pytest-html, pytest-metadata, pytest-rerunfailures, tqdm:
      MPL-2.0; psycopg2-binary, python-gitlab: LGPL) are never flagged.
      Secondary gap: the matching logic reads only the SPDX id field; free-text
      name values like 'MPL 2.0' and 'LGPL with exceptions' slip through even
      when those licenses are in the denylist. This check gates the denylist
      content; the matching-logic gap is fixed in the reusable workflow
      separately.
    verify: |
      Read .github/workflows/sbom.yml (or whichever file calls
      uses: ByronWilliamsCPA/.github/.github/workflows/python-sbom.yml).
      Locate the with: block.
      Step 1, denylist content:
        Parse the forbidden-licenses value as JSON.
        FAIL if the array does not include ALL of:
          LGPL-2.0-only, LGPL-2.0-or-later, LGPL-2.1-only,
          LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, MPL-2.0.
        PASS if all seven are present (GPL/AGPL entries may also be present).
        If forbidden-licenses is absent: the reusable workflow uses its default
        (GPL/AGPL only); FAIL because LGPL/MPL are missing from the default.
      Step 2, fail mode (advisory):
        Check fail-on-forbidden-licenses. WARN (do not FAIL) if false or
        absent: the check runs advisory only. This is the expected Wave 1
        state. Promote to FAIL after Wave 3 (allowlist mechanism confirmed and
        fail-on-forbidden-licenses: true deployed).
    source_frameworks:
      - manifest-internal
      - REUSE Specification 3.3 (license obligation disclosure)
      - OpenSSF Scorecard License (license field present)
    notes: >-
      Added 2026-06-04 at severity: suggested. Renumbered from the originally
      proposed CI-078, which PR #188 took for the qlty-gate check. Promotion to
      important after the CI-058 sweep confirms 100% of 30 Python repos have
      sbom.yml callers. Wave 3 (fail-on-forbidden-licenses: true) requires a
      per-package allowlist to avoid false-positive CI breakage from certifi
      (MPL-2.0, transitive via requests in virtually every Python project). Do
      not promote CI-080 before CI-058 reach is 100%; the not_applicable_when
      gate keeps repos without sbom.yml out of scope until their callers land.
      The seven-entry LGPL/MPL required set matches the reference repair in
      ByronWilliamsCPA/.github (the LGPL-2.1 variants cover semgrep, the one
      concrete LGPL-2.1 package observed in the fleet).

  - id: CI-081
    domain: ci
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Repo is private (actions/dependency-review-action license endpoint
      requires GitHub Advanced Security or a public repo), OR
      dependency-review.yml is absent from .github/workflows/ (CI-036
      prerequisite unmet), OR repositoryType is config, docs-only, or
      infrastructure.
    description: >-
      The dependency-review.yml caller must include a deny-licenses or
      allow-licenses input in its with: block. The actions/dependency-review-
      action supports both natively (v4+). Omitting both means the action only
      gates on vulnerability severity and applies no license policy to
      PR-introduced packages, so a PR adding a GPL-3.0 or LGPL-3.0 library
      passes silently until the post-merge SBOM scan runs. deny-licenses
      provides an early PR-time signal complementing CI-080's full-lockfile
      post-merge gate. deny-licenses operates only on PR-diff packages; CI-080
      covers the full lockfile via the SBOM. Both are needed: CI-081 catches
      new introductions early; CI-080 catches pre-existing packages that
      predate CI-081 enforcement. Note: the deny-licenses input is deprecated
      by actions/dependency-review-action (issue 997) and may be removed in a
      future major release; allow-licenses also satisfies this check and is the
      forward-compatible alternative.
    verify: |
      Read .github/workflows/dependency-review.yml.
      Locate the step using actions/dependency-review-action and its with:
      block.
      FAIL if neither deny-licenses nor allow-licenses is present.
      PASS if at least one is present.
      Advisory: if deny-licenses is present, warn if it omits GPL-3.0-only,
      GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later. Content review is
      manual; this check enforces presence of the key, not its exact value.
    source_frameworks:
      - manifest-internal
      - GitHub dependency-review-action documentation (deny-licenses input)
      - OWASP Top 10 CI/CD A08 Ungoverned Usage of Third-Party Services
    notes: >-
      Added 2026-06-04 at severity: suggested. Renumbered from the originally
      proposed CI-079, which is reserved by the CI-078 qlty-gate ruleset
      companion check from PR #188. Promotion to important after CI-036
      (dependency-review.yml presence) is confirmed at 100% across applicable
      public repos and at least one reference implementation of deny-licenses
      or allow-licenses is deployed (recommended deny starting set:
      GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
      AGPL-3.0-only, AGPL-3.0-or-later, matching the SBOM denylist). The two
      lists are separate and must be kept in sync. Reference implementation
      target: .github/workflows/dependency-review.yml under the
      actions/dependency-review-action with: block.

  # ── workflow-library type checks (Obs 45) ──────────────────────────────────
  # The .github repo is the only repo that is simultaneously a community-health
  # file store AND a reusable workflow library. There is no formal type_profiles
  # registry block in this manifest; repository scope is expressed per-check via
  # applies_to_types and not_applicable_when against the catalog repositoryType
  # field. CI-082..085 below are the workflow-library scope: they apply only when
  # repositoryType is workflow-library and own the workflow-quality surface
  # (script injection, over-scoped permissions, relative uses: paths, template
  # drift) that previously surfaced as unclassified candidates on every audit of
  # .github. To activate them, set the .github catalog entry repositoryType to
  # workflow-library. The originally proposed IDs CI-028..031 were already in use;
  # renumbered to CI-082..085. Dispatch target: devops-deployment-agent (a
  # dedicated workflow-quality-auditor agent is a future option, not yet created).

  - id: CI-082
    domain: ci
    check_family: workflow-library
    severity: suggested
    override_eligible: true
    description: >-
      Reusable and callable workflows in a workflow-library repo do not pass
      untrusted ${{ github.event.* }} values (PR title, body, branch ref,
      author) directly into a run: shell block. Script injection through
      workflow inputs lets an attacker execute arbitrary commands in the
      privileged context of any consumer that calls the workflow.
    verify: >-
      Grep .github/workflows/*.yml for run: blocks that interpolate
      github.event.pull_request.title, github.event.pull_request.body,
      github.event.issue.title, github.head_ref, or
      github.event.*.author.* directly. PASS when such values are routed
      through an env: variable and referenced as "$VAR" inside the run block;
      FAIL on direct ${{ ... }} interpolation into shell.
    not_applicable_when: "repositoryType != 'workflow-library'"
    source_frameworks:
      - GitHub Security Hardening (untrusted input / script injection)
      - OWASP Top 10 CI/CD A04 Poisoned Pipeline Execution

  - id: CI-083
    domain: ci
    check_family: workflow-library
    severity: suggested
    override_eligible: true
    description: >-
      Workflows in a workflow-library repo declare least-privilege
      permissions. A top-level permissions: block is present and no job
      grants permissions: write-all or contents: write without a documented
      need. Over-scoped tokens in a shared library propagate the excess
      privilege to every consumer.
    verify: >-
      Read each .github/workflows/*.yml. FAIL if any workflow omits a
      top-level permissions: block, or if any job declares write-all, or
      grants a write scope (contents, packages, id-token, actions) that the
      job body does not use. PASS when permissions are explicit and minimal.
    not_applicable_when: "repositoryType != 'workflow-library'"
    source_frameworks:
      - OpenSSF Scorecard Token-Permissions
      - GitHub Security Hardening

  - id: CI-084
    domain: ci
    check_family: workflow-library
    severity: suggested
    override_eligible: true
    description: >-
      Callable workflows in a workflow-library repo do not reference local
      actions or scripts by repo-relative path (uses: ./... or
      ${{ github.workspace }} script paths). Relative references resolve
      against the CALLER checkout, not the library, so they break silently
      for every consumer that does not happen to vendor the same path.
    verify: >-
      Grep .github/workflows/*.yml for uses: ./ entries and for run: steps
      that invoke scripts by a path assumed to exist in the caller tree.
      FAIL on relative uses: in a reusable (on.workflow_call) workflow; PASS
      when local actions are referenced as owner/repo/path@ref.
    not_applicable_when: "repositoryType != 'workflow-library'"
    source_frameworks:
      - GitHub reusable-workflow documentation (path resolution)
      - manifest-internal

  - id: CI-085
    domain: ci
    check_family: workflow-library
    severity: suggested
    override_eligible: true
    description: >-
      Org community-health and workflow templates in a workflow-library repo
      have not drifted from the canonical source set. Template drift means a
      consumer pulling the org default receives a stale or inconsistent file.
    verify: >-
      Compare the .github repo template set (workflow-templates/,
      profile/, and root community-health files) against the documented
      canonical inventory. FAIL when a template present in the inventory is
      missing, or when a tracked template diverges from its source_template
      reference without a recorded override. Content review is advisory; the
      check enforces presence and basic structural parity.
    not_applicable_when: "repositoryType != 'workflow-library'"
    source_frameworks:
      - manifest-internal

  # ── CI cost-tier check (Obs 258) ───────────────────────────────────────────
  # Mirrors the existing ruleset tiers (package / infra / docs). There is no
  # formal ci_tiers registry block in this manifest yet; the tier is inferred
  # from the catalog repositoryType. The intent: an infrastructure repo (IaC
  # with a thin Python CLI, e.g. homelab-infra) should run security and
  # compliance gates per-PR but push heavy scans (OS compatibility matrices,
  # SBOM-on-PR, FIPS, mutation testing) to scheduled runs. A per-PR workflow
  # that is neither a required status check nor consumed by a human or release
  # process is pure cost. See feedback note: homelab-infra carried the full
  # python-package CI profile (31 workflows, ~12.1k quota-weighted minutes in
  # May 2026) while its ruleset required only 3 status checks.

  - id: CI-086
    domain: ci
    check_family: ci-cost-tier
    severity: suggested
    override_eligible: true
    description: >-
      A repo's per-PR workflow set does not exceed its CI cost tier. For
      infrastructure-tier repos (repositoryType infrastructure), heavy scans
      (OS-compatibility matrices, SBOM-on-PR, FIPS, mutation testing, PyPI
      publish) must run on a schedule or release trigger, not on every
      pull_request. Only security/compliance gates and the required status
      checks should run per-PR.
    verify: >-
      Determine the repo CI tier from repositoryType (package vs
      infrastructure vs docs-only). Enumerate workflows triggered by
      pull_request in .github/workflows/. FAIL when a pull_request-triggered
      workflow is a heavy scan (compat matrix, sbom, fips, mutation, release/
      publish) that is not in this manifest's required_checks for the repo
      tier. Cross-check against the effective required-status-checks set
      (see CI-023). A per-PR workflow that is not required and not consumed
      by a human or release process is reported as removable cost.
    not_applicable_when: >-
      repositoryType is package (full python-package CI profile is expected),
      OR repositoryType is docs-only and only docs workflows run per-PR.
    source_frameworks:
      - manifest-internal
      - DORA (CI efficiency / lead-time cost)
    notes: >-
      Added 2026-06-17 at severity: suggested per feedback_policy_execution_gap.md
      (define before reach). Promote to important once the infra-tier workflow
      split is implemented on at least one reference repo (homelab-infra) and a
      tier mapping is recorded. A formal ci_tiers block (mirroring the
      package/infra/docs ruleset tiers) is the natural successor if a second
      tier-scoped check is added.

  - id: CI-055
    domain: ci
    severity: important
    override_eligible: true
    description: >-
      docs/org-workflow-pins.yaml current_sha matches the latest tag SHA
      on GitHub for each source repo. Findings older than 24 hours from
      the tag creation date are reported; within 24 hours the daily sync
      job may simply not have run yet.
    verify: "registry_current: docs/org-workflow-pins.yaml, source=github_tags, max_lag_hours=24"
    source_frameworks:
      - manifest-internal

  - id: CI-056
    domain: ci
    severity: important
    override_eligible: true
    description: >-
      All uses: references to org workflow source repos in
      .github/workflows/*.yml match the current_sha in
      docs/org-workflow-pins.yaml. Fires on any consumer repo where a
      uses: ByronWilliamsCPA/.github/...@<sha> or
      uses: williaby/.github/...@<sha> does not match the registry value.
    verify: "uses_sha_matches_registry: .github/workflows/*.yml, docs/org-workflow-pins.yaml"
    source_frameworks:
      - manifest-internal

  - id: CI-057
    domain: ci
    severity: important
    override_eligible: true
    not_applicable_when: >-
      Repo does not use org reusable workflows (no
      ByronWilliamsCPA/.github or williaby/.github reference in
      .github/workflows/*.yml). Skip silently when not applicable.
    description: >-
      renovate.json contains a packageRules entry targeting org workflow
      source repos (github-actions manager, semver versioning) and does
      NOT set followTag. Every push to the source repo's main cuts an
      immutable vX.Y.Z tag (release-tag.yml) and the org tag-protection
      ruleset forbids re-pointing v* tags, so no floating major tag
      exists; a followed tag can never advance and silently freezes all
      SHA-pin updates. This check originally mandated followTag: "v1";
      the requirement is inverted as part of retiring the frozen v1 tag
      (ByronWilliamsCPA/.github PR #244, opened 2026-07-02; the v1 tag
      itself is already deleted on both orgs).
    verify: >-
      content_present: renovate.json, ByronWilliamsCPA/.github (williaby/*
      repos: williaby/.github).
      content_present: renovate.json, github-actions.
      content_present: renovate.json, "versioning": "semver".
      content_absent: renovate.json, "followTag": (quoted JSON key form
      only; prose mentions of followTag in rule descriptions must not
      match).
    source_frameworks:
      - manifest-internal

  - id: CI-058
    domain: ci
    check_family: renovate-health
    severity: important
    override_eligible: true
    not_applicable_when: >-
      Repo is not a Python project (no [project] table in pyproject.toml).
    description: >-
      python-sbom.yml reusable workflow is called from .github/workflows/ via
      uses: ByronWilliamsCPA/.github/.github/workflows/python-sbom.yml@<SHA>
      with a SHA-pinned ref (not @main, not a tag). Closes the gap (canonical
      missing-caller list and @main-pin list maintained in
      docs/audits/dependency-management-improvement-plan-2026-05-24.md S-9)
      where Python repos in the fleet ship with no SBOM gate at all, and others
      pin the workflow to floating @main (same risk class as the
      tj-actions/changed-files CVE-2025-30066 attack).
    verify: >-
      Search .github/workflows/*.yml for uses: ByronWilliamsCPA/.github/.github/
      workflows/python-sbom.yml@<ref>. The ref must be a 40-char SHA, not @main and
      not @vN tag form.
    source_frameworks:
      - manifest-internal
    notes: >-
      Added 2026-05-25 as severity: suggested. Promoted to important 2026-06-02
      per manifest-elevation-proposal.md: the SHA-pin half overlaps CI-005's
      critical SHA-pin mandate (CVE-2025-30066 class), so important does not
      outrun enforcement. override_eligible carries the dated deferral for the 4
      missing-caller repos until callers are onboarded. Cross-reference:
      docs/audits/dependency-management-improvement-plan-2026-05-24.md S-9,
      feedback_policy_execution_gap.md.

  - id: CI-059
    domain: ci
    check_family: renovate-health
    severity: important
    override_eligible: true
    not_applicable_when: "renovate.json does not exist at repo root"
    description: >-
      renovate.json effective enabledManagers (after org template inheritance) includes
      every manager required by the detected ecosystem files in the repo. Concretely:
      if pyproject.toml has [project] then pep621 must be present; if .github/workflows/
      exists then github-actions must be present; if Dockerfile exists then dockerfile;
      if docker-compose*.yml then docker-compose; if package.json then npm; if *.tf then
      terraform. Catches the silent-failure class where Renovate is enabled but produces
      zero PRs because the manager for the actual ecosystem is missing (e.g., "poetry"
      declared for a uv-managed project, replace-not-merge semantics dropping pep621
      from per-repo override).
    verify: >-
      Read repo file inventory; read effective enabledManagers from renovate.json
      combined with the appropriate org template for the repo's owner
      (ByronWilliamsCPA/.github/renovate.json for ByronWilliamsCPA/* repos;
      williaby/.github/renovate.json for williaby/* repos). Renovate replaces,
      does not merge arrays; verify on the per-repo list, not the union. For
      each detected ecosystem file pattern, confirm the corresponding manager
      is in the effective list.
    source_frameworks:
      - manifest-internal
    notes: >-
      Added 2026-05-25 as severity: suggested. Promoted to important 2026-06-02
      per manifest-elevation-proposal.md: 9 of 24 repos misconfigured holding
      570 of 786 alerts (73%) is the single largest remediation lever in the
      fleet, and important is report-and-escalate (not auto-blocking), so the
      finding can drive remediation now without the lint script. Held below
      critical until (a) the 9-repo enabledManagers sweep lands and (b) the lint
      script is deployed, so the fleet is not gated with 9 known failures. This
      is the structural successor to the v42-era PC-015
      schema-validation check (now retired post-v43 cutover); CI-059 catches a
      strictly larger class of misconfiguration (semantic coverage gaps that PC-015
      never caught even in principle). Likely accounts for most of the 47%
      BLOCKED_BY_CONFIG finding in docs/audits/dependabot-renovate-coverage-2026-05-24.md.
      Cross-reference: dependency-management-improvement-plan-2026-05-24.md S-3,
      feedback_policy_execution_gap.md.

  - id: CI-060
    domain: ci
    check_family: renovate-health
    severity: important
    override_eligible: true
    not_applicable_when: ".github/workflows/ directory does not exist"
    description: >-
      All third-party GitHub Action references in .github/workflows/*.yml use a full
      40-character commit SHA pin (e.g., uses: actions/checkout@
      8edcb1bdb4e267140fa742c62e395cd74f332709 # v4.3.0), not a tag (@v4, @v4.3.0)
      or branch (@main) pin. Pinning to tags or branches exposes the workflow to
      retroactive pointer manipulation, the attack vector used in CVE-2025-30066
      (tj-actions/changed-files compromise, March 2025, affected 23,000+ repos).
      First-party org workflow refs (ByronWilliamsCPA/.github, williaby/.github)
      are governed by CI-056 and excluded from this check.
    verify: >-
      Grep .github/workflows/*.yml for `uses: ` references. For each reference
      whose owner is not ByronWilliamsCPA or williaby, the ref after @ must be a
      40-character hex SHA. Tag refs (@v\d+) and branch refs (@main, @master) fail.
      Allow trailing comment with the human-readable tag for readability.
    source_frameworks:
      - manifest-internal
    notes: >-
      Added 2026-05-25 as severity: suggested. Promoted to important 2026-06-02
      per manifest-elevation-proposal.md: CI-005 already enforces the same
      SHA-pinning at critical for first-class workflows, so the sweep
      precondition is effectively met by CI-005's existing coverage and the
      fleet largely passes already; important aligns the two checks and removes
      the "optional" signal. Renovate's pinDigests: true packageRule automates
      ongoing maintenance; deploy that rule to the org template alongside this
      check. Cross-reference:
      dependency-management-improvement-plan-2026-05-24.md S-4.

  - id: CI-061
    domain: ci
    check_family: renovate-health
    severity: critical
    override_eligible: false
    not_applicable_when: >-
      Audit target is not the homelab-infra repo. This check only applies to
      homelab-infra/services/renovate/docker-compose.yml.
    description: >-
      The Renovate self-hosted Docker image in homelab-infra is pinned to a
      cryptographic digest (sha256:...), not a floating tag. Tag-only pins leave a
      silent-upgrade vector: every systemd timer fire (or docker compose pull) can
      fetch a different image if upstream re-pushes the tag, with no audit trail of
      what changed. Digest pinning closes this and gives an immutable reference
      reviewable in PR diffs. The v43 cutover (homelab-infra PR #425) established
      the tag@sha256:digest format; this check ensures the pattern stays in place.
      A paired packageRule in config/config.json with pinDigests: true,
      minimumReleaseAge: 14 days, and automerge: false handles ongoing digest bumps
      via reviewable PRs.
    verify: >-
      Grep services/renovate/docker-compose.yml for the renovate service's image:
      line. The reference MUST match the regex
      ^renovate/renovate:[\w.-]+@sha256:[a-f0-9]{64}$ (image name fixed to
      renovate/renovate; tag AND 64-hex digest both present). A bare tag
      (e.g., renovate/renovate:43.150.0), a bare digest, or any non-renovate
      image name fails. This is the canonical form
      renovate/renovate:<tag>@sha256:<64-hex-digest>.
    source_frameworks:
      - manifest-internal
    notes: >-
      Added 2026-05-25 as severity: critical. The silent-upgrade vector this check
      prevents is directly observable: a re-pushed floating tag would pull a
      different image on the next timer fire with no PR or notification. The check
      is enforceable from day one (the digest pin landed in homelab-infra PR #425),
      so unlike CI-058/059/060 which start at suggested until rollout completes,
      CI-061 is critical from initial introduction. Cross-reference:
      docs/audits/dependency-management-improvement-plan-2026-05-24.md S-1.

  - id: CI-062
    domain: ci
    check_family: renovate-health
    severity: important
    description: >-
      Repos that accept auto-merging dependency updates (Renovate or Dependabot
      with auto-merge enabled, or any RENOVATE_AUTOMERGE=true config) should
      enable merge_queue on the main branch ruleset to batch compatible changes.
      Without the queue, N sequential auto-merges trigger N(N+1)/2 CI runs from
      cascading rebases: each merge moves main forward and forces every other
      queued PR into BEHIND state, requiring another rebase plus full CI run.
      The cost incident in ByronWilliamsCPA/.github#154 (homelab-infra, 2026-05-24)
      consumed roughly 30 min of paid Actions minutes to land 5 trivial Renovate
      PRs. Queue-batched, the same workload would have required 1 to 2 CI runs.
    verify: |
      1. Check repo for auto-merge signals:
         - renovate.json at repo root contains "automerge": true (BWCPA org
           standard per CI-020; .renovaterc.json or .github/renovate.json
           accepted as non-standard fallback locations)
         - RENOVATE_AUTOMERGE org or repo secret set to true
         - .github/dependabot.yml present with an auto-approve workflow
      2. If no signal present: skip (treat as N/A per not_applicable_when).
      3. If signal present: query the GitHub Rulesets API and confirm a
         merge_queue rule exists on the main-branch ruleset specifically.
         The filter must pin the ruleset to main (either by the literal
         refs/heads/main include or the ~DEFAULT_BRANCH alias); a queue
         rule on a non-main ruleset does not satisfy this check:
         gh api repos/<org>/<repo>/rulesets --jq '.[] |
           select(.target=="branch") |
           select(.conditions.ref_name.include[]? == "refs/heads/main"
                  or .conditions.ref_name.include[]? == "~DEFAULT_BRANCH") |
           {name, rules: [.rules[] | select(.type=="merge_queue")]}'
         PASS if at least one merge_queue rule exists on the main-branch
         ruleset; FAIL otherwise.
    override_eligible: true
    not_applicable_when: "repo does not auto-merge any PRs"
    source_frameworks:
      - manifest-internal
    notes: >-
      Added 2026-05-25 as severity: important based on the cost incident in
      ByronWilliamsCPA/.github#154. The incident is real, measurable, and
      recurring: GitHub-hosted runner minutes are paid, Renovate batches arrive
      weekly, and the N(N+1)/2 cascade compounds with fleet size. Companion to
      CI-040, which covers the trigger side. Both are required for the queue to
      function: CI-040 ensures gates emit on merge_group, CI-062 ensures the
      ruleset enables the queue. Recommended ruleset settings:
      merge_method=SQUASH, max_entries_to_build=5, min_entries_to_merge=1,
      min_entries_to_merge_wait_minutes=5 (the wait prevents single-PR overhead
      while still batching when activity is steady).

  - id: CI-063
    domain: ci
    check_family: renovate-health
    severity: suggested
    override_eligible: true
    not_applicable_when: "renovate.json does not exist at repo root"
    description: >-
      Per-repo renovate.json is a thin overlay containing only repo-specific
      rules, not duplicates of the global config or org template. Specifically,
      a per-repo renovate.json MUST NOT redeclare packageRules or groupName
      entries that already exist in the global config at
      homelab-infra/services/renovate/config/config.json or the org template at
      ByronWilliamsCPA/.github/renovate.json or williaby/.github/renovate.json.
      Renovate config layers use replace semantics on arrays, not merge, so a
      redundant per-repo packageRules array silently shadows the global rules.
      If the global config later changes (e.g., adds a new CVE auto-merge rule),
      the per-repo override will continue applying the stale rule set with no
      visible diff in the per-repo config file.
    verify: >-
      Read the repo's renovate.json. For each top-level array key
      (packageRules, groupName, ignoreDeps, postUpdateOptions, prHourlyLimit,
      schedule), check whether the same key is set in the applicable global
      config or org template. PASS if the per-repo value is genuinely different
      from the global value (a legitimate override). FAIL if the per-repo value
      is identical to or a subset of the global value (redundant shadow).
    source_frameworks:
      - manifest-internal
    notes: >-
      Added 2026-05-26 as severity: suggested. Diagnostic, not blocking;
      redundant overlays are harmless until the global config changes. The
      2026-05-26 audit (KL-004) identified this as a latent drift risk worth
      catching before the global config evolves further.

  - id: CI-064
    domain: ci
    check_family: renovate-health
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Audit target is not the homelab-infra repo. This check only applies to
      homelab-infra/services/renovate/config/config.json.
    description: >-
      The Renovate global config explicitly sets platformAutomerge: true rather
      than relying on the v40+ default. Defensive against a future Renovate
      version flipping the default again. The 2026-05-26 audit found that the
      v42 to v43 cutover silently changed the platformAutomerge default behavior;
      had the global config been explicit, the cutover would have produced
      identical behavior regardless of the upstream default.
    verify: >-
      Read homelab-infra/services/renovate/config/config.json. PASS only when
      the top-level platformAutomerge key is present and set to true. A missing
      key (relying on Renovate's default) is a FAIL.
    source_frameworks:
      - manifest-internal
    notes: >-
      Added 2026-05-26 as severity: suggested. Defensive check; the current
      behavior is correct (v43 default is true), but explicitness in the global
      config removes a future failure mode where an upstream default flip would
      silently change fleet-wide auto-merge behavior with no audit signal.
      Originally introduced as CI-062 in PR #154; renumbered to CI-064 when
      the merge queue rollout PR (ByronWilliamsCPA/.github#154) landed CI-062
      on main first with a different semantic.

  - id: CI-073
    domain: ci
    check_family: renovate-health
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Repo has no uv.lock at repo root (uv migration not performed), or repo is
      documentation/config only (no Python source).
    description: >-
      A uv-migrated Python repo (uv.lock present at root) must not retain orphan
      legacy dependency manifests (requirements*.txt, requirements/ directory,
      poetry.lock, Pipfile, Pipfile.lock, setup.py with install_requires) unless
      that manifest is a verified synced export of uv.lock. Orphan manifests are
      a dual-source-of-truth hazard: Dependabot and Renovate alert on and try to
      patch a stale second manifest that no longer reflects the installed
      dependency set. image-preprocessing-detector carries 8 redundant
      requirements*.txt files holding 289 of its 389 open alerts; those alerts
      live in manifests the project no longer installs from.
    verify: |
      1. Confirm uv.lock exists at repo root. If absent: skip (not_applicable_when).
      2. Enumerate legacy manifests at any depth: requirements*.txt, any file under
         a requirements/ directory, poetry.lock, Pipfile, Pipfile.lock, and setup.py
         declaring install_requires.
         git ls-files | grep -E '(^|/)(requirements.*\.txt|requirements/.*|poetry\.lock|Pipfile(\.lock)?|setup\.py)$'
         For any matched setup.py, confirm it contains an install_requires=
         assignment (grep -q 'install_requires' setup.py); a setup.py without
         install_requires is not a dependency source and is not flagged.
      3. For each found:
         PASS for that file if it carries a header comment marking it a generated
              export (e.g., "# generated by uv export" / "# DO NOT EDIT") AND a CI
              step or pre-commit hook regenerates it from uv.lock.
         FAIL (WARN) for that file otherwise: orphan legacy manifest.
      4. PASS if no legacy manifests found, or all found are verified exports.
    source_frameworks:
      - manifest-internal
      - OWASP Top 10 CI/CD A08 Ungoverned Usage of Third-Party Services
    notes: >-
      Added 2026-06-02 at severity: suggested per feedback_policy_execution_gap.md;
      promote to important after the orphan-manifest cleanup sweep lands (priority:
      image-preprocessing-detector first, 289 alerts). Companion to CI-059: CI-059
      catches Renovate being told to ignore a real manifest; CI-073 catches a real
      manifest that should no longer exist. Both surfaced as the dual-manifest
      failure mode in docs/reference/dependency-tooling-comparison.md (Cluster C,
      "Remove orphan legacy manifests", Recommendation step 4).

  - id: CI-074
    domain: ci
    check_family: renovate-health
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Repo is archived, has no dependency manifest, or is a Renovate-ignored
      backstop repo with a PR-opening dependabot.yml.
    description: >-
      GitHub Dependabot alerts (vulnerability detection, not version PRs) must
      remain enabled on every live repo with a dependency manifest. Alerts are the
      multi-ecosystem detection ledger Renovate's vulnerabilityAlerts engine reads,
      and a backstop for ecosystems the Python SBOM gate does not scan. Alerts open
      no PRs. Forward-looking regression guard: as of 2026-06-02 every live repo
      already has alerts on, so this protects against future disablement.
    verify: |
      Run: gh api repos/<org>/<repo>/vulnerability-alerts -i
      PASS on HTTP 204 (alerts enabled); FAIL on HTTP 404 (alerts disabled).
      Skip archived repos, repos with no dependency manifest, and Renovate-ignored
      backstop repos that intentionally keep a PR-opening dependabot.yml
      (dart-frog-paludarium, homelab-agent-configs).
    source_frameworks:
      - manifest-internal
      - OpenSSF Scorecard Vulnerabilities
    notes: >-
      Added 2026-06-02 at suggested; reach already ~100%, so a guard not a lever.
      Earlier draft cited cookiecutter-template-sample as disabled; that is a 404
      local-only orphan and the example was removed. Remediation:
      gh api -X PUT repos/<org>/<repo>/vulnerability-alerts.

  - id: CI-075
    domain: ci
    check_family: renovate-health
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Audit target is not homelab-infra AND the target repo's renovate.json does
      not redeclare lockFileMaintenance. The global config at
      homelab-infra/services/renovate/config/config.json is authoritative for
      lockFileMaintenance; a repo is only in scope when it is homelab-infra itself
      or when its own renovate.json overrides lockFileMaintenance (that override is
      then the effective config evaluated below).
    description: >-
      The Renovate configuration must enable lockFileMaintenance AND automerge it
      on green CI. For Python (uv/poetry), lockFileMaintenance is the ONLY
      mechanism that remediates transitive vulnerabilities: transitiveRemediation
      is npm-only (overrides) and Yarn-only (resolutions); Renovate's Python
      managers see only direct dependencies in pyproject.toml, never locked
      transitives. 75% of the fleet's vulnerable packages are transitive, so a
      lockFileMaintenance rule that generates PRs but never merges (automerge:
      false) leaves the majority of the vulnerability surface permanently
      unpatched: the PRs generate weekly and sit. The global config currently has
      lockFileMaintenance.enabled: true with automerge: false, which is the
      observed failure mode.
    verify: |
      Read homelab-infra/services/renovate/config/config.json (and any per-repo
      renovate.json that redeclares lockFileMaintenance).
      Resolve the effective config: Renovate uses replace-not-merge semantics for
      config arrays, so when a per-repo renovate.json declares lockFileMaintenance
      it fully replaces the global block; evaluate the per-repo block alone in that
      case, otherwise evaluate the global config.json block.
      PASS only when BOTH hold in the effective config:
        - lockFileMaintenance.enabled is true, AND
        - a rule applies automerge: true to lockFileMaintenance updates, via
          either lockFileMaintenance.automerge: true OR a packageRules entry with
          matchUpdateTypes: ["lockFileMaintenance"] and automerge: true
          (platformAutomerge: true strongly recommended for atomic GitHub merge).
      FAIL if lockFileMaintenance is disabled, or enabled with automerge false
      or unset (generates-but-never-merges).
    source_frameworks:
      - manifest-internal
      - OpenSSF Scorecard Vulnerabilities
      - NIST SSDF RV.1.1
    notes: >-
      Added 2026-06-02 at severity: suggested per feedback_policy_execution_gap.md;
      promote to important after the global config sets lockFileMaintenance
      automerge: true and a fleet re-scan confirms transitive backlogs falling on
      the ready cohort (rag-processor, maester-tests, python-libs). The npm-only
      nature of transitiveRemediation is confirmed upstream
      (renovatebot/renovate discussion #28776). platformAutomerge requires at
      least one required status check in branch protection or GitHub may merge on
      a pending check; REPO-001 (allow_auto_merge) and CI-023 (required checks)
      are prerequisites. Cross-reference: dependency-tooling-comparison.md
      ("Correction: transitiveRemediation does not help Python";
      Recommendation step 6).

  - id: CI-076
    domain: ci
    check_family: renovate-health
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Audit target is not homelab-infra (global config authoritative); a per-repo
      renovate.json redeclaring the vulnerability rules is checked too.
    description: >-
      Renovate vulnerability-fix PRs must auto-merge to land: the effective config
      must apply automerge: true AND platformAutomerge: true to isVulnerabilityAlert
      updates. The fleet config expresses vulnerability handling as a base
      isVulnerabilityAlert rule plus a per-severity minimumReleaseAge ladder
      (LOW/UNKNOWN 7d, MEDIUM 2d, CRITICAL/HIGH 0d); that ladder is intentional and
      must be preserved.
    verify: |
      Resolve the effective config for an isVulnerabilityAlert update from
      homelab-infra/services/renovate/config/config.json (+ any per-repo override;
      a per-repo renovate.json that redeclares the vulnerability rules replaces the
      global block per Renovate's replace-not-merge array semantics). Apply
      precedence root setting < base isVulnerabilityAlert rule < per-severity tier,
      with the most specific matching rule winning for the evaluated update.
      PASS when automerge: true AND platformAutomerge: true effectively apply to
      vulnerability updates (base rule, inherited root setting, or each severity
      tier). Do NOT require minimumReleaseAge: null; the per-severity ladder is
      compliant. FAIL if no isVulnerabilityAlert handling exists or automerge/
      platformAutomerge is not effectively true.
    source_frameworks:
      - manifest-internal
      - OpenSSF Scorecard Vulnerabilities
    notes: >-
      Added 2026-06-02 at suggested; promote to important after the config wires
      platformAutomerge on the vuln rules and the gleif canary confirms vuln PRs
      auto-merging over one weekly cycle. Corrected 2026-06-02: earlier draft
      assumed a single rule and required minimumReleaseAge null, which would flatten
      the intentional 5-entry ladder at config.json lines 229-253. Prerequisites:
      REPO-001, a required status check, merge_queue (CI-062).

  - id: CI-077
    domain: ci
    check_family: renovate-health
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Repo is single-ecosystem Python (no package.json / package-lock.json and
      no Dockerfile / docker-compose*.yml). Pure Python repos are covered by the
      Python SBOM gate (CI-058) and need no additional ecosystem scanner.
    description: >-
      A polyglot repo (carries an npm lockfile and/or a Dockerfile in addition to
      Python) must have CI vulnerability scanning that covers those ecosystems,
      not the Python-only SBOM gate. The org python-sbom workflow scans only the
      Python surface; rag-processor is uv-migrated and Python-clean yet carries
      17 to 18 live npm vulnerabilities in frontend/package-lock.json that a
      Python-only scan reports as 0. A naive "osv-scanner on uv.lock" gate gives
      false comfort on exactly these repos. The fix: add the OSV-Scanner PR-diff
      reusable workflow for npm lockfiles and aquasecurity/trivy-action with
      scan-type: image for Dockerfile repos, both uploading SARIF to the Security
      tab.
    verify: |
      1. Detect extra ecosystems:
         npm: any package.json, package-lock.json, npm-shrinkwrap.json, or
              yarn.lock tracked.
         container: any Dockerfile, *.Dockerfile, or docker-compose*.yml tracked.
         If neither present: skip (not_applicable_when).
      2. If npm present: a workflow under .github/workflows/ must invoke
         google/osv-scanner (or osv-scanner-action / the OSV reusable workflow)
         in a way that scans the npm lockfile, OR Dependabot alerts must be
         enabled (gh api repos/<org>/<repo>/vulnerability-alerts returns HTTP 204)
         as the npm detection fallback.
      3. If container present: a workflow must invoke aquasecurity/trivy-action
         with scan-type: image (or equivalent grype/trivy image scan).
      4. WARN for each detected ecosystem with no corresponding scanner and no
         enabled-alerts fallback (HTTP 204 from the vulnerability-alerts endpoint).
    source_frameworks:
      - manifest-internal
      - OpenSSF Scorecard Vulnerabilities
      - NIST SSDF RV.1.1
    notes: >-
      Added 2026-06-02 at severity: suggested per feedback_policy_execution_gap.md;
      promote to important after at least one reference implementation of the
      npm OSV-diff and Trivy image scan lands in a fleet repo (rag-processor is
      the natural pilot: it has both ecosystems and a known 17-vuln npm gap).
      Until then, CI-074 (Dependabot alerts on) is the multi-ecosystem detection
      floor; CI-077 raises it to an in-CI gate. Affected repos (Dockerfile
      and/or npm): rag-processor, cookiecutter-python-template, audio-processor,
      llc-manager, image-preprocessing-detector. Cross-reference:
      dependency-tooling-comparison.md ("Multi-scanner validation on the ready
      cohort"; validated config change 5).

  - id: CI-065
    domain: ci
    severity: important
    override_eligible: false
    not_applicable_when: >-
      No workflow file whose name matches fuzz*.yml, *fuzzing*.yml, or
      *-fuzz.yml exists under .github/workflows/. When fuzz testing runs
      inline with pytest (Hypothesis @given in tests/fuzz/, no dedicated
      workflow), this check does not apply -- trigger scheduling is
      governed by the CI workflow (CI-001) instead.
    description: >-
      Any dedicated fuzz testing workflow (.github/workflows/fuzz*.yml,
      *-fuzzing.yml, or *-fuzz.yml) must not trigger on pull_request or
      push events. Coverage-guided fuzzing (atheris, libFuzzer) and
      large-scale property-based fuzzing runs have runtimes of 30-120
      minutes per corpus cycle. Wiring them as PR checks blocks merge
      throughput by the same mechanism as mutation testing (CI-053). Fuzz
      workflows must run on a weekly schedule plus manual workflow_dispatch
      only.
    verify: >-
      Enumerate .github/workflows/*.yml. For any workflow file whose name
      matches fuzz*.yml, *-fuzzing.yml, or *-fuzz.yml: read the on: block.
      PASS only when the on: block contains exactly `schedule:` (required)
      and optionally `workflow_dispatch:`, and no other trigger keys. FAIL
      on any pull_request, push, workflow_run, or release trigger. A
      schedule: block must exist with a cron no more frequent than weekly
      (the day-of-week field must not be '*' or a step expression). If
      multiple fuzz workflow files exist, every one must pass independently.
    source_frameworks:
      - manifest-internal
    notes: >-
      Added 2026-05-28. Companion to CI-053 (mutation testing trigger).
      Currently not applicable across the fleet -- the only repo with fuzz
      tests (llc-manager) runs them inline with pytest via Hypothesis @given,
      not a dedicated workflow. Check is forward-looking: prevents trigger
      drift if any repo later adds a dedicated fuzz workflow.

  - id: CI-066
    domain: ci
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Repo does not contain Python source files (no pyproject.toml with a
      [project] table), or has no test suite (no tests/ directory with
      Python files matching test_*.py or *_test.py), or Codecov reports
      line coverage below 80% for the default branch (per CI-054 -- mutation
      testing below 80% coverage produces high noise and low actionable
      signal), or repo is infrastructure, configuration, or documentation
      only (no src/ or app/ directory with substantive Python source).
    description: >-
      Python repos with an established test suite (80%+ line coverage)
      should have mutation-testing.yml configured. Mutation testing
      validates that tests detect real code changes rather than passing
      vacuously. A repo with a fully-passing test suite at 80%+ coverage
      but no mutation testing may have tests that never exercise the code
      paths they claim to cover. OSSF Silver criterion 6.1 cites mutation
      testing as one accepted form of code-quality dynamic analysis.
      This check flags the absence of the workflow; CI-053 governs correct
      trigger configuration once the workflow exists.
    verify: >-
      1. Confirm pyproject.toml exists with a [project] table. If absent,
         skip (not_applicable_when).
      2. Confirm tests/ contains at least one file matching test_*.py or
         *_test.py. If absent, skip.
      3. Consult CI-054 Codecov data: if line coverage is below 80% or
         unmeasured, skip (PASS silently -- pre-condition not met).
      4. Check whether .github/workflows/mutation-testing.yml exists.
         PASS if present (configuration correctness is CI-053's scope).
         WARN if absent: "Repo qualifies for mutation testing (Python +
         tests + 80%+ coverage) but mutation-testing.yml is missing."
    source_frameworks:
      - OpenSSF Silver Badge criterion 6.1
      - NIST SSDF PW.8.1
    notes: >-
      Added 2026-05-28. Current fleet state (2026-05-28): 12 repos have
      mutation-testing.yml across both orgs; 32 do not. The coverage gate
      (step 3) is the primary applicability filter -- run CI-054 data first
      to identify the qualifying subset before raising WARN findings for
      absent workflows. Repos without the workflow that appear to have
      Python source and tests include data_ingestor, gleif, monte_carlo,
      zen-mcp-server, and xero-practice-management, but coverage data is
      required to confirm they meet the 80% threshold.

  - id: CI-070
    domain: ci
    severity: suggested
    override_eligible: true
    description: >-
      No GitHub Actions workflow may interpolate attacker-controllable context
      values directly into a run: shell block. Direct interpolation
      (${{ github.event.*.title }}, ${{ github.head_ref }},
      ${{ github.event.*.body }}, ${{ github.event.*.name }},
      ${{ github.event.comment.body }}, ${{ github.event.discussion.body }},
      ${{ github.event.issue.title }}, ${{ github.event.issue.body }},
      ${{ github.event.pull_request.title }},
      ${{ github.event.pull_request.body }},
      ${{ github.event.pull_request.head.ref }},
      ${{ github.event.pull_request.head.label }},
      ${{ github.event.review.body }},
      ${{ github.event.review_comment.body }})
      substitutes raw attacker-supplied text before the shell parser sees it,
      enabling shell command injection. The safe pattern routes the value
      through an env: assignment and references it as a quoted shell variable.
      This is the canonical GitHub Actions script-injection vector
      (OWASP CI/CD-SEC-04, OpenSSF Scorecard Dangerous-Workflow). Doubly
      critical in AI-assisted workflows: injected text in a PR title or branch
      name can steer agent shell commands executing inside CI.
    verify: |
      For each .yml file under .github/workflows/:
        Extract all run: block contents (single-line and multi-line | blocks).
        Search extracted text for patterns matching:
          \$\{\{\s*github\.event\.(issue|pull_request|comment|discussion|review|review_comment)\.(title|body|name)\s*\}\}
          \$\{\{\s*github\.head_ref\s*\}\}
          \$\{\{\s*github\.base_ref\s*\}\}
          \$\{\{\s*github\.event\.pull_request\.head\.(ref|label)\s*\}\}
        FAIL if any match is found inside a run: block body.
        The following patterns are NOT a FAIL (safe, non-shell contexts):
          - The same expression appears in env: key assignments (not inside run:)
          - The same expression appears in with: key assignments
          - The same expression appears in if: conditions
          - github.event.pull_request.number in concurrency.group (integer)
        Run: grep -rn "\${{ github\.event\." .github/workflows/ | grep -v "env:" |
          grep -v "with:" | grep -v "if:" | grep -v "concurrency:"
        Any remaining hits require manual inspection to confirm they are not
        inside a run: block. FAIL if any are.
    source_frameworks:
      - OWASP Top 10 CI/CD-SEC-04 Poisoned Pipeline Execution
      - OpenSSF Scorecard Dangerous-Workflow
      - GitHub Security Hardening for GitHub Actions (script injection section)
      - NIST SSDF PW.4.1
    notes: >-
      Added 2026-05-28. CI-043 covers the pull_request_target + checkout
      pattern; this check covers the orthogonal direct-interpolation pattern.
      Both are required: a workflow on pull_request (not pull_request_target)
      that directly interpolates github.head_ref into run: is not caught by
      CI-043 but is caught by CI-070.
      Safe remediation for any flagged workflow: move the expression to an
      env: assignment and reference it as a quoted variable in the run: block.
      Example bad pattern:
        run: git checkout "${{ github.head_ref }}"
      Example safe pattern:
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git checkout "$HEAD_REF"
      Per the policy-execution-gap pattern (feedback_policy_execution_gap.md):
      introduced as severity: suggested with override_eligible: true for the
      initial rollout. Promotion target: critical + override_eligible: false
      after a fleet sweep confirms 100% clean across all 44 repos. Do not
      promote before the sweep; a repo with a pre-existing violation would
      immediately gate compliance with no remediation path documented.
      This repo (ByronWilliamsCPA/.claude) was confirmed clean on 2026-05-28:
      all github.event.* usage is in env: assignments, if: conditions, or
      concurrency.group (integer context only).
  - id: CI-067
    domain: ci
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Repo has no auto-merge signals: renovate.json does not contain
      "automerge": true, RENOVATE_AUTOMERGE env/secret is not set to true,
      and no dependabot auto-approve workflow exists.
    description: >-
      Any repo with Renovate or Dependabot auto-merge enabled must enforce a
      minimum release age of at least 3 days on incoming dependency updates.
      Without this gate, a zero-day-old package (malicious, hallucinated by an
      AI agent, or typosquatted) can be auto-merged and deployed before any
      human observes it. The 3-day window matches the median time for the
      security community to identify and report a malicious PyPI package.
      The cooldown can be satisfied by: (a) the org-level Renovate global config
      at homelab-infra/services/renovate/config/config.json setting
      minimumReleaseAge >= "3 days", or (b) the repo's own renovate.json
      packageRules setting minimumReleaseAge >= "3 days" on all or the
      automerge:true subset.
    verify: |
      1. Check for auto-merge signals (same as CI-062 step 1). If none: skip.
      2. Read homelab-infra/services/renovate/config/config.json. If
         minimumReleaseAge is present and >= "3 days" at the top level or
         in a packageRules entry covering all packages: PASS.
      3. If org config does not set minimumReleaseAge: read the repo's
         renovate.json. PASS if a packageRules entry covering automerge:true
         packages sets minimumReleaseAge >= "3 days".
      4. If neither file satisfies steps 2 or 3: FAIL.
    source_frameworks:
      - manifest-internal
      - OWASP Top 10 CI/CD A08 Ungoverned Usage of Third-Party Services
    notes: >-
      Added 2026-05-28. CI-061 and CI-064 cover homelab-infra only; this check
      generalizes the cooldown requirement to the fleet. Start at severity:
      suggested per the policy-execution-gap pattern and promote to critical
      after a fleet sweep confirms 100% reach. Renovate config edits must pass
      renovate-config-validator; use enabledManagers "pep621" not "uv" (see
      feedback_renovate_uv_manager_trap.md -- silent full-config rejection trap).
      Override eligible for repos that require same-day security patches; document
      the override with the rationale and an emergency-merge procedure. Do not
      promote to critical until the org-level Renovate config is confirmed to set
      minimumReleaseAge and the sweep verifies it on all 44 repos.

  - id: CI-068
    domain: ci
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Repo does not use uv as its package manager (no uv.lock at repo root)
      or does not contain Python source files.
    description: >-
      Python repos using uv must have uv.lock committed to version control and
      CI must install dependencies with "uv sync --frozen" (or equivalent
      "--require-hashes" flag), not "uv sync" without lockfile enforcement.
      An uncommitted or non-frozen install allows silent dependency drift:
      a new malicious release can be resolved and installed between the last
      lock and the next CI run, bypassing the cooldown check (CI-067) entirely.
    verify: |
      1. Confirm uv.lock exists at repo root: FAIL if absent.
      2. Confirm uv.lock is tracked by git (not in .gitignore):
         git ls-files uv.lock; FAIL if not listed.
      3. Search CI workflow files (.github/workflows/ci.yml,
         .github/workflows/python-ci.yml, or the org reusable workflow caller):
         grep -r "uv sync" .github/workflows/
         FAIL if any "uv sync" call lacks --frozen flag.
         PASS if all uv sync calls carry --frozen.
    source_frameworks:
      - manifest-internal
      - OWASP Top 10 CI/CD A06 Insufficient Credential Hygiene
      - NIST SSDF PS.1.1
    notes: >-
      Added 2026-05-28 at severity: suggested per the policy-execution-gap
      pattern; promote to important after a fleet sweep confirms 100% reach.
      CLAUDE.md and project memory reference uv sync --frozen extensively, but
      no manifest check enforces it. The org-level reusable workflow at
      ByronWilliamsCPA/.github/.github/workflows/python-ci.yml should be audited
      first; if it uses --frozen fleet-wide, individual repos that call it
      inherit compliance and this check may PASS for free on the majority of
      the fleet, which is also the first reach step before promotion.

  - id: CI-069
    domain: ci
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Repo does not contain Python source files or does not use a public
      package registry (private/internal packages only).
    description: >-
      PR-introduced dependencies must resolve to packages with verifiable
      registry history predating the PR by at least 24 hours, or the package
      must appear on a project-maintained allowlist. This check defends against
      hallucinated package names added by AI agents and against typosquatted
      packages uploaded specifically to target a PR review window. This is the
      hardest of the three intake defenses to automate; two implementation
      options are described below.
    verify: |
      Option A (OSV/registry-age check, preferred):
        In the PR diff, extract any new package names added to
        pyproject.toml [project.dependencies] or [project.optional-dependencies].
        For each new package: query PyPI JSON API:
          curl -s https://pypi.org/pypi/<package>/json | jq '.info.version'
        FAIL if the API returns 404 (package does not exist).
        FAIL if the earliest release date (releases object, first key date)
        is within 24 hours of the PR open time.
        PASS if the package has existed for >= 24 hours.
      Option B (allowlist gate, lower automation cost):
        Maintain .github/dependency-allowlist.txt listing approved packages.
        Any new package not on the allowlist blocks merge until a human adds
        it with a signed commit. This is higher-friction but zero false-negatives.
      Recommend starting with Option B on low-churn repos and Option A on
      repos where Renovate manages the majority of updates.
    source_frameworks:
      - manifest-internal
      - OWASP Top 10 CI/CD A08 Ungoverned Usage of Third-Party Services
      - OpenSSF Scorecard Dependency-Update-Tool
    notes: >-
      Added 2026-05-28. This is the lower-confidence check in this group:
      the verify implementation requires tooling not yet present in the fleet
      (PyPI API calls in CI or an allowlist workflow). Mark as severity: suggested
      at introduction and promote to important only after at least one reference
      implementation exists in a fleet repo. The OSV scanner
      (google/osv-scanner) partially covers this for known-bad packages but
      does not catch zero-day-published names. Option B (allowlist) is the
      recommended starting point for AI-heavy workflows where agents propose
      package names.

  - id: CI-071
    domain: ci
    severity: suggested
    description: >-
      No job in any workflow may grant a broader permission set at the job level than
      is required for that job's steps. A narrow top-level permissions block paired
      with a permissive job-level override (e.g., contents: write, id-token: write,
      packages: write on a job that only reads) defeats the top-level restriction.
    verify: |
      For each .github/workflows/*.yml that has a top-level permissions block:
        For each job that declares its own permissions: block:
          FLAG (do not auto-fail) if the job-level block grants any scope set to
          "write" or "admin" for scopes not explicitly required by the steps in
          that job (heuristic: step uses: or run: does not reference an action
          or command requiring that scope).
      Known-required grants: release jobs need contents: write; SLSA/attestation
      jobs need id-token: write; GHCR publish needs packages: write. Document
      per-job justification in a comment above the permissions block.
    override_eligible: true
    notes: >-
      Added 2026-05-28. Suggested severity on first pass; escalate to important
      after fleet audit establishes which job-level grants are justified. This
      check is complementary to CI-033 (top-level block presence), not a replacement.
      A workflow that passes CI-033 can still fail CI-071 if its job-level block
      over-grants.

  - id: FOUND-015
    domain: foundations
    severity: suggested
    override_eligible: true
    description: >-
      Verify docs/ADRs/ or docs/architecture/ directory exists and at
      least one ADR contains a "Security Considerations" section.
      NIST SSDF PW.2.1 requires design review for security concerns;
      ADR sections provide the documented trail.
    verify: >-
      Run: grep -rl "Security Considerations\|Security considerations"
      docs/ADRs/ docs/architecture/ 2>/dev/null | wc -l; WARN if 0.
    source_frameworks:
      - NIST SSDF PW.2.1
      - NIST SSDF PO.1.1

  - id: FOUND-016
    domain: foundations
    severity: critical
    description: >-
      LICENSES/ files contain no unfilled OSI-template placeholders.
      A LICENSE with literal angle-bracket placeholders reads as
      unlicensed to most automated license scanners (SPDX, REUSE,
      ScanCode), regardless of whether the project is properly licensed
      via REUSE.toml.
    verify: >-
      For each file under LICENSES/ (or LICENSE / LICENSE.txt at the
      repo root if no LICENSES/ directory exists), grep for literal
      placeholders: "<year>", "<copyright holders>", "<name of author>",
      "<organization>". Any angle-bracket placeholder in license text
      is a FINDING. LICENSES/ files and REUSE.toml are orthogonal:
      REUSE.toml carries per-file copyright statements, while LICENSES/
      files carry license text. Placeholders in license text are
      unacceptable regardless of REUSE.toml contents, because most
      automated scanners (SPDX, REUSE, ScanCode) read the license file
      directly and do not resolve attribution from REUSE.toml.
    override_eligible: false
    not_applicable_when: "repo has no LICENSE, LICENSE.txt, or LICENSES/ directory (a license-absence check is planned but not yet defined)"
    source_frameworks:
      - REUSE Specification 3.3
      - SPDX REUSE Annex
    notes: >-
      Introduced after the reference-library audit (2026-05-15) found
      template placeholders in shipped LICENSE files. The check is
      mechanical (grep for angle-bracket strings) and false-positive
      rate is effectively zero given that legitimate license text never
      contains the OSI template placeholder syntax.

  - id: FOUND-017
    domain: foundations
    severity: suggested
    override_eligible: true
    description: >-
      .editorconfig present at project root. Ensures consistent indentation,
      line endings, and whitespace across editors and contributors. Absence
      causes diff noise from editor-specific whitespace divergence.
    verify: "file_exists: .editorconfig"
    not_applicable_when: >-
      Repo is a single-author solo project with no external contributors
      and pre-commit whitespace hooks (trailing-whitespace, end-of-file-fixer)
      are already enforcing consistency.
    notes: >-
      Promoted from unclassified candidate in 2026-06-27 container-images
      audit retrospective. Start at suggested; promote to important once
      fleet-wide pre-commit whitespace coverage is confirmed (at that point
      .editorconfig provides editor-native enforcement rather than
      CI-only enforcement).

  - id: FOUND-018
    domain: foundations
    severity: suggested
    override_eligible: true
    description: >-
      Code repositories carry a project-scoped .mcp.json declaring the
      context7 and sonarqube MCP servers, so Claude Code has library-docs
      lookup and SonarCloud access available in-repo. The sonarqube url port
      must match the repo's SonarCloud org (sonar.organization in
      sonar-project.properties), not its GitHub org: byronwilliamscpa maps to
      http://localhost:8090/mcp, williaby maps to http://localhost:8091/mcp.
    verify: |
      file_exists: .mcp.json
      content_present: .mcp.json, context7
      content_present: .mcp.json, sonarqube
    not_applicable_when: >-
      repo.repositoryType not in [python-app, python-package, python-script,
      python-template], OR repo.isArchived == true. Config, docs-only, and
      infrastructure repos have no code-intelligence surface.
    notes: >-
      Established by the 2026-06-29 fleet rollout (28 PRs); see memory
      project_mcp_fleet_standard. pal and codebase-memory-mcp are user-scope
      (available in every repo) and are intentionally NOT required per-repo.
      The sonarqube endpoint is localhost-bound to the maintainer workstation,
      matching ByronWilliamsCPA/.claude; it reports "failed to connect" on CI
      or another machine, which is expected and not a violation. Start at
      suggested; promote to important once fleet coverage reaches 100 percent.

  - id: FOUND-019
    domain: foundations
    severity: suggested
    override_eligible: true
    description: >-
      Code repositories ship a .snyk scope baseline so Snyk Code and the Snyk
      IDE plugin honor the same filesystem-scope boundary the other quality
      gates already respect. The exclude: global: list must cover the
      generated and vendored paths that produce non-actionable noise: virtualenvs
      (.venv), worktrees (.worktrees), coverage output (htmlcov), build output
      (out), site-packages, node_modules, and built docs (site). Without the
      baseline, Snyk over-reports filesystem-scope findings that are upstream's
      responsibility, not the repo's.
    verify: |
      file_exists: .snyk
      content_present: .snyk, exclude
      content_present: .snyk, .venv
      content_present: .snyk, .worktrees
    not_applicable_when: >-
      repo.repositoryType not in [python-app, python-package, python-script,
      python-template], OR repo.isArchived == true. Config, docs-only, and
      infrastructure repos have no Snyk scan surface.
    notes: >-
      Established by the 2026-06-29 Snyk shift-left work (ADR-009). The .snyk
      exclude: list governs Snyk Code path scope; the cookiecutter template
      ships the generalized baseline so new repos are clean by default. Start
      at suggested; promote to important once fleet coverage reaches 100
      percent. See docs/architecture/adr/ADR-009-snyk-role-and-provenance.md.

  - id: OSSF-011
    domain: ossf
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Repo does not contain Python source files (no pyproject.toml with a
      [project] table). Non-Python repos have no fuzz testing surface.
    description: >-
      Verify the repository has a fuzz testing setup (atheris, libFuzzer,
      Hypothesis @given in a dedicated tests/fuzz/ directory, or a
      fuzz workflow). OpenSSF Silver badge criterion 6.1 requires dynamic
      analysis with many diverse inputs beyond mutation testing. Mutation
      testing (CI-053) is unit-test quality measurement, not input fuzzing.
    verify: >-
      Check for actual fuzz testing setup; ruff lint-ignore configurations
      that mention Atheris in comments are NOT sufficient:
      1. tests/fuzz/ directory exists and contains at least one .py file
         that imports atheris, defines TestOneInput, or uses @given
         (Hypothesis property testing).
      2. pyproject.toml lists atheris or libFuzzer as an actual dependency
         in [project.optional-dependencies], [tool.uv.dev-dependencies], or
         [build-system.requires] -- not inside a comment or ruff config block.
      3. .github/workflows/ contains a workflow file whose name matches
         fuzz*.yml, *-fuzzing.yml, or *-fuzz.yml.
      WARN if none found. Note: ruff ignore rules suppressing N802 or S110
      with inline comments citing Atheris naming conventions are pre-configured
      stubs in the cookiecutter template, not fuzz tests. See OSSF-013 for
      the companion check evaluating whether fuzz testing SHOULD be present
      based on the repo's external-input surface.
    source_frameworks:
      - OpenSSF Silver Badge criterion 6.1
      - NIST SSDF PW.8.2

  - id: OSSF-012
    domain: ossf
    severity: suggested
    override_eligible: true
    description: >-
      Verify any PATs used as repository secrets are fine-grained
      personal access tokens (not classic PATs). Fine-grained PATs
      support per-repo scoping and shorter expiry, satisfying SOC 2
      CC6.1 least-privilege controls.
    verify: >-
      Manual check: Review repo secrets in GitHub UI for any token
      values; verify each is a fine-grained PAT. Additionally,
      grep docs/security-analysis*.md for a documented PAT policy.
    source_frameworks:
      - SOC 2 CC6.1
      - OpenSSF Scorecard Token-Permissions
      - GitHub Security Hardening

  - id: OSSF-013
    domain: ossf
    severity: suggested
    override_eligible: true
    not_applicable_when: >-
      Repo does not contain Python source files (no pyproject.toml with a
      [project] table), or is infrastructure, configuration, or
      documentation only (no src/ or app/ directory with substantive
      Python source), or has no detectable external-input-processing
      patterns (see verify step 1 -- no HTTP API framework, no file
      parsing from external sources, no CLI accepting arbitrary data).
    description: >-
      Python repos that expose HTTP API endpoints or process
      external/untrusted input should have fuzz testing configured. Fuzz
      testing validates that input-handling code survives unexpected or
      adversarial inputs without raising unhandled exceptions, crashes, or
      data corruption. OSSF Silver criterion 6.1 requires at least one
      form of dynamic analysis with diverse inputs. Accepted forms include
      atheris/libFuzzer corpus-guided fuzzing, Hypothesis @given-decorated
      property tests in a dedicated tests/fuzz/ directory, or OSS-Fuzz
      integration. OSSF-011 checks whether any fuzz setup exists; this
      check evaluates whether one SHOULD exist based on the repo's input
      surface. Repos with no external input processing (pure computation
      libraries, config-only repos) are exempt via not_applicable_when.
    verify: >-
      1. Detect external-input-processing patterns in src/ or app/:
         - HTTP API: grep -r "FastAPI()\|APIRouter\|@app\.(get\|post\|put
           \|delete\|patch)\|@router\.(get\|post\|put\|delete\|patch)"
         - File parsing from external sources: grep -r "UploadFile\|
           request\.files\|open(.*request\|BytesIO\|StreamingResponse"
         - CLI accepting data: grep -r "argparse\|@click\.argument\|
           typer\.Argument" combined with file or stdin patterns
         If none found anywhere in src/ or app/, PASS silently
         (not_applicable_when applies).
      2. Check for fuzz testing setup using OSSF-011 criteria (tests/fuzz/
         with @given or TestOneInput, atheris in actual dependencies, or
         fuzz workflow file). If any found, PASS.
      3. If step 1 found external-input patterns but step 2 found no fuzz
         setup: WARN "Repo has external-input-processing patterns but no
         fuzz testing (tests/fuzz/, atheris dependency, or fuzz workflow).
         See OSSF Silver criterion 6.1."
    source_frameworks:
      - OpenSSF Silver Badge criterion 6.1
      - NIST SSDF PW.8.2
    notes: >-
      Added 2026-05-28. Companion to OSSF-011 (presence check) and CI-065
      (trigger scheduling). Current fleet state (2026-05-28): llc-manager
      is the only repo with fuzz tests (Hypothesis @given in tests/fuzz/).
      API repos without fuzz testing that appear to qualify based on
      FastAPI/APIRouter usage include rag-processor, fragrance-rater,
      data_ingestor, family-office-portal, and gleif -- run this check
      against each to confirm the input-surface detection before raising
      findings.

  - id: OSSF-014
    domain: ossf
    severity: important
    override_eligible: false
    description: >-
      Manual 2FA attestation for the williaby GitHub user account is present,
      current (within 90 days), and renewal_deadline is in the future.
      GitHub user accounts do not expose 2FA status via the org-2FA API,
      so a dated attestation file is the sole verifiable record.
    verify: |
      FAIL if docs/security/2fa-attestation.yaml does not exist.
      FAIL if no entry for account: williaby is present.
      FAIL if two_factor_enabled is not true.
      FAIL if confirmed_date is absent or older than 90 days from audit date.
      FAIL if renewal_deadline is absent or in the past.
      PASS if all fields are present, two_factor_enabled is true, confirmed_date
           is within 90 days, and renewal_deadline is in the future.
    notes: >-
      Added 2026-05-28 to close the gap left by OSSF-007, which only covers the
      ByronWilliamsCPA org (org-2FA API). The williaby account holds 26 of the
      44 fleet repos and has no API-verifiable 2FA check. The attestation file
      lives in this repo (ByronWilliamsCPA/.claude) only, not in each fleet repo;
      this check is fleet-scoped against the standards authority, so a sweep
      reports one finding (this repo), not 44. Quarterly renewal is sufficient;
      set a calendar reminder or scheduled cron task to renew before
      renewal_deadline expires. The initial committed attestation uses placeholder
      values (two_factor_enabled: false) and is expected to FAIL until the owner
      verifies 2FA on the williaby account and fills the real confirmed_date and
      renewal_deadline.

  - id: OSSF-015
    domain: ossf
    severity: important
    override_eligible: true
    not_applicable_when: "repo has no gitleaks or trufflehog CI job"
    description: >-
      The gitleaks or trufflehog CI job must be registered as a required status
      check on the default branch ruleset. Secret scanning that runs in CI but is
      not a required check cannot block a PR that contains secrets discovered after
      the branch was pushed (gap between push-protection coverage and merge-gate
      coverage).
    verify: |
      For each repo where .github/workflows/*.yml contains a job whose name or id
      matches (gitleaks|trufflehog):
        Retrieve the branch protection ruleset for the default branch via GitHub API.
        FAIL if the matching job name does not appear in required_status_checks.
        FAIL if the matching required_status_checks entry has integration_id absent
             or != 15368 (the GitHub Actions app); a context-string match alone is
             spoofable by any actor who can register a same-named check from a
             different app, mirroring CI-028's integration_id pin.
        PASS if the job name is present in required_status_checks AND its
             integration_id is 15368.
      Repos with no gitleaks/trufflehog CI job: apply OSSF-008/OSSF-009 platform
      scan check only; this check is N/A.
    notes: >-
      Added 2026-05-28. Complements OSSF-008 (platform alerting), OSSF-009
      (push protection), and CI-029 (config file protection). These checks
      together form the full secret-scanning gate stack:
      CI-029 prevents .gitleaks.toml tampering by non-bypass actors;
      CI-007 prevents secret-scanning jobs from carrying continue-on-error: true;
      OSSF-008 confirms GitHub platform scan alerting is enabled;
      OSSF-009 confirms GitHub platform push protection is enabled;
      OSSF-015 confirms the CI job is wired as a required merge gate.
      Private repos: OSSF-008 and OSSF-009 may be unavailable without GHAS,
      but OSSF-015 applies regardless of visibility because it checks the CI job,
      not the platform scan. Do not gate OSSF-015 on visibility. The job name in
      required_status_checks must exactly match the job name: or, if unset, the
      job key in the workflow YAML; a mismatch silently passes while providing no
      protection, so confirm the exact name in each fleet security-analysis.yml.

  - id: CLAUDE-009
    domain: claude_docs
    severity: important
    override_eligible: true
    description: >-
      Verify .claude/settings.json does not enable
      enableAllProjectMcpServers without a documented justification.
      Unconstrained MCP tool access grants agents excessive authority
      over external resources (OWASP LLM06, LLM08).
    verify: >-
      Run: python3 -c "import json, sys;
      d=json.load(open('.claude/settings.json'));
      sys.exit(0 if not d.get('enableAllProjectMcpServers') else 1)"
      || grep -l "enableAllProjectMcpServers" docs/security-analysis*.md;
      FAIL if flag is true and no justification documented.
    source_frameworks:
      - OWASP LLM06 Excessive Agency
      - OWASP LLM08 Excessive Permissions
      - CNCF Security TAG IAM

  # ── Repo Settings (GitHub repo-level toggles, not in-tree files) ─────────────
  # Audits repository settings accessible only via the GitHub API
  # (gh api repos/{owner}/{repo}). Distinct from foundations (in-tree files),
  # CI (workflows), and OSSF (Scorecard/Badge APIs). Added 2026-05-26 after the
  # Renovate auto-merge fleet rollout audit revealed that 11 of 42 repos had
  # allow_auto_merge=false and 38 of 42 had delete_branch_on_merge=false with
  # no manifest check covering either toggle.

  - id: REPO-001
    domain: repo_settings
    check_family: renovate-health
    severity: critical
    description: >-
      Repository setting allow_auto_merge is true. Without this toggle GitHub
      silently refuses to enable auto-merge on any PR, regardless of bot
      configuration. Renovate, Dependabot, and any other bot that requests
      platform auto-merge will appear to "work" (the API call succeeds) but
      the PR will never auto-merge. The 2026-05-26 audit found 11 of 42 repos
      had this set to false, blocking the entire Renovate auto-merge pipeline.
    verify: >-
      Run: gh api repos/<org>/<repo> --jq '.allow_auto_merge'.
      PASS if value is true. FAIL if false or null.
    override_eligible: false
    source_frameworks:
      - manifest-internal
    notes: >-
      Idempotent remediation: gh api repos/<org>/<repo> -X PATCH -f allow_auto_merge=true.
      Cross-reference: docs/reference/renovate-architecture.md (cutover playbook).

  - id: REPO-002
    domain: repo_settings
    check_family: renovate-health
    severity: important
    description: >-
      Repository setting delete_branch_on_merge is true. When false, merged
      Renovate (and other bot) branches accumulate indefinitely, cluttering the
      branch list and confusing future bot runs (Renovate's branch-reuse logic
      assumes branches are deleted post-merge). The 2026-05-26 audit found 38
      of 42 repos with this disabled.
    verify: >-
      Run: gh api repos/<org>/<repo> --jq '.delete_branch_on_merge'.
      PASS if value is true. FAIL if false or null.
    override_eligible: true
    source_frameworks:
      - manifest-internal
    notes: >-
      Idempotent remediation: gh api repos/<org>/<repo> -X PATCH
      -f delete_branch_on_merge=true. Override eligible for repos that
      intentionally retain merged branches for historical reference, but no
      such repo currently exists in either org.

  # ── Supply-chain hardening (container / SBOM pipeline) ───────────────────────

  - id: CI-087
    domain: ci
    severity: critical
    override_eligible: false
    description: >-
      No supply-chain pipeline step (SBOM generation, cosign signing, cosign
      attestation) carries continue-on-error: true or an inline suppressor
      such as "|| echo ... non-fatal" or "|| true". These patterns silently
      permit a workflow to report success while the SBOM or signature was never
      produced, defeating the supply-chain guarantee the pipeline advertises.
    verify: >-
      In .github/workflows/, for every step whose name or uses value references
      cosign (sign, attest), syft, cyclonedx, anchore/sbom-action, or
      trivy (in attestation mode): check that continue-on-error is absent or
      false AND that the run: block contains no "|| echo", "|| true", or
      "|| :" fallbacks. FAIL on any match. A FINDING is raised per affected
      step, not per workflow.
    not_applicable_when: "Repo has no SBOM generation or cosign signing steps."
    source_frameworks:
      - SLSA L2 (non-falsifiable provenance)
      - SSDF PW.9.1 (verify security properties)
    notes: >-
      Promoted from GENERAL-004 unclassified finding in 2026-06-27
      container-images audit. The pattern is architecturally distinct from
      general workflow error handling (CI-006): it specifically targets steps
      whose output is a trust artifact. A workflow with continue-on-error on
      these steps can ship an unsigned, un-attested image while CI reports
      green. Severity is critical because downstream consumers may rely on
      cosign verify-attestation as a hard trust anchor and silently skipped
      attestation is indistinguishable from a successfully attested image until
      verification is run.

  - id: CI-088
    domain: ci
    severity: important
    override_eligible: true
    description: >-
      SBOM generation tools invoked via docker run (e.g. anchore/syft,
      cyclonedx-cli) reference the image by digest (@sha256:...) rather than
      a mutable tag. A mutable tag means the tool version can silently change
      between runs, producing non-reproducible SBOMs and introducing
      supply-chain risk from a compromised upstream image.
    verify: >-
      In .github/workflows/, grep for "docker run" lines that include syft,
      cyclonedx, or other SBOM generator image names. PASS if every such
      reference uses the @sha256: digest form (e.g. anchore/syft@sha256:abc...).
      FAIL if any uses a bare tag (e.g. anchore/syft:v1.44.0 without a digest).
      Note: when using anchore/sbom-action (an Action, not a docker run), pin
      the action ref via standard SHA pinning (CI-005) instead of this check.
    not_applicable_when: >-
      Repo uses anchore/sbom-action or another Action-based SBOM tool
      exclusively (no direct docker run invocations of SBOM images).
    source_frameworks:
      - SLSA L2 (reproducible build / hermetic)
      - SSDF PW.4.1 (use well-secured build environments)
    notes: >-
      Promoted from GENERAL-007 unclassified finding in 2026-06-27
      container-images audit. Distinct from CI-005 (GitHub Actions SHA pinning)
      because docker run image refs are not covered by zizmor or
      actionlint SHA-pin checks; they require a separate grep pattern.
      Starts at important (not critical) because the blast radius is limited to
      SBOM drift, not unsigned images. Promote to critical if syft is also used
      in signing/attestation mode where the tool binary integrity is a trust
      anchor.
