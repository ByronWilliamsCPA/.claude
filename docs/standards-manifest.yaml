  - id: PC-012
    domain: pre_commit
    severity: important
    description: "All hook rev fields are 40-character SHA pins, not mutable tags"
    verify: "sha_pinned: .pre-commit-config.yaml, all_rev_fields"
    override_eligible: false

  # ── CI ────────────────────────────────────────────────────────────────────────

  - id: CI-001
    domain: ci
    severity: important
    description: "CI workflow uses org reusable python-ci.yml"
    verify: "content_present: .github/workflows/ci.yml, ByronWilliamsCPA/.github"
    override_eligible: true

  - id: CI-002
    domain: ci
    severity: important
    description: "Security workflow uses org reusable security analysis workflow"
    verify: "content_present: .github/workflows/security-analysis.yml, ByronWilliamsCPA/.github"
    override_eligible: true

  - id: CI-003
    domain: ci
    severity: important
    description: "SonarCloud integration workflow present"
    verify: "file_exists: .github/workflows/sonarcloud.yml"
    override_eligible: true

  - id: CI-003b
    domain: ci
    severity: critical
    description: >-
      sonar.organization matches the repo's GitHub org (ByronWilliamsCPA repos must use
      byronwilliamscpa; williaby repos must use williaby; value must be lowercase)
    verify: |
      Check sonar-project.properties for sonar.organization. Determine the repo's GitHub org.
      Expected value: byronwilliamscpa for ByronWilliamsCPA repos; williaby for williaby repos.
      Also check sonarcloud.yml for any hardcoded -Dsonar.organization= args -- these override
      sonar-project.properties and must match the same expected value.
      FAIL if: value is wrong org, wrong case (e.g. ByronWilliamsCPA instead of byronwilliamscpa),
      or sonar-project.properties is absent when sonarcloud.yml is present.
      Known failure pattern: BW repos with sonar.organization=williaby cause 403 on
      /analysis/jres because the org-level SONAR_TOKEN is scoped to byronwilliamscpa.
      Token smell rule (ByronWilliamsCPA only): BW repos that PASS via a repo-level
      SONAR_TOKEN pointing at the wrong SonarCloud org are also a FAIL -- the token
      is masking misregistration. This smell does NOT apply to williaby repos.
      williaby token rule: williaby is a personal GitHub account with no account-level
      secrets. Each williaby repo using SonarCloud MUST have a repo-level SONAR_TOKEN
      set individually. This is correct and expected, not a smell.
    override_eligible: false

  - id: CI-004
    domain: ci
    severity: important
    description: >-
      Qlty coverage workflow present (supplements Codecov; Qlty handles code quality
      metrics, Codecov tracks test coverage history and PR deltas)
    verify: "file_exists: .github/workflows/coverage.yml"
    override_eligible: true

  - id: CI-005
    domain: ci
    severity: critical
    description: "All GitHub Action uses: references are 40-character SHA pins"
    verify: "sha_pinned: .github/workflows/*.yml, all_uses_fields"
    override_eligible: false

  - id: CI-006
    domain: ci
    severity: important
    description: "harden-runner present as first step in all workflow jobs"
    verify: "content_present: .github/workflows/*.yml, harden-runner"
    override_eligible: false

  - id: CI-007
    domain: ci
    severity: important
    description: "Security scan jobs have no continue-on-error: true"
    verify: "content_absent: .github/workflows/security.yml, continue-on-error"
    override_eligible: false

  - id: CI-008
    domain: ci
    severity: suggested
    description: ".github/copilot-instructions.md present"
    verify: "file_exists: .github/copilot-instructions.md"
    override_eligible: true

  - id: CI-009
    domain: ci
    severity: important
    description: "Codecov config file present at project root (.codecov.yml or codecov.yaml)"
    verify: "file_exists: .codecov.yml,codecov.yaml"
    override_eligible: true

  - id: CI-010
    domain: ci
    severity: important
    description: "Codecov config minimum coverage threshold is 80% or above"
    verify: "content_present: .codecov.yml OR codecov.yaml, target: 80"
    override_eligible: true

  - id: CI-011
    domain: ci
    severity: important
    description: "Codecov config defines separate coverage flags for unit and integration tests"
    verify: "content_present: .codecov.yml OR codecov.yaml, flags:"
    override_eligible: true

  - id: CI-012
    domain: ci
    severity: important
    description: "SonarQube quality gate passes -- no open Blocker or Critical issues (queried via SonarQube API)"
    verify: "sonarqube_quality_gate: status=OK, severities=BLOCKER,CRITICAL"
    override_eligible: true

  - id: CI-013
    domain: ci
    severity: important
    description: >-
      No unregistered GitHub Actions workflows -- any .yml in .github/workflows/ not in
      the registered set is flagged for evaluation
    verify: "workflow_inventory: .github/workflows/, expected_set=[ci.yml,codeql.yml,container-security.yml,coverage.yml,dependency-review.yml,docs.yml,mutation-testing.yml,postman-api-tests.yml,pr-validation.yml,python-compatibility.yml,release-sign.yml,release.yml,reuse.yml,sbom.yml,scorecard.yml,security-analysis.yml,slsa-provenance.yml,sonarcloud.yml], report_extras=true"  # yamllint disable-line rule:line-length
    override_eligible: true

  - id: CI-022
    domain: ci
    severity: critical
    description: >-
      Every entry in required_checks has a workflow job that produces it,
      either locally or via a registered reusable workflow.
    verify: "required_checks_have_producer: docs/standards-manifest.yaml, docs/reusable-workflow-jobs.yaml"  # yamllint disable-line rule:line-length
    override_eligible: false

  - id: CI-023
    domain: ci
    severity: critical
    description: >-
      Effective required-status-checks (classic protection union repo rulesets union
      org rulesets targeting this repo) exactly equal required_checks names.
    verify: "protection_matches_required_checks: docs/standards-manifest.yaml, source=union"
    override_eligible: false
    not_applicable_when: >-
      repo.branchProtectionExempt == true OR repo.repositoryType == 'config' OR
      repo.repositoryType == 'docs-only' OR repo.repositoryType == 'infrastructure'

  - id: CI-024
    domain: ci
    severity: important
    description: >-
      Every reusable workflow registered in
      docs/reusable-workflow-jobs.yaml has last_verified within 90 days.
    verify: "registry_freshness: docs/reusable-workflow-jobs.yaml, max_age_days=90"
    override_eligible: false

  - id: CI-025a
    domain: ci
    severity: critical
    description: >-
      ByronWilliamsCPA org has at least one ruleset with enforcement=active
      targeting the default branch of every non-exempt repo. williaby is a
      User account and is covered by CI-025b instead.
    verify: "org_ruleset_present: orgs=[ByronWilliamsCPA], enforcement=active"
    override_eligible: false
    not_applicable_when: "repo.org != 'ByronWilliamsCPA' OR repo.branchProtectionExempt == true"

  - id: CI-025b
    domain: ci
    severity: critical
    description: >-
      Every non-exempt williaby repo has at least one repo-level ruleset with
      enforcement=active targeting its default branch. williaby is a User
      account and cannot host org rulesets, so per-repo rulesets carry the
      baseline instead.
    verify: "repo_ruleset_present: owner=williaby, enforcement=active"
    override_eligible: false
    not_applicable_when: "repo.org != 'williaby' OR repo.branchProtectionExempt == true"

  - id: CI-026
    domain: ci
    severity: important
    description: >-
      Active ruleset includes a copilot_code_review rule, which auto-requests
      Copilot review on every PR opened against the default branch. Replaces
      the per-PR runtime trigger in /pr-review. For ByronWilliamsCPA, the rule
      lives in the org ruleset; for williaby, in each repo-level ruleset.
    verify: "ruleset_contains_rule: targets=[org:ByronWilliamsCPA, repo:williaby/*], rule_type=copilot_code_review"
    override_eligible: true
    not_applicable_when: "repo.branchProtectionExempt == true"
    notes: >-
      Copilot status check 'Copilot' may additionally be added to
      required_status_checks once stability is confirmed (Phase 3.5),
      which would make Copilot review blocking rather than advisory.

  - id: CI-027
    domain: ci
    severity: important
    description: >-
      Classic branch protection is ABSENT once migration has completed
      for this repo (prevents drift back to two sources of truth).
    verify: "classic_protection_absent: branch=default"
    override_eligible: true
    not_applicable_when: "repo.branchProtectionExempt == true OR repo.migrationPhase != complete"

  - id: CI-018
    domain: ci
    severity: important
    description: >-
      SLSA provenance job present in release.yml calling slsa-framework/slsa-github-generator
      (OpenSSF Silver: signed_releases)
    verify: "content_present: .github/workflows/release.yml, slsa-framework/slsa-github-generator"
    override_eligible: true

  - id: CI-019
    domain: ci
    severity: important
    description: "PyPI publish step in release.yml uses attestations: true (supply chain integrity)"
    verify: "content_present: .github/workflows/release.yml, attestations: true"
    override_eligible: true

  - id: CI-020
    domain: ci
    severity: important
    description: >-
      renovate.json present at repo root (Renovate is the org-standard dependency manager;
      replaces dependabot.yml across all 44 repos as of 2026-05-05)
    verify: "file_exists: renovate.json"
    override_eligible: true
    notes: >
      Exceptions: dart-frog-paludarium and homelab-agent-configs (williaby) are in
      RENOVATE_IGNORED_REPOS and may retain dependabot.yml as their only update manager.
      Six BW repos (gleif, DeQA-Doc, taxdome, reference-library, cookiecutter-python-template,
      .github) are pending Renovate onboarding PRs; CI-020 is N/A for them until merged.

  - id: CI-021
    domain: ci
    severity: important
    description: >-
      dependabot.yml absent when renovate.json is present (running both creates duplicate
      update PRs and conflicts with Renovate's CVE automerge rules)
    verify: |
      If renovate.json exists at repo root: FAIL if .github/dependabot.yml also exists.
      If renovate.json does not exist: skip this check (use CI-020 for the renovate.json gap).
      Exceptions: dart-frog-paludarium and homelab-agent-configs (Renovate ignored; may keep dependabot.yml).
    override_eligible: false

  # ── Claude and Docs ──────────────────────────────────────────────────────────

  - id: CLAUDE-001
    domain: claude_docs
    severity: important
    description: "Project CLAUDE.md present at project root"
    verify: "file_exists: CLAUDE.md"
    override_eligible: true

  - id: CLAUDE-002
    domain: claude_docs
    severity: important
    description: "CLAUDE.md contains Model Selection section"
