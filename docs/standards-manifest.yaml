  - id: CI-003b
    domain: ci
    severity: critical
    description: >-
      sonar.organization matches the repo's GitHub org (ByronWilliamsCPA repos must use
      byronwilliamscpa; williaby repos must use williaby; value must be lowercase)
    verify: |
      Check sonar-project.properties for sonar.organization. Determine the repo's GitHub org.
      Expected value: byronwilliamscpa for ByronWilliamsCPA repos; williaby for williaby repos.
      Also check sonarcloud.yml for any hardcoded -Dsonar.organization= args -- these override
      sonar-project.properties and must match the same expected value.
      FAIL if: value is wrong org, wrong case (e.g. ByronWilliamsCPA instead of byronwilliamscpa),
      or sonar-project.properties is absent when sonarcloud.yml is present.
      Known failure pattern: BW repos with sonar.organization=williaby cause 403 on
      /analysis/jres because the org-level SONAR_TOKEN is scoped to byronwilliamscpa.
      Token smell rule (ByronWilliamsCPA only): BW repos that PASS via a repo-level
      SONAR_TOKEN pointing at the wrong SonarCloud org are also a FAIL -- the token
      is masking misregistration. This smell does NOT apply to williaby repos.
      williaby token rule: williaby is a personal GitHub account with no account-level
      secrets. Each williaby repo using SonarCloud MUST have a repo-level SONAR_TOKEN
      set individually. This is correct and expected, not a smell.
    override_eligible: false

