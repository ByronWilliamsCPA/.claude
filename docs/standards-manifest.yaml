  - id: CI-012
    domain: ci
    severity: important
    description: "SonarQube quality gate passes -- no open Blocker or Critical issues (queried via SonarQube API)"
    verify: >-
      sonarqube_quality_gate: status=OK, severities=BLOCKER,CRITICAL.
      VISIBILITY GATE: if sonar-project.properties is present but the project is private-visibility
      on SonarCloud, skip the unauthenticated API probe (it returns 'Project not found' for private
      projects by design) and record PASS (visibility-gated) instead of a FINDING.
      Private-visibility is indicated by isPrivate=true in the repo catalog OR by the project not
      returning data from the public API when sonar-project.properties is present.
    override_eligible: true

  - id: CI-013
    domain: ci
    severity: important
    description: >-
      No unregistered GitHub Actions workflows -- any .yml in .github/workflows/ not in
      the registered set is flagged for evaluation
    verify: "workflow_inventory: .github/workflows/, expected_set=[ci.yml,codeql.yml,coverage.yml,dependency-review.yml,docs.yml,fips-compatibility.yml,mutation-testing.yml,postman-api-tests.yml,pr-title.yml,pr-validation.yml,python-compatibility.yml,qlty.yml,release-sign.yml,release.yml,repo-health.yml,reuse.yml,sbom.yml,scorecard.yml,security-analysis.yml,slsa-provenance.yml,sonarcloud.yml], report_extras=true"  # yamllint disable-line rule:line-length
    override_eligible: true

  - id: CI-022
    domain: ci
    severity: critical
    description: >-
      Every entry in required_checks has a workflow job that produces it,
      either locally or via a registered reusable workflow.
    verify: >-
      required_checks_have_producer: docs/standards-manifest.yaml, docs/reusable-workflow-jobs.yaml.
      Pass --repo-type <repositoryType> to check-required-checks.py so entries with
      applies_to_types that exclude this repo type are silently skipped.
    override_eligible: false

  - id: CI-023
    domain: ci
    severity: critical
    description: >-
      Effective required-status-checks (classic protection union repo rulesets union
      org rulesets targeting this repo) exactly equal required_checks names.
    verify: "protection_matches_required_checks: docs/standards-manifest.yaml, source=union"
    override_eligible: false
    not_applicable_when: >-
      repo.branchProtectionExempt == true OR repo.repositoryType == 'config' OR
      repo.repositoryType == 'docs-only' OR repo.repositoryType == 'infrastructure'
    notes: >-
      Check run names must match the GitHub Checks API output, NOT the PR UI display.
      Direct jobs: name = job `name:` field only (e.g., "CI Gate", not "CI / CI Gate").
      Reusable-workflow callee jobs: name = "{calling_job_name} / {internal_job_name}".
      Verification: gh api repos/<org>/<repo>/commits/<sha>/check-runs --jq '.check_runs[].name'
      Compare against this file's required_checks[].name entries. The PR UI prepends
      the workflow name as a visual prefix for ALL checks -- this is cosmetic only for direct jobs.

  - id: CI-024
    domain: ci
    severity: important
    description: >-
      Every reusable workflow registered in
      docs/reusable-workflow-jobs.yaml has last_verified within 90 days.
    verify: "registry_freshness: docs/reusable-workflow-jobs.yaml, max_age_days=90"
    override_eligible: false

  - id: CI-025a
    domain: ci
    severity: critical
    description: >-
      ByronWilliamsCPA org has at least one ruleset with enforcement=active
      targeting the default branch of every non-exempt repo. williaby is a
      User account and is covered by CI-025b instead.
    verify: "org_ruleset_present: orgs=[ByronWilliamsCPA], enforcement=active"
    override_eligible: false
    not_applicable_when: "repo.org != 'ByronWilliamsCPA' OR repo.branchProtectionExempt == true"

  - id: CI-025b
    domain: ci
    severity: critical
    description: >-
      Every non-exempt williaby repo has at least one repo-level ruleset with
      enforcement=active targeting its default branch. williaby is a User
      account and cannot host org rulesets, so per-repo rulesets carry the
      baseline instead.
    verify: "repo_ruleset_present: owner=williaby, enforcement=active"
    override_eligible: false
    not_applicable_when: "repo.org != 'williaby' OR repo.branchProtectionExempt == true"

  - id: CI-026
    domain: ci
    severity: important
    description: >-
      Active ruleset includes a copilot_code_review rule, which auto-requests
      Copilot review on every PR opened against the default branch. Replaces
      the per-PR runtime trigger in /pr-review. For ByronWilliamsCPA, the rule
      lives in the org ruleset; for williaby, in each repo-level ruleset.
    verify: "ruleset_contains_rule: targets=[org:ByronWilliamsCPA, repo:williaby/*], rule_type=copilot_code_review"
    override_eligible: true
    not_applicable_when: "repo.branchProtectionExempt == true"
    notes: >-
      Copilot status check 'Copilot' may additionally be added to
      required_status_checks once stability is confirmed (Phase 3.5),
      which would make Copilot review blocking rather than advisory.

  - id: CI-027
    domain: ci
    severity: important
    description: >-
      Classic branch protection is ABSENT once migration has completed
      for this repo (prevents drift back to two sources of truth).
    verify: "classic_protection_absent: branch=default"
    override_eligible: true
    not_applicable_when: "repo.branchProtectionExempt == true OR repo.migrationPhase != complete"

  - id: CI-028
    domain: ci
    severity: critical
    description: >-
      All required_status_checks entries in org/user ruleset JSON files must carry
      integration_id: 15368 (GitHub Actions app). Without this pin any actor with
      write access can post a passing check using the same name and satisfy the gate.
    verify: |
      For each file in docs/reference/org-rulesets/*.json:
        For each required_status_checks entry: FAIL if integration_id is absent or != 15368.
    override_eligible: false

  - id: CI-029
    domain: ci
    severity: critical
    description: >-
      Universal rulesets must include a file_path_restriction rule covering the full
      trust-boundary path set: .github/workflows/, .github/CODEOWNERS,
      .pre-commit-config.yaml, pyproject.toml, renovate.json,
      sonar-project.properties, .gitleaks.toml. Workflow-only restriction leaves
      the files that define every local gate writable by non-bypass actors.
    verify: |
      For each *-universal.json in docs/reference/org-rulesets/:
        FAIL if no rule of type file_path_restriction exists.
        FAIL if restricted_file_paths does not include all seven required paths.
    override_eligible: false

  - id: CI-030
    domain: ci
    severity: important
    description: >-
      Tag-protection rulesets present for each org/account targeting refs/tags/v*
      with rules: creation, deletion, non_fast_forward, update, required_signatures,
      and tag_name_pattern (SemVer regex). Replaces the deprecated Tag Protection
      Rules API (sunset August 2024).
    verify: |
      FAIL if docs/reference/org-rulesets/ contains no *-tag-protection.json for each org.
      For each tag-protection file: FAIL if missing any of creation, deletion,
      non_fast_forward, update, required_signatures, or tag_name_pattern rule types.
    override_eligible: true
    not_applicable_when: "repo.hasNoReleases == true"

  - id: CI-031
    domain: ci
    severity: important
    description: >-
      harden-runner egress-policy must be block (not audit) in ci.yml,
      pr-validation.yml, and reuse.yml once onboarding is complete. audit mode
      is observational only and provides no actual supply-chain network protection.
    verify: |
      In each of .github/workflows/ci.yml, pr-validation.yml, reuse.yml:
        PASS if egress-policy: block is present.
        PASS if file contains a deferral comment with a target date.
        FAIL if egress-policy: audit with no deferral comment.
    override_eligible: true
    notes: >
      Current posture is audit mode pending onboarding stabilization. Flip to block
      after confirming all required outbound domains are captured in the audit log.

  - id: CI-032
    domain: ci
    severity: important
    description: >-
      Universal rulesets must include a max_file_size rule with max_file_size no
      greater than 100 (MB). Prevents accidental large-binary commits (SQLite
      databases, training data, screenshots) that bypass pre-commit hooks when
      pushed by bypass actors.
    verify: |
      For each *-universal.json in docs/reference/org-rulesets/:
        FAIL if no rule of type max_file_size exists.
        FAIL if max_file_size parameter exceeds 100.
    override_eligible: true

  - id: CI-018
    domain: ci
    severity: important
    description: >-
      SLSA provenance job present in release.yml calling slsa-framework/slsa-github-generator
      (OpenSSF Silver: signed_releases)
    verify: "content_present: .github/workflows/release.yml, slsa-framework/slsa-github-generator"
    override_eligible: true
    not_applicable_when: "repo does not contain Python source files"
    notes: >-
      Genuine SLSA L3 isolation requires egress-policy: block in every harden-runner
      step of the release and SLSA provenance workflows. egress-policy: audit logs
      traffic but does not enforce isolation, undermining the L3 attestation claim.
      See CI-044 for the enforcement check added by the 2026-05-14 gap analysis.

  - id: CI-019
    domain: ci
    severity: important
    description: "PyPI publish step in release.yml uses attestations: true (supply chain integrity)"
    verify: "content_present: .github/workflows/release.yml, attestations: true"
    override_eligible: true
    not_applicable_when: "repo does not contain Python source files"

  - id: CI-020
    domain: ci
    severity: important
    description: >-
      renovate.json present at repo root (Renovate is the org-standard dependency manager;
      replaces dependabot.yml across all 44 repos as of 2026-05-05)
    verify: "file_exists: renovate.json"
    override_eligible: true
    notes: >
      Exceptions: dart-frog-paludarium and homelab-agent-configs (williaby) are in
      RENOVATE_IGNORED_REPOS and may retain dependabot.yml as their only update manager.
      Six BW repos (gleif, DeQA-Doc, taxdome, reference-library, cookiecutter-python-template,
      .github) are pending Renovate onboarding PRs; CI-020 is N/A for them until merged.

  - id: CI-021
    domain: ci
    severity: important
    description: >-
      dependabot.yml absent when renovate.json is present (running both creates duplicate
      update PRs and conflicts with Renovate's CVE automerge rules)
    verify: |
      If renovate.json exists at repo root: FAIL if .github/dependabot.yml also exists.
      If renovate.json does not exist: skip this check (use CI-020 for the renovate.json gap).
      Exceptions: dart-frog-paludarium and homelab-agent-configs (Renovate ignored; may keep dependabot.yml).
    override_eligible: false

  - id: CI-033
    domain: ci
    severity: important
    description: >-
      Every workflow file must declare a top-level permissions block that explicitly
      restricts permissions. Relying on the default (write-all) grants every job write
      access to all scopes, violating least-privilege and enabling token-theft escalation.
    verify: |
      For each .github/workflows/*.yml:
        FAIL if no top-level "permissions:" key is present.
        FAIL if the top-level permissions block is absent and job-level permissions are
        not present on every job (job-level grants do not satisfy the workflow-level
        restriction requirement unless the workflow declares "permissions: {}").
    override_eligible: false
    notes: >-
      Scope: workflow-level top-level permissions block (not per-job). CI-034 handles
      job-level timeout enforcement. These two checks are complementary, not overlapping.

  - id: CI-034
    domain: ci
    severity: important
    description: >-
      Every locally-defined job in a workflow file must set timeout-minutes. Jobs without
      a timeout run indefinitely on failure, consuming runner minutes and blocking the
      concurrency slot until GitHub's 6-hour hard limit kills them.
    verify: |
      For each .github/workflows/*.yml:
        For each job NOT defined as a reusable workflow call (i.e., "uses:" key absent):
          FAIL if timeout-minutes is not set on that job.
      Jobs that call reusable workflows via "uses:" are exempt; the timeout should be
      set inside the callee workflow.
    override_eligible: false
    notes: >-
      Scope: job-level timeout-minutes on locally-defined jobs only. CI-033 handles
      workflow-level permissions enforcement. These two checks are complementary.

  - id: CI-035
    domain: ci
    severity: suggested
    description: >-
      Workflows triggered by pull_request or pull_request_target must define a
      concurrency group with cancel-in-progress: true. Without this, redundant runs
      accumulate when a developer pushes multiple commits in quick succession, wasting
      runner minutes and causing noisy PR status updates.
    verify: |
      For each .github/workflows/*.yml that has pull_request or pull_request_target
      in its "on:" block:
        FAIL if no top-level "concurrency:" key is present.
        FAIL if concurrency.cancel-in-progress is not true.
    override_eligible: true

  - id: CI-036
    domain: ci
    severity: important
    description: >-
      A dependency-review.yml workflow must be present for public repos, triggered on
      pull_request, using actions/dependency-review-action with fail-on-severity: high.
      This catches vulnerable new dependencies added in a PR diff before they merge,
      complementing pip-audit (which audits the full lock file, not just the diff).
    verify: |
      file_exists: .github/workflows/dependency-review.yml
      content_present: .github/workflows/dependency-review.yml, dependency-review-action
      content_present: .github/workflows/dependency-review.yml, fail-on-severity: high
    override_eligible: true
    notes: >
      Not applicable to private repos (GitHub's vulnerability database endpoint for
      dependency review is only available on public repos or repos with GitHub Advanced
      Security). Mark N/A with a comment when the repo is private.

  - id: CI-037
    domain: ci
    severity: important
    description: >-
      A PR title validation workflow must be present, enforcing conventional commit
      format on PR titles. Squash merges use the PR title as the resulting commit
      message on main, so an unvalidated PR title becomes a malformed commit in the
      permanent history and breaks semantic-release version inference.
    verify: |
      file_exists: .github/workflows/pr-title.yml
      content_present: .github/workflows/pr-title.yml, action-semantic-pull-request
    override_eligible: true
    notes: >
      Override eligible when the repo uses a different conventional commit enforcement
      mechanism (e.g., commitlint in CI, branch naming rules that already enforce type
      prefixes). Document the alternative in the override entry.

  - id: CI-038
    domain: ci
    severity: important
    description: >-
      An SBOM generation workflow must be present, producing a CycloneDX or SPDX artifact
      on push to the default branch. The SBOM provides the machine-readable dependency
      inventory required by OpenSSF Silver (signed_releases group) and enables downstream
      vulnerability correlation when a new CVE is published against a transitive dependency.
    verify: |
      file_exists: .github/workflows/sbom.yml
      content_present: .github/workflows/sbom.yml, push
    override_eligible: true

  - id: CI-039
    domain: ci
    severity: important
    description: >-
      Python repos must run CI against a matrix that covers Python 3.10 through the
      current stable release (3.13 as of 2026). A python-compatibility.yml workflow
      (or equivalent matrix in ci.yml) must be present. Testing only against the
      deployment version misses syntax and stdlib incompatibilities introduced when
      the project is used as a library on an older interpreter.
    verify: |
      At least one of the following must be true:
        content_present: .github/workflows/python-compatibility.yml, "3.10"
        content_present: .github/workflows/ci.yml, matrix
      FAIL for Python repos if neither condition is met.
    not_applicable_when: "not a Python project"
    override_eligible: true

  - id: CI-040
    domain: ci
    severity: suggested
    description: >-
      The primary CI workflow should respond to the merge_group event so that merge
      queue builds run the same gate set as PR builds. Without this trigger, the merge
      queue uses a synthetic check that may bypass required status checks, allowing
      a queue entry to merge even if the combined HEAD fails CI.
    verify: |
      content_present: .github/workflows/ci.yml, merge_group
    override_eligible: true
    notes: >
      Override eligible with a dated deferral comment when the merge queue feature has
      not been enabled on the repo. The merge queue must be enabled in the repo settings
      before adding the trigger has any effect.

  - id: CI-041
    domain: ci
    severity: suggested
    description: >-
      The PyPI publish job in release.yml must reference a named GitHub Environment
      (environment: pypi) configured with at least one protection rule (required
      reviewers, deployment branch restriction, or wait timer). Publishing without
      a protected environment means any workflow can trigger a release with no
      additional approval gate.
    verify: |
      content_present: .github/workflows/release.yml, environment:
    override_eligible: true
    not_applicable_when: "repo does not publish to PyPI"

  - id: CI-042
    domain: ci
    severity: suggested
    description: >-
      Test results should be published as inline PR annotations using a JUnit XML
      uploader (e.g., EnricoMi/publish-unit-test-result-action or the equivalent
      step in the org reusable python-ci workflow). Inline annotations surface
      failing test names directly in the PR diff without requiring a developer to
      download and parse the CI log.
    verify: |
      At least one of the following must be true:
        content_present: .github/workflows/ci.yml, publish-unit-test-result-action
        content_present: .github/workflows/ci.yml, python-ci.yml
      The second condition is satisfied when the repo delegates to the org reusable
      python-ci workflow, which includes the annotation step internally.
    override_eligible: true

