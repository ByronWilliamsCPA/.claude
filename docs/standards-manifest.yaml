# Cross-reference: docs/audits/dependency-management-improvement-plan-2026-05-24.md
#
# 2026-05-26: Merge queue rollout (ByronWilliamsCPA/.github#154). Added CI-062
# (merge_queue enabled on main ruleset for auto-merging repos, important) and
# promoted CI-040 (merge_group trigger on primary CI workflow) from suggested
# to important. The cost incident in homelab-infra on 2026-05-24 (5 Renovate
