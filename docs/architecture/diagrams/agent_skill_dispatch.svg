ze="12" lengthAdjust="spacing" textLength="143.3203" x="418.8037" y="411.959">Spawn sub-session with</text><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="133.0254" x="418.8037" y="425.9277">agent-specific tool set</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="121.8008" x="429.5635" y="500.1875"/><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="101.8008" x="439.5635" y="521.3262">Sub-session runs</text><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="82.3828" x="439.5635" y="535.2949">agent prompt</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="126.7227" x="427.1025" y="568.125"/><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="106.7227" x="437.1025" y="589.2637">Return structured</text><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="93.4863" x="437.1025" y="603.2324">result to parent</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="133.373" x="798.1694" y="212.4844"/><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="113.373" x="808.1694" y="233.623">Model uses default</text><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="93.6973" x="808.1694" y="247.5918">tool set directly</text><polygon fill="#FEFEFE" points="677.6599,622.0625,689.6599,634.0625,677.6599,646.0625,665.6599,634.0625,677.6599,622.0625" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#FEFEFE" points="384.1874,652.0625,396.1874,664.0625,384.1874,676.0625,372.1874,664.0625,384.1874,652.0625" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#1818