<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1114px" preserveAspectRatio="none" style="width:942px;height:1114px;background:#FFFFFF;" version="1.1" viewBox="0 0 942 1114" width="942px" zoomAndPan="magnify"><title>Agent vs Skill Dispatch</title><defs><style type="text/css">@import url('https://fonts.googleapis.com/css?family=Roboto:400,100,100italic,300,300italic,400italic,500,500italic,700,700italic,900,900italic');</style></defs><g><g class="title" data-source-line="4"><text fill="#000000" font-family="Roboto" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="182.0615" x="378.7405" y="32.9951">Agent vs Skill Dispatch</text></g><ellipse cx="384.1874" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="140.1758" x="314.0995" y="87.2969"/><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="120.1758" x="324.0995" y="108.4355">User prompt arrives</text><polygon fill="#FEFEFE" points="315.2897,141.2656,453.0851,141.2656,465.0851,154.0703,453.0851,166.875,315.2897,166.875,303.2897,154.0703,315.2897,141.2656" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Roboto" font-size="11" lengthAdjust="spacing" textLength="129.0674" x="315.2897" y="151.4761">Explicit /skill invocation</text><text fill="#000000" font-family="Roboto" font-size="11" lengthAdjust="spacing" textLength="137.7954" x="315.2897" y="164.2808">or matching skill trigger?</text><text fill="#000000" font-family="Roboto" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="284.2814" y="151.4761">yes</text><text fill="#000000" font-family="Roboto" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="465.0851" y="151.4761">no</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="128.5918" x="26.4189" y="176.875"/><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="108.5918" x="36.4189" y="198.0137">Skill matcher fires</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="159.4297" x="11" y="245.8438"/><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="120.334" x="21" y="266.9824">Load SKILL.md from</text><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="139.4297" x="21" y="280.9512">.claude/skills/&lt;name&gt;/</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="139.4375" x="20.9961" y="328.7813"/><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="107.9004" x="30.9961" y="349.9199">Inject skill prompt</text><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="119.4375" x="30.9961" y="363.8887">into system context</text><path d="M172.1221,411.7188 L172.1221,450.5508 L152.1221,454.5508 L172.1221,458.5508 L172.1221,497.3828 A0,0 0 0 0 172.1221,497.3828 L369.0918,497.3828 A0,0 0 0 0 369.0918,497.3828 L369.0918,421.7188 L359.0918,411.7188 L172.1221,411.7188 A0,0 0 0 0 172.1221,411.7188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M359.0918,411.7188 L359.0918,421.7188 L369.0918,421.7188 L359.0918,411.7188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Roboto" font-size="13" lengthAdjust="spacing" textLength="157.0601" x="178.1221" y="428.7856">Skills are auto-triggered</text><text fill="#000000" font-family="Roboto" font-size="13" lengthAdjust="spacing" textLength="158.2725" x="178.1221" y="443.9185">by keyword matchers or</text><text fill="#000000" font-family="Roboto" font-size="13" lengthAdjust="spacing" textLength="137.1411" x="178.1221" y="459.0513">explicitly invoked via</text><text fill="#000000" font-family="Roboto" font-size="13" lengthAdjust="spacing" textLength="175.9697" x="178.1221" y="474.1841">/name. They compose with</text><text fill="#000000" font-family="Roboto" font-size="13" lengthAdjust="spacing" textLength="175.1318" x="178.1221" y="489.3169">the current session's tools.</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="122.8145" x="29.3076" y="430.582"/><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="102.8145" x="39.3076" y="451.7207">Skill runs against</text><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="69.8438" x="39.3076" y="465.6895">live tool set</text><polygon fill="#FEFEFE" points="590.3662,176.875,764.9536,176.875,776.9536,189.6797,764.9536,202.4844,590.3662,202.4844,578.3662,189.6797,590.3662,176.875" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Roboto" font-size="11" lengthAdjust="spacing" textLength="115.7954" x="590.3662" y="187.0854">Model decides to call</text><text fill="#000000" font-family="Roboto" font-size="11" lengthAdjust="spacing" textLength="174.5874" x="590.3662" y="199.8901">Agent tool with subagent_type?</text><text fill="#000000" font-family="Roboto" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="559.3579" y="187.0854">yes</text><text fill="#000000" font-family="Roboto" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="776.9536" y="187.0854">no</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="148.1914" x="416.3682" y="212.4844"/><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="128.1914" x="426.3682" y="233.623">Agent tool invocation</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" r