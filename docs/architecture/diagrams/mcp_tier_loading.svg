qualified-name="Tracked" id="ent0006"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="182.7207" x="120.48" y="773.9469"/><line style="stroke:#181818;stroke-width:0.5;" x1="120.48" x2="303.2007" y1="800.2438" y2="800.2438"/><text fill="#000000" font-family="Roboto" font-size="14" lengthAdjust="spacing" textLength="104.2617" x="159.7095" y="791.942">Usage Tracked</text><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="162.7207" x="125.48" y="816.3824">scripts/track-mcp-usage.sh</text><text fill="#000000" font-family="Roboto" font-size="12" lengthAdjust="spacing" textLength="147.9258" x="125.48" y="830.3512">records which tools fired</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="9" id="ent0002"><ellipse cx="200.84" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="50" id="ent0003"><path d="M322.45,124.2969 L322.45,170.6969 L287.56,174.6969 L322.45,178.6969 L322.45,225.0938 A0,0 0 0 0 322.45,225.0938 L559.2322,225.0938 A0,0 0 0 0 559.2322,225.0938 L559.2322,134.2969 L549.2322,124.2969 L322.45,124.2969 A0,0 0 0 0 322.45,124.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M549.2322,124.2969 L549.2322,134.2969 L559.2322,134.2969 L549.2322,124.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Roboto" font-size="13" lengthAdjust="spacing" textLength="165.4009" x="328.45" y="141.3638">The tier split is defined in</text><text fill="#000000" font-family="Roboto" font-size="13" lengthAdjust="spacing" textLength="204.2295" x="328.45" y="156.4966">.claude/rules/mcp-strategy.md.</text><text fill="#000000" font-family="Roboto" font-size="13" lengthAdjust="spacing" textLength="209.9614" x="328.45" y="171.6294">Loading all tools unconditionally</text><text fill="#000000" font-family="Roboto" font-size="13" lengthAdjust="spacing" textLength="198.2246" x="328.45" y="186.7622">would consume 85-95% of the</text><text fill="#000000" font-family="Roboto" font-size="13" lengthAdjust="spacing" textLength="215.7822" x="328.45" y="201.895">context budget before the model</text><text fill="#000000" font-family="Roboto" font-size="13" lengthAdjust="spacing" textLength="183.2061" x="328.45" y="217.0278">sees the user's first prompt.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="59" id="ent0006"><path d="M337.85,770.7969 L337.85,802.0569 L303.57,806.0569 L337.85,810.0569 L337.85,841.3281 A0,0 0 0 0 337.85,841.3281 L557.8363,841.3281 A0,0 0 0 0 557.8363,841.3281 L557.8363,780.7969 L547.8363,770.7969 L337.85,770.7969 A0,0 0 0 0 337.85,770.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M547.8363,770.7969 L547.8363,780.7969 L557.8363,780.7969 L547.8363,770.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Roboto" font-size="13" lengthAdjust="spacing" textLength="187.6177" x="343.85" y="787.8638">Usage telemetry informs tier</text><text fill="#000000" font-family="Roboto" font-size="13" lengthAdjust="spacing" textLength="198.9863" x="343.85" y="802.9966">promotion decisions: a heavily</text><text fill="#000000" font-family="Roboto" font-size="13" lengthAdjust="spacing" textLength="197.1455" x="343.85" y="818.1294">used Tier 3 tool may graduate</text><text fill="#000000" font-family="Roboto" font-size="13" lengthAdjust="spacing" textLength="130.5205" x="343.85" y="833.2622">to Tier 2, and so on.</text></g><!--link *start* to SessionStart--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="9" id="lnk3"><path d="M200.84,63.6669 C200.84,78.9469 200.84,104.0769 200.84,129.3269" fill="none" id="*start*-to-SessionStart" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="200.84,135.3269,204.84