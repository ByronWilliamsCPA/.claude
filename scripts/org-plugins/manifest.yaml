# Classification manifest for org-wide plugin distribution.
#
# This is the single source of truth for what leaves this repo and ships to
# the private plugin repo (target_repo below). scripts/org-plugins/build_org_plugins.py
# reads this file and nothing else to decide what to copy; it does not infer
# classification from file contents. Add new agents/skills here deliberately
# before they can ship org-wide. See docs/architecture/org-plugin-distribution.md
# for the full rationale and how to update this file.
#
# Skill classification values:
#   portable          - no dependency on Agent/Task, TodoWrite, or MCP tools.
#                        Ships in both wff-code and wff-chat.
#   claude-code-only   - depends on Agent/Task, TodoWrite, or MCP tools, or is
#                        otherwise first-party but only functions in Claude
#                        Code. Ships in wff-code only.
#   exclude            - not shipped anywhere. Used for skills that are deltas
#                        on a vendored/third-party companion (submodule-sourced,
#                        under its own license) that has not been cleared for
#                        redistribution into a separate plugin repo, or that
#                        need a follow-up fix (e.g. a hardcoded local path)
#                        before they're portable outside this repo.
#
# Agents are all claude-code-only by construction (no subagent-dispatch
# surface exists on claude.ai chat/Cowork), so there's no per-agent
# classification: the `agents` list below is the full first-party inclusion
# set for wff-code. Vendored/symlinked agents (anthropics-plugins,
# reference-library, image-generation submodules) are deliberately excluded
# from v1 to avoid re-distributing third-party or same-maintainer-but-separately-
# licensed content through a second channel; add them explicitly here only
# after a license check, matching the submodule admission bar in
# docs/architecture/submodule-strategy.md.

target_repo: "ByronWilliamsCPA/plugin"  # confirm after the williaby/plugin transfer completes

plugins:
  wff-code:
    description: "Full internal Claude Code toolkit: first-party agents plus all first-party skills"
    include_agents: true
    skill_classifications: [portable, claude-code-only]
  wff-chat:
    description: "claude.ai chat/Desktop/Cowork-safe skill subset (no agents, no Agent/Task/MCP dependency)"
    include_agents: false
    skill_classifications: [portable]

