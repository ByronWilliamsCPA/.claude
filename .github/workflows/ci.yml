# CI/CD Pipeline for Claude Code Configuration
# Delegates to the org-level reusable CI workflow for standard quality gates.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: CI (Python 3.12)
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: ByronWilliamsCPA/.github/.github/workflows/python-ci.yml@9094060cab9ec14e8fb2775965e8872e7d347d9d # v7.0.2
    with:
      python-version: "3.12"
      coverage-threshold: 80
      # claude-config has no published wheel; the shared workflow defaults
      # no-build: true which would block the editable install.
      no-build: false

  # ==========================================================================
  # Manifest self-consistency: validates docs/standards-manifest.yaml invariants
  # (severity/override-eligibility coherence, unique IDs, known domains). Runs as
  # a separately named check so a manifest contradiction surfaces clearly rather
  # than buried in the reusable workflow's pytest output.
  # ==========================================================================
  manifest-consistency:
    name: Manifest self-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Validate manifest consistency
        # --no-cov: this job runs a single validation file, so the repo-wide
        # --cov-fail-under in pyproject addopts would measure src/ coverage
        # against one test file and fail. Coverage is enforced by the full
        # suite in the ci job and the coverage workflow, not here.
        run: uv run pytest tests/unit/test_manifest_consistency.py -v --no-cov

  # ==========================================================================
  # setup.sh hook-merge tests: bats suite guarding merge_hooks() union-merge
  # semantics and the doctor drift check. Scoped to the one bats file; the
  # reusable Python workflow does not discover or run bats tests.
  # ==========================================================================
  setup-hooks-tests:
    name: Setup hooks tests (bats)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install bats
        # Local install (not -g): global npm installs hit EACCES on the
        # runner's /usr/local without sudo, and this mirrors the documented
        # local invocation (npx --no-install bats).
        run: npm install --no-save bats@1.13.0
      - name: Run setup.sh hook merge tests
        run: npx --no-install bats tests/test_setup_hooks.bats

  # ==========================================================================
  # CI Gate: aggregates the CI result; must pass for branch protection
  # ==========================================================================
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci, manifest-consistency, setup-hooks-tests]
    if: always()
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Check CI results
        env:
          CI_RESULT: ${{ needs.ci.result }}
          MANIFEST_RESULT: ${{ needs.manifest-consistency.result }}
          SETUP_HOOKS_RESULT: ${{ needs.setup-hooks-tests.result }}
        run: |
          if [ "$CI_RESULT" != "success" ]; then
            echo "::error::CI Gate failed: CI result is $CI_RESULT"
            exit 1
          fi
          if [ "$MANIFEST_RESULT" != "success" ]; then
            echo "::error::CI Gate failed: manifest-consistency result is $MANIFEST_RESULT"
            exit 1
          fi
          if [ "$SETUP_HOOKS_RESULT" != "success" ]; then
            echo "::error::CI Gate failed: setup-hooks-tests result is $SETUP_HOOKS_RESULT"
            exit 1
          fi
          echo "CI Gate passed"
