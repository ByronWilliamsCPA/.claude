# CI/CD Pipeline for Claude Code Configuration
# Delegates to the org-level reusable CI workflow for standard quality gates.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: CI (Python 3.12)
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: ByronWilliamsCPA/.github/.github/workflows/python-ci.yml@c50e799abfcd10e904749319f1b322f7eac7a813 # main
    with:
      python-version: "3.12"
      coverage-threshold: 80

  # ==========================================================================
  # CI Gate: aggregates the CI result; must pass for branch protection
  # ==========================================================================
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci]
    if: always()
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
      - name: Check CI results
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          if [ "$CI_RESULT" != "success" ]; then
            echo "::error::CI Gate failed: CI result is $CI_RESULT"
            exit 1
          fi
          echo "CI Gate passed"
