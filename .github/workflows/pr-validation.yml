# PR Validation for Claude Code Configuration
# Supplementary pull request checks: dead code, documentation links, and Qlty smells.
#
# #CRITICAL: this workflow no longer calls the org-level python-ci.yml reusable.
# That call was a duplicate of ci.yml's `ci` job, which already runs it once per
# PR and gates on it via the "CI Gate" required check. Removing the duplicate
# here does not reduce enforcement: CI Gate remains the sole required context
# tied to the reusable's pass/fail.
# #VERIFY: after merging, confirm a PR run shows python-ci.yml executing exactly
# once (in the CI workflow) and that CI Gate still blocks on its failure.
name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master
      - develop
  merge_group:

# Cancel in-progress runs for same PR (or merge_group ref when queued)
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ==========================================================================
  # Additional Checks (Template-Specific)
  # ==========================================================================

  # Dead Code Detection with Vulture
  dead-code:
    name: Dead Code Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-local-path: ".uv-cache"

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run vulture
        run: |
          echo "## Dead Code Report" >> "$GITHUB_STEP_SUMMARY"
          uv run --frozen vulture src/ --min-confidence 90 | tee vulture-report.txt || true
          if [ -s vulture-report.txt ]; then
            { echo '```'; cat vulture-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Potential dead code detected. Review vulture report."
          else
            echo "No dead code detected with 90% confidence." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Documentation Link Check
  link-check:
    name: Documentation Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Check documentation links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,206,301,302,403,429
            --exclude-mail
            --exclude '^https://github.com/.*/(issues|pulls|compare)/.*$'
            --exclude '^https://linear.app/.*$'
            './docs/**/*.md'
            './README.md'
            './CONTRIBUTING.md'
          fail: false
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # Qlty Checks: runs all enabled plugins in .qlty/qlty.toml (ruff, basedpyright, bandit, smells)
  # on PR diff only. Not smells-only; all configured checks run and can fail this gate.
  # For non-Python diffs, plugin linters produce no findings and exit 0 (handled gracefully).
  qlty-smells:
    name: Qlty Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0  # full history required; diff against base needs merge-base to be reachable

      - name: Fetch base ref for diff
        run: git fetch origin "$GITHUB_BASE_REF"

      - name: Install Qlty
        uses: qltysh/qlty-action/install@fd52dc852530a708d68c3b7342f8d33d1df4cd55  # v2

      - name: Run qlty check
        run: |
          # --diff-filter=ACMR excludes Deleted paths; qlty check errors on a
          # path that no longer exists in the working tree (deletion-only PRs).
          # The symlink filter (! -L) excludes symlinks whose targets are not
          # resolvable without submodules, which also causes qlty to abort.
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=ACMR "origin/$GITHUB_BASE_REF" \
            | while IFS= read -r f; do test ! -L "$f" && echo "$f"; done)
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No changed files to check"
            exit 0
          fi
          # Skip symlinks: their targets may be absent when submodules are not
          # checked out, and qlty errors before reading exclude_patterns in that case.
          CHECKABLE=()
          for f in "${CHANGED[@]}"; do
            [[ -L "$f" ]] && { echo "Skipping symlink: $f"; continue; }
            CHECKABLE+=("$f")
          done
          if [ "${#CHECKABLE[@]}" -eq 0 ]; then
            echo "No non-symlink changed files to check"
            exit 0
          fi
          qlty check "${CHECKABLE[@]}"


  # #ASSUME: PR-time Qlty coverage upload is dropped along with core-validation,
  # its only artifact source in this workflow (the coverage-reports artifact was
  # produced by the duplicate reusable call, not by ci.yml's job, since GitHub
  # Actions artifacts are scoped to the workflow run that created them).
  # Post-merge coverage upload to Qlty is unaffected: coverage.yml already
  # downloads coverage-reports from the CI workflow run via workflow_run and
  # uploads it independently of this file.
  # #VERIFY: confirm coverage.yml's "Upload Coverage to Qlty" job still runs and
  # succeeds after a merge to main/master.


  # ==========================================================================
  # Dependency & Standards Validation Gate
  # ==========================================================================
  validation-summary:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [dead-code, link-check, qlty-smells]
    if: always()
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check validation results
        env:
          DEAD_CODE_RESULT: ${{ needs.dead-code.result }}
          LINK_CHECK_RESULT: ${{ needs.link-check.result }}
          QLTY_SMELLS_RESULT: ${{ needs.qlty-smells.result }}
        run: |
          {
            echo "## PR Validation Summary"
            echo ""

            if [ "$DEAD_CODE_RESULT" == "success" ]; then
              echo "Dead Code Check: Passed"
            else
              echo "Dead Code Check: $DEAD_CODE_RESULT"
            fi

            if [ "$LINK_CHECK_RESULT" == "success" ]; then
              echo "Link Check: Passed"
            else
              echo "Link Check: $LINK_CHECK_RESULT"
            fi

            if [ "$QLTY_SMELLS_RESULT" == "success" ]; then
              echo "Qlty Checks: Passed"
            else
              echo "Qlty Checks: $QLTY_SMELLS_RESULT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          BLOCK=0
          if [ "$DEAD_CODE_RESULT" == "failure" ]; then BLOCK=1; fi
          if [ "$QLTY_SMELLS_RESULT" == "failure" ]; then BLOCK=1; fi
          if [ "$BLOCK" == "1" ]; then
            echo "One or more required checks failed. Please review and fix issues." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All validation checks passed!" >> "$GITHUB_STEP_SUMMARY"
