# Auditor Regression
# Runs the compliance auditor against the seeded fixture corpus to catch silent
# drift in LLM-interpreted verify logic. The structural fixture assertions also
# run in the CI Gate; this workflow adds the auditor-against-fixtures run on a
# weekly cron and whenever the manifest or an auditor prompt changes.
name: Auditor Regression

on:
  schedule:
    - cron: '0 3 * * 0'  # Sundays at 03:00 UTC (offset from mutation-testing)
  workflow_dispatch:
  push:
    paths:
      - 'docs/standards-manifest.yaml'
      - '.claude/skills/repo-compliance/**'
      - '.claude/agents/**auditor**'
      - 'data/test_fixtures/compliance_auditor/**'
      - 'scripts/check-repo-compliance.py'
      - 'scripts/run-auditor-regression.sh'
      - 'tests/integration/test_auditor_regression.py'

concurrency:
  group: auditor-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Auditor Regression Fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Structural fixture assertions
        # --no-cov: this job runs a single integration test file, so the repo-wide
        # --cov-fail-under in pyproject addopts would measure src/ coverage (near zero
        # here) and fail the gate even though all fixture assertions pass. Coverage of
        # src/ is enforced by the main test jobs, not this targeted fixture run.
        run: uv run pytest tests/integration/test_auditor_regression.py -v --no-cov

      - name: Auditor regression against fixtures
        run: bash scripts/run-auditor-regression.sh
