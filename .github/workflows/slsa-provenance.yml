# SLSA Provenance Generation
# Generates SLSA Level 3 provenance attestations for published packages.
#
# Pattern: Download pre-built artifacts from the GitHub Release that the
# Semantic Release workflow just created, compute base64 SHA256 subjects
# from those downloaded files, then call the official SLSA generator
# reusable workflow directly. Locally rebuilding with `uv build` would
# produce non-deterministic artifacts whose hashes diverge from what was
# actually published, defeating the purpose of supply chain provenance.
#
# Trigger model: `release: types: [published]` gives us the published
# tag deterministically via `github.event.release.tag_name`, avoiding the
# "latest release" race that a `workflow_run` trigger introduces when
# multiple semantic-release runs land close together.
#
# This workflow is the single canonical SLSA provenance path for the
# repository. The previous inline `provenance` job in `release.yml` was
# removed when this workflow was consolidated; do not re-introduce it.
#
# Reference: https://slsa.dev/
name: SLSA Provenance

on:
  # Fire when Semantic Release publishes a new GitHub Release. The release
  # event supplies `github.event.release.tag_name` so there is no need to
  # query for the latest tag at job-start time.
  release:
    types: [published]
  # Manual trigger for re-generating provenance against an existing tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (tag with or without leading v) to generate provenance for (e.g., 0.1.0 or v0.1.0)'
        required: true
        type: string

# Serialize runs so two close-together releases (or a release plus a manual
# re-attestation) do not race to upload `multiple.intoto.jsonl` to the same
# release. `cancel-in-progress: false` ensures an in-flight attestation
# completes rather than being killed mid-upload.
concurrency:
  group: slsa-provenance-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # ==========================================================================
  # Resolve Release Tag and Download Pre-Built Artifacts
  # ==========================================================================
  # NOTE: This job DOES NOT rebuild the package. SLSA provenance must attest
  # to the exact bytes that were published; rebuilding would yield different
  # sha256 (timestamps, build paths, tool versions) and break the chain.
  prepare:
    name: Prepare Subjects
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: |
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
            pipelines.actions.githubusercontent.com:443
            token.actions.githubusercontent.com:443

      - name: Resolve release tag
        id: tag
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            # Manual dispatch: validate input then normalize "0.1.0" / "v0.1.0"
            # to the actual tag GitHub used.
            if ! [[ "$INPUT_VERSION" =~ ^[A-Za-z0-9._+-]+$ ]]; then
              echo "::error::Invalid version input: must match ^[A-Za-z0-9._+-]+$"
              exit 1
            fi
            CAND="$INPUT_VERSION"
            if gh release view "$CAND" >/dev/null 2>&1; then
              TAG="$CAND"
            elif gh release view "v$CAND" >/dev/null 2>&1; then
              TAG="v$CAND"
            else
              echo "::error::No GitHub Release found for '$CAND' or 'v$CAND'"
              exit 1
            fi
          elif [ -n "${EVENT_TAG:-}" ]; then
            # release.published path: tag is supplied by the event payload,
            # deterministically bound to the release that triggered this run.
            TAG="$EVENT_TAG"
          else
            echo "::error::Unable to resolve a release tag (no INPUT_VERSION and no release.tag_name in payload)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Download release artifacts (pre-built)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Download only the Python distribution artifacts published by
          # the Semantic Release workflow. We intentionally do NOT rebuild.
          gh release download "$TAG" \
            --pattern '*.whl' \
            --pattern '*.tar.gz' \
            --dir dist
          # Verify at least one wheel and one sdist actually arrived. Without
          # this guard, an empty download produces an opaque sha256sum error
          # in the next step ("./*.whl: No such file or directory") rather
          # than an actionable message.
          shopt -s nullglob
          whls=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#whls[@]}" -eq 0 ] || [ "${#sdists[@]}" -eq 0 ]; then
            echo "::error::No matching artifacts in release '$TAG' (wheels: ${#whls[@]}, sdists: ${#sdists[@]}). Verify the Semantic Release job uploaded them via upload_to_vcs_release."
            exit 1
          fi
          echo "Downloaded artifacts:"
          ls -lh dist/

      - name: Generate SHA256 subjects (base64)
        id: hashes
        working-directory: dist
        run: |
          set -euo pipefail
          # Defense in depth: the prior step already guards artifact presence,
          # but re-validate here so any future refactor of the download step
          # cannot silently lose the protection.
          shopt -s failglob
          if ! compgen -G "./*.whl" >/dev/null || ! compgen -G "./*.tar.gz" >/dev/null; then
            echo "::error::Expected .whl and .tar.gz artifacts not found in dist/"
            ls -la
            exit 1
          fi
          HASHES=$(sha256sum ./*.whl ./*.tar.gz | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

  # ==========================================================================
  # SLSA Level 3 Provenance
  # ==========================================================================
  # Calls the official SLSA generator directly. The org-level python-slsa.yml
  # is a documentation template (workflow_dispatch only), not a callable
  # reusable workflow, so the direct invocation here is the supported path.
  provenance:
    name: Generate SLSA Provenance
    needs: [prepare]
    permissions:
      actions: read       # SLSA generator reads this workflow's run metadata to bind the provenance to it
      id-token: write     # OIDC token issuance for signing the provenance via Sigstore (fulcio/rekor)
      contents: write     # Upload the generated `multiple.intoto.jsonl` asset to the GitHub Release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a  # v2.1.0
    with:
      base64-subjects: ${{ needs.prepare.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.prepare.outputs.tag }}
      provenance-name: multiple.intoto.jsonl
