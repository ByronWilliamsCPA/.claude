# Python Compatibility Matrix Testing for Claude Code Configuration
# Tests the project across multiple Python versions and operating systems.
#
# This is a thin caller to the org-level reusable workflow.
name: Python Compatibility

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    # Weekly compatibility check on Sundays at 6 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: python-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: Python Compatibility Matrix
    uses: ByronWilliamsCPA/.github/.github/workflows/python-compatibility.yml@7aaf24d13d9ff61d0d231797bfa6fd3cad478e2b  # v7.1.12
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'
      operating-systems: '["ubuntu-latest"]'
      include-macos: true
      include-windows: true
      source-directory: 'src'
      # claude-config has no published wheel; the shared workflow defaults
      # no-build: true which would block the editable install.
      no-build: false
      # Marker filter intentionally omitted: the org reusable workflow runs
      # `uv run $TEST_COMMAND` with the variable unquoted (shellcheck SC2086
      # disabled). Embedded quotes around `-m "not slow and not integration"`
      # are stripped by YAML parsing then word-split by the shell, so pytest
      # sees `-m '"not'` (matching no markers) plus stray path args, collects
      # zero tests, and exits with code 5. Path-based `--ignore=tests/integration`
      # already covers the intent. Restore the marker filter only after the
      # org reusable workflow uses `bash -c "$TEST_COMMAND"` with proper quoting.
      test-command: 'pytest tests/ -v --tb=short -x --ignore=tests/integration --ignore=tests/load'
      coverage-report: false
      fail-fast: false
      timeout-minutes: 30
