# Qlty Coverage Reporting Workflow for dot-claude repository
# Runs pytest with coverage and uploads results to Qlty for code quality tracking.
#
# Features:
#   - Runs test suite with coverage collection
#   - Uploads coverage data to Qlty (supplements Codecov for code quality metrics)
#   - Supply chain hardened with pinned SHA refs
name: Coverage (Qlty)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: |
          uv run pytest -v --cov=src/claude_config --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Verify coverage report exists
        run: |
          if [ ! -f coverage.xml ]; then
            echo "coverage.xml not found; test run may have failed or coverage reporting is misconfigured" >&2
            exit 1
          fi

      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@a19242102d17e497f437d7466aa01b528537e899 # v2.2.0
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage.xml
