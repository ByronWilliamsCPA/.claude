# Security Analysis Workflow for Claude Code Configuration
# Delegates security scans (Bandit, pip-audit, Ruff) to the org-level reusable workflow.
#
# Delegates to the org-level reusable security analysis workflow.
name: Security Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run security scans weekly on Monday at 9 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

jobs:
  security:
    name: Security Analysis
    uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@c22009ccaab0d3234819d30d9d7a03d53c531cb9 # main
    with:
      python-version: "3.12"
