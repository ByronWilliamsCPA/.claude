# Security Analysis Workflow for Claude Code Configuration
# Delegates security scans to the org-level reusable workflow.
name: Security Analysis

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly scan on Mondays at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: security-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  security:
    name: Security Analysis
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read
    uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@6f71aecae2c91214ca0a0a2206a36cf912aa31ac # v1.1.0
    with:
      python-version: "3.12"
      # safety is not in this project's dev deps; pip-audit covers the same
      # vulnerability surface and is already in [project.optional-dependencies]
      run-safety: false
      # CodeQL is handled by the dedicated codeql.yml workflow to avoid
      # duplicate runs and double Security tab entries.
      run-codeql: false
      # Dependency Review is available (public repo) but handled separately;
      # enable here if the org workflow adds value beyond what dependabot covers.
      run-dependency-review: false
      # osv-scanner-action v2.2.4 has a bug where IgnoredVulns entries that
      # actively filter a finding are still reported as "unused", causing exit 1.
      # The py/PYSEC-2022-42969 entry correctly filters the disputed ReDoS vuln
      # but is marked unused after filtering. pip-audit (dev dep) covers the same
      # surface. Re-enable once the org workflow updates to osv-scanner >= 2.3.0.
      run-osv: false
      # claude-config has no published wheel; the shared workflow defaults
      # no-build: true which would block the editable install.
      no-build: false
      # Bandit runs twice already via python-ci.yml, which is called by both
      # ci.yml and pr-validation.yml. Running it here a third time on the same
      # commit is pure duplication with no additional signal.
      run-bandit: false

  # ==========================================================================
  # Security Gate Validation: aggregates the security scan result
  # ==========================================================================
  security-gate-validation:
    name: Security Gate Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [security]
    if: always()
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9ca718d3bf646d6534007c269a635b3e54cadf99  # v2.19.2
        with:
          egress-policy: audit
      - name: Check security scan results
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          if [ "$SECURITY_RESULT" != "success" ]; then
            echo "::error::Security Gate Validation failed: security scan result is $SECURITY_RESULT"
            exit 1
          fi
          echo "Security Gate Validation passed"
