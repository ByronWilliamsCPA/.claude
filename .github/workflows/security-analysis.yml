# Security Analysis Workflow for Claude Code Configuration
# Delegates security scans to the org-level reusable workflow.
name: Security Analysis

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

jobs:
  security:
    name: Security Analysis
    uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@c22009ccaab0d3234819d30d9d7a03d53c531cb9 # main
    with:
      python-version: "3.12"
      # safety is not in this project's dev deps; pip-audit covers the same
      # vulnerability surface and is already in [project.optional-dependencies]
      run-safety: false
      # CodeQL SARIF upload requires GitHub Advanced Security (GHAS); this
      # private repo does not have GHAS enabled
      run-codeql: false
      # Dependency Review requires GHAS Dependency Graph on private repos
      run-dependency-review: false
      # osv-scanner-action v2.2.4 has a bug where IgnoredVulns entries that
      # actively filter a finding are still reported as "unused", causing exit 1.
      # The py/PYSEC-2022-42969 entry correctly filters the disputed ReDoS vuln
      # but is marked unused after filtering. pip-audit (dev dep) covers the same
      # surface. Re-enable once the org workflow updates to osv-scanner >= 2.3.0.
      run-osv: false
