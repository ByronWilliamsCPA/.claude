name: Sign Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  sign:
    name: Sign release artifacts with cosign
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@91182cccc01eb5e619878b0bd9d3b20fd1cca3ab  # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da  # v3.7.0

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets/ || echo "No assets to sign"

      - name: Sign release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          cd release-assets
          for artifact in *.whl *.tar.gz; do
            [ -f "$artifact" ] || continue
            cosign sign-blob \
              --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem" \
              "$artifact"
          done

      - name: Upload signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          cd release-assets
          sigs=$(ls *.sig *.pem 2>/dev/null || true)
          if [ -n "$sigs" ]; then
            gh release upload "$TAG" $sigs --clobber
          fi
