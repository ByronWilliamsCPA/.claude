# OpenSSF Scorecard for Claude Code Configuration
# Delegates to the org-level reusable Scorecard workflow.
#
# Dashboard: https://securityscorecards.dev/viewer/?uri=github.com/ByronWilliamsCPA/.claude
# Documentation: https://github.com/ossf/scorecard
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly on Tuesdays at 21:21 UTC
    - cron: '21 21 * * 2'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard Analysis
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    uses: ByronWilliamsCPA/.github/.github/workflows/python-scorecard.yml@d5cf99101d4150ae5832d154cb42993705a09e31  # v7.0.1
    with:
      # publish-results: false -- OIDC repository claim resolves to org .github repo
      # when called as a reusable callee; setting true would publish to wrong repo.
      # Fix requires updating the org reusable workflow.
      publish-results: false
