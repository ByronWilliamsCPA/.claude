# Dependency Review for Claude Code Configuration
# Catches newly introduced vulnerable dependencies on every PR before they merge.
# Uses GitHub's vulnerability database to flag dependencies added or updated
# in the PR diff -- distinct from pip-audit, which audits the full lock file.
name: Dependency Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9ca718d3bf646d6534007c269a635b3e54cadf99  # v2.19.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # Block merges that introduce HIGH or CRITICAL vulnerabilities.
          # MODERATE and LOW findings appear in the PR comment as warnings.
          fail-on-severity: high
          warn-only: false
          # Comment on the PR with a summary of findings (requires pull-requests: write).
          comment-summary-in-pr: always
