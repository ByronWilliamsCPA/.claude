# Dependency Review for Claude Code Configuration
# Catches newly introduced vulnerable dependencies on every PR before they merge.
# Uses GitHub's vulnerability database to flag dependencies added or updated
# in the PR diff -- distinct from pip-audit, which audits the full lock file.
name: Dependency Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # Block merges that introduce HIGH or CRITICAL vulnerabilities.
          # MODERATE and LOW findings appear in the PR comment as warnings.
          fail-on-severity: high
          warn-only: false
          # License policy (standards-manifest CI-079): block PRs that introduce
          # strong-copyleft licenses (GPL/AGPL) into the dependency graph. This
          # mirrors the GPL/AGPL core of the python-sbom.yml forbidden-licenses
          # denylist; the two lists are kept in sync. LGPL and MPL are not denied
          # at PR time because certifi (MPL-2.0) is a near-universal transitive
          # dependency and denying MPL here would break unrelated PRs. The full
          # LGPL/MPL advisory sweep runs post-merge via the SBOM gate (CI-078).
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          # Comment on the PR with a summary of findings (requires pull-requests: write).
          comment-summary-in-pr: always
