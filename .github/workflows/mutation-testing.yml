# Mutation Testing
# Validates test effectiveness by introducing code mutations and checking the test suite catches them.
# Runs on a weekly cron (report-only) and on manual workflow_dispatch.
# Not run on PRs: the wall-clock cost (60+ minutes) outweighs the per-PR signal,
# and weekly drift detection covers the regression-spotting need.
#
# Prerequisite: python-mutation.yml reusable workflow in ByronWilliamsCPA/.github.
# Applicable to Python repos with 80%+ baseline coverage.
name: Mutation Testing

on:
  schedule:
    - cron: '0 2 * * 0'  # Sundays at 02:00 UTC
  workflow_dispatch:
    inputs:
      mutation_threshold:
        description: 'Minimum mutation score threshold (%)'
        required: false
        default: '80'
        type: string
      fail_under_threshold:
        description: 'Fail the run if score is below threshold (default: false)'
        required: false
        default: 'false'
        type: string

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  mutation:
    name: Mutation Testing
    uses: ByronWilliamsCPA/.github/.github/workflows/python-mutation.yml@f9625c5513a031a3d3a127681ee9d238e38c313e  # v7.0.3
    with:
      python-version: '3.12'
      source-directory: 'src'
      test-directory: 'tests'
      mutation-threshold: ${{ github.event.inputs.mutation_threshold && fromJSON(github.event.inputs.mutation_threshold) || 80 }}
      fail-under-threshold: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fail_under_threshold == 'true' }}
      post-pr-comment: false
      timeout-minutes: 60
      # claude-config has no published wheel; the shared workflow defaults
      # no-build: true which would block the editable install.
      no-build: false
    secrets: inherit  # pragma: allowlist secret
