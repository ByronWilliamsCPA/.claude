# Mutation Testing
# Validates test effectiveness by introducing code mutations and checking the test suite catches them.
# Runs on PRs touching source/tests; fails if mutation score drops below threshold.
# Scheduled weekly runs report only (no failure) to detect drift without blocking.
#
# Prerequisite: python-mutation.yml reusable workflow in ByronWilliamsCPA/.github.
# Applicable to Python repos with 80%+ baseline coverage.
name: Mutation Testing

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      mutation_threshold:
        description: 'Minimum mutation score threshold (%)'
        required: false
        default: '80'
        type: string
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  mutation:
    name: Mutation Testing
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ByronWilliamsCPA/.github/.github/workflows/python-mutation.yml@main
    with:
      python-version: '3.12'
      source-directory: 'src'
      test-directory: 'tests'
      mutation-threshold: ${{ github.event.inputs.mutation_threshold && fromJSON(github.event.inputs.mutation_threshold) || 80 }}
      fail-under-threshold: ${{ github.event_name != 'schedule' }}
      post-pr-comment: true
      timeout-minutes: 60
    secrets: inherit  # pragma: allowlist secret
