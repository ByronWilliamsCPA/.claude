# Vale configuration for this repo.
# Runs on staged Markdown files via pre-commit.
# Enforces the banned-term policy in .claude/rules/writing.md.
#
# MinAlertLevel = warning: day-one posture so new violations surface as
# warnings rather than hard errors. Raise to error once the existing
# corpus is clean.

StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Claude
